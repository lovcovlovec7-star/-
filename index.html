<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Laneforge Duel</title>
  <style>
    :root {
      --bg: #0c1220;
      --panel: #18243a;
      --panel2: #10192b;
      --text: #e8f2ff;
      --accent: #6ad7ff;
      --danger: #ff6b6b;
      --good: #76e39e;
      --glow: #95d7ff;
    }
    html, body { margin: 0; width: 100%; height: 100%; background: radial-gradient(circle at top,#223854,#090e16 65%); color: var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
    #app { position: fixed; inset: 0; display: grid; place-items: center; }
    #gameWrap { width: min(95vw, 58vh); height: min(95vh, 170vw); aspect-ratio: 9/16; position: relative; border-radius: 18px; overflow: hidden; box-shadow: 0 24px 70px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.08); background: #20334b; }
    canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .overlay { position: absolute; inset: 0; display: grid; place-items: center; background: linear-gradient(to bottom,rgba(4,8,18,.35),rgba(3,9,16,.9)); }
    .card { background: linear-gradient(165deg,#2f4c70,#1a2940); border: 1px solid rgba(143,201,255,.34); border-radius: 14px; padding: 20px; text-align: center; width: min(86%, 340px); box-shadow: 0 16px 40px rgba(4,12,22,.6), inset 0 0 40px rgba(128,198,255,.08); }
    .btn { border: 0; border-radius: 11px; padding: 12px 16px; font-weight: 700; color: #07202f; background: linear-gradient(180deg,#7be4ff,#4fc1f2); cursor: pointer; width: 100%; transition: transform .15s, box-shadow .15s; }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 0 20px rgba(111,208,255,.45); }
    .btn + .btn { margin-top: 10px; }
    .small { margin-top: 10px; color: #b4c8de; font-size: 13px; }
    #hint { position: absolute; left: 50%; bottom: 166px; transform: translateX(-50%); pointer-events: none; font-weight: 700; text-shadow: 0 3px 8px rgba(0,0,0,.7); opacity: 0; transition: opacity .25s; }
  </style>
</head>
<body>
<div id="app">
  <div id="gameWrap">
    <canvas id="game" width="900" height="1600"></canvas>
    <div id="menu" class="overlay">
      <div class="card">
        <h2 style="margin-top:0">Laneforge Duel</h2>
        <p>Lane-based real-time card battler (offline).</p>
        <button id="playBtn" class="btn">Play vs Bot</button>
        <div class="small">Drag cards to deploy. Defend both lanes, break more towers, win the match.</div>
      </div>
    </div>
    <div id="hint"></div>
  </div>
</div>
<script>
(() => {
  'use strict';
  const W = 900, H = 1600;
  const SIDES = { PLAYER: 'player', ENEMY: 'enemy' };
  const TEAM_COLOR = { player: '#8cd8ff', enemy: '#ffae98' };

  const BALANCE_CONFIG = {
    game: {
      duration: 180, overtime: 60, tickRate: 60,
      elixirMax: 10, elixirRegen: 1/2.8, elixirRegenOvertimeMult: 2,
      towerDamageOvertimeDrain: 10, maxUnits: 70,
    },
    lanes: { leftX: 300, rightX: 600, bridgeY1: 760, bridgeY2: 840, riverY1: 720, riverY2: 880 },
    pressure: { damageBonus: 0.05, speedBonus: 0.05, threshold: 2 },
    crit: { chance: 0.12, mul: 1.45 },
    towers: {
      side: { hp:2200, range:250, attackSpeed:1.05, dmg:90, chargeTime:0.18, projectileSpeed:460 },
      core: { hp:3300, range:280, attackSpeed:0.85, dmg:110, dormantMul:0.35, chargeTime:0.22, projectileSpeed:500 },
    },
    cards: {
      blade_runner:{name:'Blade Runner',type:'unit',rarity:'common',cost:2,unit:'blade_runner'},
      shield_brute:{name:'Shield Brute',type:'unit',rarity:'rare',cost:4,unit:'shield_brute'},
      arc_shooter:{name:'Arc Shooter',type:'unit',rarity:'common',cost:3,unit:'arc_shooter'},
      spark_mage:{name:'Spark Mage',type:'unit',rarity:'epic',cost:4,unit:'spark_mage'},
      sky_drone:{name:'Sky Drone',type:'unit',rarity:'rare',cost:3,unit:'sky_drone'},
      swarm_pack:{name:'Swarm Pack',type:'unit',rarity:'common',cost:3,unit:'swarmling',count:5},
      fire_burst:{name:'Fire Burst',type:'spell',rarity:'rare',cost:4,spell:'fire_burst'},
      freeze_pulse:{name:'Freeze Pulse',type:'spell',rarity:'epic',cost:3,spell:'freeze_pulse'},
      dash_totem:{name:'Dash Totem',type:'spell',rarity:'common',cost:2,spell:'dash_totem'},
      lightning_pike:{name:'Lightning Pike',type:'spell',rarity:'legendary',cost:5,spell:'lightning_pike'},
    },
    units: {
      blade_runner:{hp:290,dmg:75,speed:110,atkRange:28,atkSpeed:1.1,aggro:150,target:'ground',attackType:'melee',building:true,radius:13},
      shield_brute:{hp:980,dmg:110,speed:72,atkRange:30,atkSpeed:0.8,aggro:170,target:'ground',attackType:'melee',building:true,radius:18},
      arc_shooter:{hp:340,dmg:92,speed:76,atkRange:200,atkSpeed:0.85,aggro:220,target:'both',attackType:'projectile',projectileSpeed:360,building:true,radius:14},
      spark_mage:{hp:300,dmg:80,speed:74,atkRange:180,atkSpeed:0.75,aggro:220,target:'both',attackType:'splash',splash:58,projectileSpeed:300,building:true,radius:14},
      sky_drone:{hp:250,dmg:70,speed:98,atkRange:150,atkSpeed:1.0,aggro:190,target:'both',attackType:'projectile',projectileSpeed:420,air:true,building:false,radius:13},
      swarmling:{hp:95,dmg:42,speed:122,atkRange:20,atkSpeed:1.2,aggro:120,target:'ground',attackType:'melee',building:true,radius:10},
    },
    spells: {
      fire_burst:{radius:95,dmg:250,castMin:120,castMax:1300},
      freeze_pulse:{radius:110,freeze:2.2,castMin:80,castMax:1300},
      dash_totem:{radius:120,duration:4.5,speedMul:1.5,castMin:0,castMax:900},
      lightning_pike:{radius:230,chains:3,dmg:190,castMin:140,castMax:1250},
    }
  };

  const RARITY = { common:'#b5c9db', rare:'#7bc6ff', epic:'#db8dff', legendary:'#ffd87d' };
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const dist = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);

  class SpatialGrid {
    constructor(size=120){ this.size=size; this.map=new Map(); }
    key(x,y){ return `${(x/this.size)|0},${(y/this.size)|0}`; }
    clear(){ this.map.clear(); }
    add(ent){ const k=this.key(ent.x,ent.y); if(!this.map.has(k)) this.map.set(k,[]); this.map.get(k).push(ent); }
    near(x,y,r){ const cs=this.size, out=[], cx=(x/cs)|0, cy=(y/cs)|0, cr=Math.ceil(r/cs); for(let ix=cx-cr;ix<=cx+cr;ix++) for(let iy=cy-cr;iy<=cy+cr;iy++){ const arr=this.map.get(`${ix},${iy}`); if(arr) out.push(...arr); } return out; }
  }

  class ParticleSystem {
    constructor(limit=700){ this.limit=limit; this.pool=[]; this.active=[]; }
    spawn(type,x,y,opts={}){
      const p=this.pool.pop()||{};
      p.type=type; p.x=x; p.y=y; p.vx=opts.vx??(Math.random()-0.5)*140; p.vy=opts.vy??(Math.random()-0.5)*130;
      p.life=opts.life??0.5; p.maxLife=p.life; p.size=opts.size??(2+Math.random()*3); p.color=opts.color||'#fff';
      p.lineFrom=opts.lineFrom||null; p.glow=opts.glow||0; this.active.push(p);
      if(this.active.length>this.limit){ const old=this.active.shift(); this.pool.push(old); }
    }
    burst(type,x,y,count,color){ for(let i=0;i<count;i++) this.spawn(type,x,y,{color}); }
    update(dt){
      for(let i=this.active.length-1;i>=0;i--){ const p=this.active[i]; p.life-=dt; if(p.life<=0){ this.pool.push(p); this.active.splice(i,1); continue; } p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; }
    }
    draw(ctx){
      for(const p of this.active){ const a=clamp(p.life/p.maxLife,0,1); ctx.globalAlpha=a;
        if(p.lineFrom){ ctx.strokeStyle=p.color; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p.lineFrom.x,p.lineFrom.y); ctx.lineTo(p.x,p.y); ctx.stroke(); continue; }
        ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
      }
      ctx.globalAlpha=1;
    }
  }

  class Entity { constructor(g,x,y,side){ this.g=g; this.x=x; this.y=y; this.side=side; this.dead=false; } update(){} draw(){} }

  class Tower extends Entity {
    constructor(g,x,y,side,kind,lane){
      super(g,x,y,side); this.kind=kind; this.lane=lane; const c=BALANCE_CONFIG.towers[kind];
      this.maxHp=c.hp; this.hp=c.hp; this.range=c.range; this.attackSpeed=c.attackSpeed; this.dmg=c.dmg; this.radius=kind==='core'?36:30;
      this.chargeTime=c.chargeTime; this.charge=0; this.attackCooldown=0; this.destroyed=false; this.fall=0;
    }
    takeDamage(d){ if(this.destroyed) return; this.hp-=d; this.g.fx.burst('hit',this.x,this.y,5,'#ffd3b0'); if(this.hp<=0){ this.hp=0; this.destroyed=true; this.fall=1.0; this.g.onTowerDown(this); } }
    update(dt){
      this.attackCooldown-=dt;
      if(this.destroyed){ this.fall=Math.max(0,this.fall-dt*1.4); return; }
      const canAwaken=this.kind!=='core' || this.g.hasDestroyedSideTower(this.side);
      let dmg=this.dmg; if(this.kind==='core'&&!canAwaken) dmg*=BALANCE_CONFIG.towers.core.dormantMul;
      const enemies=this.g.getEnemiesInRange(this.side,this.x,this.y,this.range,true);
      if(!enemies.length){ this.charge=Math.max(0,this.charge-dt*2); return; }
      const t=enemies.sort((a,b)=>dist(this,a)-dist(this,b))[0];
      if(this.attackCooldown<=0){ this.charge+=dt; if(this.charge>=this.chargeTime){ this.g.spawnProjectile(this,t,dmg,BALANCE_CONFIG.towers[this.kind].projectileSpeed,0,'#fff8e8'); this.attackCooldown=1/this.attackSpeed; this.charge=0; this.g.towerShotSfx(); } }
    }
    draw(ctx){
      ctx.save();
      ctx.translate(this.x,this.y);
      const tilt = this.destroyed ? (1-this.fall)*1.3*(this.side===SIDES.PLAYER?-1:1) : 0;
      ctx.rotate(tilt);
      ctx.fillStyle='rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(0,44,46,12,0,0,Math.PI*2); ctx.fill();
      const main=this.side===SIDES.PLAYER?'#5da0d9':'#d97567';
      const grad=ctx.createLinearGradient(0,-54,0,50); grad.addColorStop(0,'#d9e8f7'); grad.addColorStop(0.18,main); grad.addColorStop(1,'#2b3d57');
      ctx.fillStyle='#6e7788'; ctx.fillRect(-30,22,60,20);
      ctx.fillStyle=grad; ctx.beginPath(); ctx.roundRect(-24,-28,48,56,10); ctx.fill();
      ctx.fillStyle='#2a3a4d'; ctx.beginPath(); ctx.roundRect(-18,-44,36,18,6); ctx.fill();
      if(this.hp/this.maxHp<0.5&&!this.destroyed){ ctx.strokeStyle='rgba(32,20,20,.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-8,-8); ctx.lineTo(-2,10); ctx.lineTo(6,2); ctx.stroke(); }
      if(this.charge>0){ ctx.strokeStyle='rgba(255,235,170,.95)'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(0,-34,10,0,Math.PI*2*(this.charge/this.chargeTime)); ctx.stroke(); }
      if(!this.destroyed){ const hpW=68; ctx.fillStyle='rgba(0,0,0,.45)'; ctx.fillRect(-hpW/2,-60,hpW,8); ctx.fillStyle='#70f19b'; ctx.fillRect(-hpW/2,-60,hpW*(this.hp/this.maxHp),8); }
      ctx.restore();
    }
  }

  class Unit extends Entity {
    constructor(g,x,y,side,unitKey,lane){
      super(g,x,y,side); this.unitKey=unitKey; this.cfg=structuredClone(BALANCE_CONFIG.units[unitKey]); this.lane=lane;
      this.maxHp=this.cfg.hp; this.hp=this.cfg.hp; this.radius=this.cfg.radius; this.target=null; this.pathTgt=null;
      this.attackCd=Math.random()*0.25; this.speedBuff=1; this.speedBuffTimer=0; this.freeze=0; this.hitFlash=0; this.stagger=0;
      this.moveSpeed=0; this.vx=0; this.vy=0; this.facing=side===SIDES.PLAYER?-Math.PI/2:Math.PI/2; this.bob=0; this.attackAnim=0;
      this.stats={damage:0,kills:0,cards:0};
    }
    choosePath(){ const enemy=this.g.towers.filter(t=>t.side!==this.side && !t.destroyed && (t.kind==='side'?t.lane===this.lane:true)); return enemy.sort((a,b)=>Math.abs(a.y-this.y)-Math.abs(b.y-this.y))[0] || this.g.getCore(this.side===SIDES.PLAYER?SIDES.ENEMY:SIDES.PLAYER); }
    validTarget(e){ if(e.side===this.side||e.dead||e.destroyed) return false; if(this.cfg.target==='ground'&&e.air) return false; return true; }
    takeDamage(d){ if(this.dead) return; this.hp-=d; this.hitFlash=0.16; this.stagger=Math.max(this.stagger,0.11); this.g.fx.burst('hit',this.x,this.y,3,'#fff0ce'); if(this.hp<=0){ this.dead=true; this.g.fx.burst('explosion',this.x,this.y,11,'#ffc8c8'); } }
    attackDamage(){
      const pressure=this.g.getPressureBonus(this.side,this.lane);
      let dmg=this.cfg.dmg*(1+pressure.damage);
      const crit=Math.random()<BALANCE_CONFIG.crit.chance;
      if(crit){ dmg*=BALANCE_CONFIG.crit.mul; this.g.fx.spawn('lightning',this.x,this.y,{color:'#fff3a9',life:0.17,size:5,glow:1}); }
      return { dmg, crit };
    }
    doAttack(target){
      this.attackAnim=0.12;
      const payload=this.attackDamage();
      if(this.cfg.attackType==='melee'){ target.takeDamage(payload.dmg); this.g.registerDamage(this,payload.dmg,target.dead||target.destroyed); this.g.fx.burst('hit',target.x,target.y,7,payload.crit?'#ffe181':'#ffd6ad'); }
      else if(this.cfg.attackType==='projectile') this.g.spawnProjectile(this,target,payload.dmg,this.cfg.projectileSpeed||380,0,payload.crit?'#ffe98d':'#f5fffd',this);
      else this.g.spawnProjectile(this,target,payload.dmg,this.cfg.projectileSpeed||320,this.cfg.splash||48,payload.crit?'#ffde7d':'#ffef8e',this);
    }
    update(dt){
      if(this.dead) return;
      this.hitFlash=Math.max(0,this.hitFlash-dt); this.attackAnim=Math.max(0,this.attackAnim-dt*2.4); this.bob+=dt*7.5;
      this.freeze=Math.max(0,this.freeze-dt); this.stagger=Math.max(0,this.stagger-dt);
      if(this.speedBuffTimer>0){ this.speedBuffTimer-=dt; if(this.speedBuffTimer<=0) this.speedBuff=1; }
      this.attackCd-=dt;
      if(this.g.debug) this.g.debugCounts.pathChecks++;
      const near=this.g.grid.near(this.x,this.y,this.cfg.aggro).filter(e=>this.validTarget(e));
      if(near.length) this.target=near.sort((a,b)=>dist(this,a)-dist(this,b))[0];
      else if(!this.target || this.target.dead || this.target.destroyed) this.target=this.choosePath();
      if(!this.target) return;
      const d=dist(this,this.target); const attackRange=(this.target instanceof Tower && !this.cfg.building)?-1:this.cfg.atkRange+(this.target.radius||12);
      if(attackRange>0 && d<=attackRange){ this.moveSpeed*=0.84; if(this.attackCd<=0){ this.doAttack(this.target); this.attackCd=1/this.cfg.atkSpeed; } return; }

      let desiredX=(this.target.x-this.x), desiredY=(this.target.y-this.y); let l=Math.hypot(desiredX,desiredY)||1; desiredX/=l; desiredY/=l;
      if(!this.cfg.air && this.y>BALANCE_CONFIG.lanes.riverY1 && this.y<BALANCE_CONFIG.lanes.riverY2) desiredX+=(this.lane==='left'?-0.32:0.32);
      const sep=this.g.grid.near(this.x,this.y,34).filter(e=>e!==this&&e.side===this.side&&!e.dead);
      for(const o of sep){ const dx=this.x-o.x,dy=this.y-o.y,dl=Math.hypot(dx,dy)||1; if(dl<26){ desiredX+=dx/dl*0.56; desiredY+=dy/dl*0.56; } }
      l=Math.hypot(desiredX,desiredY)||1; desiredX/=l; desiredY/=l;

      const pressure=this.g.getPressureBonus(this.side,this.lane);
      const topSpeed=this.cfg.speed*this.speedBuff*(1+pressure.speed)*(this.freeze>0?0:1)*(this.stagger>0?0.55:1);
      this.moveSpeed += (topSpeed-this.moveSpeed)*0.13;
      this.vx += (desiredX*this.moveSpeed-this.vx)*0.22; this.vy += (desiredY*this.moveSpeed-this.vy)*0.22;
      this.x+=this.vx*dt; this.y+=this.vy*dt;
      if(Math.abs(this.vx)+Math.abs(this.vy)>45 && Math.random()<0.23) this.g.fx.spawn('dust',this.x,this.y+this.radius,{color:'rgba(185,155,120,.8)',life:0.32,size:2+Math.random()*2,vx:(Math.random()-0.5)*30,vy:25+Math.random()*20});
      this.facing += (Math.atan2(this.vy,this.vx)-this.facing)*0.2;
    }
    draw(ctx){
      if(this.dead) return;
      ctx.save();
      const bounce=Math.sin(this.bob)*2.2+(this.attackAnim>0?-4*this.attackAnim:0);
      ctx.translate(this.x,this.y+bounce);
      ctx.fillStyle='rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0,this.radius+11,this.radius*0.9,5,0,0,Math.PI*2); ctx.fill();
      ctx.rotate(this.facing+Math.PI/2);
      ctx.globalAlpha=this.freeze>0?0.72:1;
      ctx.fillStyle=this.hitFlash>0?'#ffffff':TEAM_COLOR[this.side];
      if(this.cfg.air){ ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#fff'; ctx.beginPath(); ctx.moveTo(-7,0);ctx.lineTo(7,0);ctx.stroke(); }
      else if(this.unitKey.includes('brute')){ ctx.fillRect(-this.radius,-this.radius,this.radius*2,this.radius*2); ctx.fillStyle='#d9ecff'; ctx.fillRect(-6,-9,12,18); }
      else if(this.unitKey.includes('mage')){ ctx.beginPath(); ctx.moveTo(0,-this.radius);ctx.lineTo(this.radius,this.radius);ctx.lineTo(-this.radius,this.radius);ctx.closePath();ctx.fill(); }
      else if(this.unitKey.includes('shooter')){ ctx.beginPath(); ctx.roundRect(-this.radius,-this.radius*0.7,this.radius*2,this.radius*1.4,6); ctx.fill(); }
      else { ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.fill(); }
      const hpW=28; ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(-hpW/2,-this.radius-14,hpW,4); ctx.fillStyle='#67e68f'; ctx.fillRect(-hpW/2,-this.radius-14,hpW*(this.hp/this.maxHp),4);
      ctx.restore();
    }
  }

  class Projectile extends Entity {
    constructor(g,src,target,dmg,speed,splash,color,owner){ super(g,src.x,src.y,src.side); this.target=target; this.dmg=dmg; this.speed=speed; this.splash=splash; this.color=color; this.owner=owner||null; }
    update(dt){
      if(!this.target || this.target.dead || this.target.destroyed){ this.dead=true; return; }
      const dx=this.target.x-this.x, dy=this.target.y-this.y, d=Math.hypot(dx,dy)||1; this.x += dx/d*this.speed*dt; this.y += dy/d*this.speed*dt;
      if(d<12){
        if(this.splash>0){ const victims=this.g.getEnemiesInRange(this.side,this.target.x,this.target.y,this.splash,true); for(const v of victims){ v.takeDamage(this.dmg); this.g.registerDamage(this.owner,this.dmg,v.dead||v.destroyed); } this.g.spellRings.push({x:this.target.x,y:this.target.y,r:this.splash,t:0.22,c:'#ffda7f'}); }
        else { this.target.takeDamage(this.dmg); this.g.registerDamage(this.owner,this.dmg,this.target.dead||this.target.destroyed); }
        this.g.fx.burst('impact',this.x,this.y,8,this.color); this.g.heavyHit(this.splash>0?5:2); this.dead=true;
      }
    }
    draw(ctx){ ctx.fillStyle=this.color; ctx.beginPath(); ctx.arc(this.x,this.y,4,0,Math.PI*2); ctx.fill(); }
  }

  class Deck {
    constructor(keys){ this.queue=[...keys]; this.hand=[]; while(this.hand.length<4) this.hand.push(this.queue.shift()); this.next=this.queue[0]; }
    play(i){ const c=this.hand[i]; this.queue.push(c); this.hand[i]=this.queue.shift(); this.next=this.queue[0]; return c; }
  }

  class PlayerState {
    constructor(deck){ this.elixir=5; this.deck=new Deck(deck); this.score=0; this.cardsPlayed=0; }
  }

  class Game {
    constructor(canvas){
      this.cv=canvas; this.ctx=canvas.getContext('2d'); this.grid=new SpatialGrid(120);
      this.fx=new ParticleSystem(720); this.units=[]; this.projectiles=[]; this.towers=[]; this.spellRings=[];
      this.debug=false; this.debugCounts={pathChecks:0}; this.state='menu'; this.matchTime=BALANCE_CONFIG.game.duration; this.overtimeLeft=BALANCE_CONFIG.game.overtime;
      this.inOvertime=false; this.gameSpeed=1; this.paused=false; this.drag=null; this.msg=''; this.cameraShake=0; this.cameraZoom=1; this.arenaT=0;
      this.player=new PlayerState(['blade_runner','shield_brute','arc_shooter','spark_mage','sky_drone','swarm_pack','fire_burst','freeze_pulse']);
      this.enemy=new PlayerState(['blade_runner','shield_brute','arc_shooter','spark_mage','sky_drone','swarm_pack','dash_totem','lightning_pike']);
      this.aiStyle='balanced'; this.aiDifficulty='Normal'; this.aiTimer=1;
      this.combo={count:0,timer:0,show:0}; this.mvpCandidate=null;
      this.initInput();
    }
    reset(){
      this.units=[]; this.projectiles=[]; this.towers=[]; this.spellRings=[]; this.fx.active.length=0;
      this.player.elixir=5; this.enemy.elixir=5; this.player.score=this.enemy.score=0; this.player.cardsPlayed=0; this.enemy.cardsPlayed=0;
      this.matchTime=180; this.overtimeLeft=60; this.inOvertime=false; this.aiTimer=1; this.state='battle'; this.combo={count:0,timer:0,show:0};
      const lx=BALANCE_CONFIG.lanes.leftX, rx=BALANCE_CONFIG.lanes.rightX;
      this.towers.push(new Tower(this,lx,1230,SIDES.PLAYER,'side','left'),new Tower(this,rx,1230,SIDES.PLAYER,'side','right'),new Tower(this,450,1450,SIDES.PLAYER,'core','core'));
      this.towers.push(new Tower(this,lx,370,SIDES.ENEMY,'side','left'),new Tower(this,rx,370,SIDES.ENEMY,'side','right'),new Tower(this,450,150,SIDES.ENEMY,'core','core'));

    }
    getCore(side){ return this.towers.find(t=>t.side===side&&t.kind==='core'); }
    hasDestroyedSideTower(side){ return this.towers.some(t=>t.side===side&&t.kind==='side'&&t.destroyed); }
    heavyHit(v){ this.cameraShake=Math.min(20,this.cameraShake+v); }
    onTowerDown(t){ if(t.side===SIDES.PLAYER) this.enemy.score++; else this.player.score++; this.cameraShake=18; this.cameraZoom=1.04; this.fx.burst('explosion',t.x,t.y,35,'#d8d8d8'); }
    lanePressure(){
      const out={left:{player:0,enemy:0}, right:{player:0,enemy:0}};
      for(const u of this.units){ if(u.dead) continue; out[u.lane][u.side]++; }
      return out;
    }
    getPressureBonus(side,lane){
      const p=this.lanePressure()[lane]; const me=p[side], opp=p[side===SIDES.PLAYER?SIDES.ENEMY:SIDES.PLAYER];
      if(me-opp>=BALANCE_CONFIG.pressure.threshold) return { damage:BALANCE_CONFIG.pressure.damageBonus, speed:BALANCE_CONFIG.pressure.speedBonus };
      return { damage:0, speed:0 };
    }
    getEnemiesInRange(side,x,y,r,includeTowers=false){
      const list=[]; for(const u of this.grid.near(x,y,r+30)){ if(u.side!==side && !u.dead && dist({x,y},u)<=r+(u.radius||10)) list.push(u); }
      if(includeTowers) for(const t of this.towers){ if(t.side!==side && !t.destroyed && dist({x,y},t)<=r+t.radius) list.push(t); }
      return list;
    }
    registerDamage(unit,did,kill){ if(!unit||!unit.stats) return; unit.stats.damage+=did; if(kill) unit.stats.kills++; if(!this.mvpCandidate || unit.stats.damage>this.mvpCandidate.stats.damage) this.mvpCandidate=unit; }
    spawnProjectile(src,target,dmg,speed,splash,color,owner){ this.projectiles.push(new Projectile(this,src,target,dmg,speed,splash,color,owner)); this.beep(240,0.03,'triangle'); }
    placeCard(side,key,x,y,lane){
      const card=BALANCE_CONFIG.cards[key]; const owner=side===SIDES.PLAYER?this.player:this.enemy;
      if(owner.elixir<card.cost){ if(side===SIDES.PLAYER) this.hint('Not enough energy',true); return false; }
      if(card.type==='unit'){
        if(this.units.length>=BALANCE_CONFIG.game.maxUnits){ if(side===SIDES.PLAYER) this.hint('Unit limit reached',true); return false; }
        if(side===SIDES.PLAYER && y<BALANCE_CONFIG.lanes.riverY2+10){ this.hint('Place on your side',true); return false; }
        if(side===SIDES.ENEMY && y>BALANCE_CONFIG.lanes.riverY1-10) return false;
        for(let i=0;i<(card.count||1);i++){ const u=new Unit(this,x+(Math.random()-0.5)*36,y+(Math.random()-0.5)*24,side,card.unit,lane); u.stats.cards=1; this.units.push(u); }
      } else this.castSpell(side,card.spell,x,y);
      owner.elixir-=card.cost; owner.cardsPlayed++;
      if(side===SIDES.PLAYER){ this.combo.count++; this.combo.timer=2.2; this.combo.show=1.1; if(this.combo.count>=3) this.hint(`Combo x${this.combo.count}!`); }
      this.beep(340,0.04,'sine');

    }
    castSpell(side,spell,x,y){
      const cfg=BALANCE_CONFIG.spells[spell]; const origin=side===SIDES.PLAYER?{x:450,y:1450}:{x:450,y:150}; const d=dist(origin,{x,y});
      if(d<cfg.castMin||d>cfg.castMax){ if(side===SIDES.PLAYER) this.hint('Out of cast range',true); return; }
      this.spellRings.push({x,y,r:cfg.radius,t:0.35,c:'#8be9ff'});
      const enemies=this.getEnemiesInRange(side,x,y,cfg.radius,true); const allies=this.units.filter(u=>u.side===side&&dist(u,{x,y})<cfg.radius);
      if(spell==='fire_burst'){ for(const e of enemies) e.takeDamage(cfg.dmg); this.fx.burst('explosion',x,y,20,'#ffbd91'); }
      if(spell==='freeze_pulse'){ for(const e of enemies){ if(e instanceof Unit){ e.freeze=Math.max(e.freeze,cfg.freeze); this.fx.spawn('freeze',e.x,e.y,{color:'#a9e6ff',life:0.32,size:4}); } } }
      if(spell==='dash_totem'){ for(const a of allies){ a.speedBuff=cfg.speedMul; a.speedBuffTimer=cfg.duration; } }
      if(spell==='lightning_pike'){ const sorted=enemies.sort((a,b)=>dist({x,y},a)-dist({x,y},b)).slice(0,cfg.chains); sorted.forEach((e,i)=>{ e.takeDamage(cfg.dmg); this.fx.spawn('lightning',e.x,e.y,{lineFrom:i?sorted[i-1]:{x,y},color:'#d9f4ff',life:0.16,size:1}); }); }
    }
    hint(text,bad=false){ const el=document.getElementById('hint'); el.textContent=text; el.style.color=bad?'#ff8080':'#fff27c'; el.style.opacity=1; setTimeout(()=>el.style.opacity=0,730); }
    beep(freq,d,type='triangle'){ if(!this.ac){ this.ac=new (window.AudioContext||window.webkitAudioContext)(); }
      const o=this.ac.createOscillator(),g=this.ac.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=0.02; o.connect(g); g.connect(this.ac.destination); o.start(); o.stop(this.ac.currentTime+d); }
    towerShotSfx(){ this.beep(160,0.05,'square'); this.beep(280,0.03,'triangle'); }

    initInput(){
      const p = ev => { const r=this.cv.getBoundingClientRect(); const t=ev.touches?ev.touches[0]:ev; return {x:(t.clientX-r.left)/r.width*W, y:(t.clientY-r.top)/r.height*H}; };
      const start = ev => { if(this.state!=='battle') return; const pt=p(ev); const idx=this.cardAt(pt.x,pt.y); if(idx>=0) this.drag={idx,start:pt,now:pt}; };
      const move = ev => { if(!this.drag) return; this.drag.now=p(ev); ev.preventDefault?.(); };
      const end = ev => { if(!this.drag||this.state!=='battle') return; const pt=p(ev); const key=this.player.deck.hand[this.drag.idx]; const lane=pt.x<450?'left':'right'; if(this.placeCard(SIDES.PLAYER,key,clamp(pt.x,80,820),clamp(pt.y,120,1480),lane)) this.player.deck.play(this.drag.idx); this.drag=null; };
      this.cv.addEventListener('mousedown',start); window.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
      this.cv.addEventListener('touchstart',start,{passive:false}); window.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',end);
      window.addEventListener('keydown',(e)=>{ if(e.key==='d') this.debug=!this.debug; if(e.key==='r') this.reset(); if(e.key===' ') this.paused=!this.paused; if(e.key==='x') this.gameSpeed=this.gameSpeed===1?2:1; if(e.key==='1') this.aiDifficulty='Easy'; if(e.key==='2') this.aiDifficulty='Normal'; if(e.key==='3') this.aiDifficulty='Hard'; });
    }
    cardAt(x,y){ if(y<1420) return -1; const w=170,g=10,s=35; for(let i=0;i<4;i++){ const cx=s+i*(w+g); if(x>cx&&x<cx+w&&y>1430&&y<1570) return i; } return -1; }

    aiThink(dt){
      this.aiTimer-=dt; if(this.aiTimer>0) return;
      const diff={Easy:1.3,Normal:0.9,Hard:0.55}[this.aiDifficulty]; this.aiTimer=diff+Math.random()*0.7;
      const weakTower=this.towers.filter(t=>t.side===SIDES.PLAYER&&!t.destroyed).sort((a,b)=>a.hp-b.hp)[0];
      const lane=weakTower?weakTower.lane||'left':(Math.random()<0.5?'left':'right');
      const hand=this.enemy.deck.hand; const laneEnemies=this.units.filter(u=>u.side===SIDES.PLAYER&&u.lane===lane&&u.y<980).length;
      const holdForPush=this.aiStyle==='aggressive'?7:this.aiStyle==='defensive'?5.5:6.3;
      let pick=-1, x=lane==='left'?BALANCE_CONFIG.lanes.leftX:BALANCE_CONFIG.lanes.rightX, y=520;

      if(pick<0){ const order=this.aiStyle==='defensive'?['shield_brute','arc_shooter','freeze_pulse','sky_drone','blade_runner','swarm_pack']:['blade_runner','arc_shooter','sky_drone','shield_brute','swarm_pack','fire_burst','lightning_pike']; pick=hand.findIndex(k=>order.includes(k)); }
      if(pick>=0){ const key=hand[pick]; const placed=this.placeCard(SIDES.ENEMY,key,x+(Math.random()-0.5)*60,y+(Math.random()-0.5)*40,lane); if(placed) this.enemy.deck.play(pick); }
    }

    update(dt){
      if(this.state!=='battle'||this.paused) return;
      dt*=this.gameSpeed; this.arenaT+=dt; this.combo.timer-=dt; this.combo.show=Math.max(0,this.combo.show-dt); if(this.combo.timer<=0) this.combo.count=0;

      this.player.elixir=clamp(this.player.elixir+regen*dt,0,BALANCE_CONFIG.game.elixirMax); this.enemy.elixir=clamp(this.enemy.elixir+regen*dt,0,BALANCE_CONFIG.game.elixirMax);

      else { this.overtimeLeft-=dt; for(const t of this.towers) if(!t.destroyed) t.takeDamage(BALANCE_CONFIG.game.towerDamageOvertimeDrain*dt); }

      this.aiThink(dt); this.grid.clear(); for(const u of this.units) if(!u.dead) this.grid.add(u);
      this.debugCounts.pathChecks=0; for(const t of this.towers) t.update(dt); for(const u of this.units) u.update(dt); for(const p of this.projectiles) p.update(dt);
      this.fx.update(dt); for(const r of this.spellRings) r.t-=dt;

      this.cameraShake=Math.max(0,this.cameraShake-dt*24); this.cameraZoom += (1-this.cameraZoom)*0.08;

    }

    showEnd(result){
      const mvp=this.mvpCandidate; const mvpText=mvp?`${BALANCE_CONFIG.cards[mvp.unitKey]?.name||mvp.unitKey}: dmg ${mvp.stats.damage.toFixed(0)} / kills ${mvp.stats.kills}`:'No MVP';

    drawArena(ctx){
      const t=this.arenaT;
      const bg=ctx.createLinearGradient(0,0,0,H); bg.addColorStop(0,'#2f6c42'); bg.addColorStop(0.55,'#467f49'); bg.addColorStop(1,'#2f6839'); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);

    drawCardIcon(ctx,c,x,y,s=20){ ctx.save(); ctx.translate(x,y); ctx.fillStyle='#d9f1ff'; if(c.type==='spell'){ ctx.beginPath(); ctx.arc(0,0,s*0.7,0,Math.PI*2); ctx.strokeStyle='#95eaff'; ctx.lineWidth=3; ctx.stroke(); ctx.beginPath(); ctx.moveTo(-s*0.4,0);ctx.lineTo(0,-s*0.5);ctx.lineTo(s*0.4,0); ctx.stroke(); } else if(c.unit==='shield_brute'){ ctx.fillRect(-s*0.5,-s*0.5,s,s); } else if(c.unit==='arc_shooter'){ ctx.beginPath(); ctx.roundRect(-s*0.6,-s*0.4,s*1.2,s*0.8,5); ctx.fill(); } else if(c.unit==='spark_mage'){ ctx.beginPath(); ctx.moveTo(0,-s*0.7);ctx.lineTo(s*0.7,s*0.7);ctx.lineTo(-s*0.7,s*0.7);ctx.closePath(); ctx.fill(); } else { ctx.beginPath(); ctx.arc(0,0,s*0.6,0,Math.PI*2); ctx.fill(); } ctx.restore(); }

    drawUI(ctx,fps){
      const timer=this.inOvertime?`OT ${Math.ceil(this.overtimeLeft)}`:`${Math.floor(this.matchTime/60)}:${String(Math.floor(this.matchTime%60)).padStart(2,'0')}`;

        ctx.fillStyle='#ffe28a'; ctx.beginPath(); ctx.arc(x+26,py+112,16,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#1a273a'; ctx.font='bold 18px system-ui'; ctx.fillText(c.cost,x+26,py+118); this.drawCardIcon(ctx,c,x+w-40,py+106);

      if(this.debug){ ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(12,170,270,125); ctx.fillStyle='#9fe8ff'; ctx.textAlign='left'; ctx.fillText(`FPS ${fps.toFixed(1)}`,20,194); ctx.fillText(`Units ${this.units.length}/${BALANCE_CONFIG.game.maxUnits}`,20,216); ctx.fillText(`Projectiles ${this.projectiles.length}`,20,238); ctx.fillText(`Path checks ${this.debugCounts.pathChecks}`,20,260); ctx.fillText(`Particles ${this.fx.active.length}`,20,282); }
    }

      for(const t of this.towers) t.draw(ctx); for(const u of this.units) u.draw(ctx); for(const p of this.projectiles) p.draw(ctx); this.fx.draw(ctx); this.drawUI(ctx,fps);

    }
  }

  const game=new Game(document.getElementById('game'));
  document.getElementById('playBtn').onclick=()=>{ document.getElementById('menu').style.display='none'; game.reset(); };
  game.cv.addEventListener('click',(e)=>{ if(game.state!=='battle') return; const r=game.cv.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H; if(x>700&&x<880&&y>1328&&y<1380) game.paused=!game.paused; else if(x>700&&x<880&&y>1396&&y<1448) game.reset(); else if(x>700&&x<880&&y>1464&&y<1516) game.gameSpeed=game.gameSpeed===1?2:1; else if(x>700&&x<880&&y>1532&&y<1584) game.debug=!game.debug; });

  let last=performance.now(), acc=0, dt=1/BALANCE_CONFIG.game.tickRate, fps=60, fpsTimer=0, frames=0;
  function loop(t){ const delta=Math.min(0.1,(t-last)/1000); last=t; acc+=delta; while(acc>=dt){ game.update(dt); acc-=dt; } frames++; fpsTimer+=delta; if(fpsTimer>=0.25){ fps=frames/fpsTimer; fpsTimer=0; frames=0; } game.render(fps); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
})();
</script>
