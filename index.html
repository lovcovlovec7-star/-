<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Арена Легенд</title>
<style>

:root {
  --bg:#0f172a;--panel:#111827;--panel2:#1f2937;--text:#e5e7eb;--muted:#9ca3af;
  --primary:#22d3ee;--accent:#f59e0b;--danger:#ef4444;--success:#22c55e;
}
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(180deg,#020617,#111827);font-family:Arial,Helvetica,sans-serif;color:var(--text);overflow:hidden}
#app{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center}
.mobile-frame{position:relative;width:min(100vw,480px);height:100vh;max-height:920px;background:#0b1022;border:1px solid #1f2937;overflow:hidden}
.screen{position:absolute;inset:0;opacity:0;transform:translateX(24px);pointer-events:none;transition:transform .35s ease,opacity .35s ease}
.screen.active{opacity:1;transform:translateX(0);pointer-events:auto}
.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:12px;background:linear-gradient(180deg,#1e293b,#111827);border-bottom:1px solid #334155}
.account{display:flex;align-items:center;gap:10px;background:#1f2937;padding:8px 10px;border-radius:14px;cursor:pointer}
.avatar{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fef08a,#f59e0b 60%,#92400e)}
.nav{position:absolute;left:0;right:0;bottom:0;height:76px;background:#111827;border-top:1px solid #374151;display:flex}
.nav button{flex:1;border:0;background:transparent;color:#cbd5e1;font-size:12px;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center}
.nav button.active{color:#22d3ee}
.main-content{position:absolute;top:72px;bottom:76px;left:0;right:0;overflow:auto;padding:12px}
.card{background:#111827;border:1px solid #374151;border-radius:12px;padding:10px}
.hero-button{width:100%;padding:14px;border-radius:14px;border:0;font-weight:700;background:linear-gradient(180deg,#22d3ee,#0284c7);color:#00111f;cursor:pointer}
.arena-grid,.card-grid{display:grid;gap:10px}
.arena-grid{grid-template-columns:1fr 1fr}
.card-grid{grid-template-columns:repeat(2,1fr)}
.arena-item{padding:12px;border-radius:12px;border:1px solid #334155;position:relative;min-height:120px;overflow:hidden;cursor:pointer}
.arena-lock{position:absolute;inset:0;background:rgba(2,6,23,.72);display:flex;align-items:center;justify-content:center;font-weight:700}
.deck-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{height:74px;border:1px dashed #64748b;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:12px}
.energy-bar{position:absolute;left:16px;right:16px;bottom:106px;height:28px;background:#1e293b;border:1px solid #334155;border-radius:14px;overflow:hidden}
.energy-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#22d3ee);width:0%}
.energy-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000}
.battle-ui{position:absolute;left:0;right:0;bottom:0;height:100px;background:linear-gradient(180deg,rgba(15,23,42,.1),#0f172a)}
.hand{display:flex;gap:8px;padding:8px;overflow-x:auto}
.hand-card{min-width:92px;background:#111827;border:1px solid #334155;border-radius:10px;padding:6px;cursor:pointer;position:relative}
.hand-card.sel{outline:2px solid #22d3ee}
.canvas-wrap{position:absolute;inset:0 0 100px 0;background:#0b1328}
#battleCanvas{width:100%;height:100%;display:block}
.toast-wrap{position:absolute;left:0;right:0;top:80px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:50}
.toast{padding:10px 14px;background:#111827;border:1px solid #334155;border-radius:10px;animation:toastIn .25s ease}
@keyframes toastIn{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal{position:absolute;inset:0;background:rgba(2,6,23,.84);display:none;align-items:center;justify-content:center;z-index:60}
.modal.show{display:flex}
.modal-card{width:92%;max-height:90%;overflow:auto;background:#0f172a;border:1px solid #334155;border-radius:14px;padding:14px}
.row{display:flex;gap:8px;align-items:center}.between{justify-content:space-between}.small{font-size:12px;color:#94a3b8}
.progress{height:12px;background:#1f2937;border-radius:8px;overflow:hidden;border:1px solid #374151}
.progress>div{height:100%;background:linear-gradient(90deg,#22c55e,#16a34a)}
.settings-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.settings-grid button{padding:8px;border-radius:8px;border:1px solid #334155;background:#0b1224;color:#cbd5e1}
.search{width:100%;padding:10px;border-radius:10px;border:1px solid #334155;background:#0b1224;color:#dbeafe}
.filter-row{display:flex;gap:8px;overflow:auto;padding-bottom:6px}
.filter-row button{padding:8px 10px;border-radius:999px;border:1px solid #334155;background:#111827;color:#cbd5e1;white-space:nowrap}
.reward-item{padding:10px;border:1px solid #334155;border-radius:10px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.towerHp{position:absolute;height:10px;background:#1e293b;border:1px solid #334155;border-radius:6px;overflow:hidden;width:84px}
.towerHp div{height:100%;background:linear-gradient(90deg,#22c55e,#84cc16)}

</style>
</head>

class SaveSystem {
  constructor(key='arena_legends_save_v3'){this.key=key;this.data=this.load();}
  defaultData(){
    return {
      profile:{name:'Игрок',xp:0,level:1,cups:0,wins:0,losses:0,avatar:0,gold:500,cosmetics:[]},
      cards:this.makeCardData(),
      deck:CARD_DB.slice(0,8).map(c=>c.id),
      rewardRoad:{claimed:{}},
      settings:{quality:'high',volume:0.6,music:true,sfx:true,difficulty:'normal'},
      inventory:{gold:500, cosmetics:[], cards:{}},
      selectedArena:1
    };
  }
  makeCardData(){const o={};for(const c of CARD_DB){o[c.id]={level:1,copies:Math.floor(Math.random()*4)+1};}return o;}
  load(){
    try{const raw=localStorage.getItem(this.key);if(!raw)return this.defaultData();

    }catch(e){return this.defaultData();}
  }
  merge(a,b){if(Array.isArray(a))return Array.isArray(b)?b:a; if(typeof a==='object'&&a){const o={...a};for(const k in b){o[k]=k in a?this.merge(a[k],b[k]):b[k];}return o;} return b===undefined?a:b;}
  save(){localStorage.setItem(this.key,JSON.stringify(this.data));}
}

class AppStateManager {
  constructor(save){this.save=save;this.listeners=[];this.state=save.data;}
  onChange(fn){this.listeners.push(fn);} emit(){for(const l of this.listeners)l(this.state); this.save.data=this.state; this.save.save();}
  update(path,val){const keys=path.split('.');let ref=this.state;for(let i=0;i<keys.length-1;i++)ref=ref[keys[i]];ref[keys[keys.length-1]]=val;this.emit();}
  get(path){const keys=path.split('.');let ref=this.state;for(const k of keys)ref=ref[k];return ref;}
  addGold(v){this.state.profile.gold+=v;this.state.inventory.gold=this.state.profile.gold;this.emit();}

class AudioSystem {

  init(){if(this.ctx)return;this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.musicGain=this.ctx.createGain();this.sfxGain=this.ctx.createGain();this.musicGain.connect(this.master);this.sfxGain.connect(this.master);this.master.connect(this.ctx.destination);this.refresh();}
  refresh(){const s=this.app.get('settings');if(!this.master)return;this.master.gain.value=s.volume;this.musicGain.gain.value=s.music?0.25:0;this.sfxGain.gain.value=s.sfx?0.5:0;}
  beep(freq=440,dur=.08,type='sine',vol=.3){if(!this.ctx)return;const o=this.ctx.createOscillator();const g=this.ctx.createGain();o.type=type;o.frequency.value=freq;g.gain.value=vol;o.connect(g);g.connect(this.sfxGain);o.start();g.gain.exponentialRampToValueAtTime(0.0001,this.ctx.currentTime+dur);o.stop(this.ctx.currentTime+dur);}

class RewardRoadSystem {

class UpgradeSystem {
  constructor(app){this.app=app;}
  getCardLevel(id){return this.app.state.cards[id]?.level||1;}
  getCopies(id){return this.app.state.cards[id]?.copies||0;}
  costFor(id){const c=this.app.state.cards[id];const base=CARD_DB.find(x=>x.id===id);return base.upgradeGold*c.level;}
  needCopiesFor(id){const c=this.app.state.cards[id];const base=CARD_DB.find(x=>x.id===id);return base.copiesNeeded + c.level*2;}
  canUpgrade(id){const card=this.app.state.cards[id];if(!card)return false;return card.copies>=this.needCopiesFor(id)&&this.app.state.profile.gold>=this.costFor(id);}
  scaledStats(base,level){const mul=1+(level-1)*0.12;return {hp:Math.round(base.baseHp*mul),damage:Math.round(base.baseDamage*mul)};}
  upgrade(id){if(!this.canUpgrade(id))return false;const c=this.app.state.cards[id];const need=this.needCopiesFor(id);const cost=this.costFor(id);c.copies-=need;c.level++;this.app.state.profile.gold-=cost;this.app.addXp(25);this.app.emit();return true;}
}

class DeckSystem {

  averageEnergy(){const ids=this.getDeck();let sum=0,c=0;for(const id of ids){const card=CARD_DB.find(x=>x.id===id);if(card){sum+=card.cost;c++;}}return c?(sum/c).toFixed(1):'0.0';}
}

class CardSystem {
  constructor(app,upgrade){this.app=app;this.upgrade=upgrade;}
  getById(id){return CARD_DB.find(c=>c.id===id);}
  list(filters={}){
    const q=(filters.q||'').toLowerCase();
    return CARD_DB.filter(c=>{
      if(filters.type&&filters.type!=='all'&&c.type!==filters.type)return false;
      if(filters.rarity&&filters.rarity!=='all'&&c.rarity!==filters.rarity)return false;
      if(q && !c.name.toLowerCase().includes(q))return false;
      return true;
    });
  }
  level(id){return this.app.state.cards[id]?.level||1;}
  copies(id){return this.app.state.cards[id]?.copies||0;}
  stats(id){const base=this.getById(id);return this.upgrade.scaledStats(base,this.level(id));}
}

class ParticleSystem {

  setQuality(q){this.quality=q;}
  spawn(x,y,color,count=12){const mult=this.quality==='low'?0.5:this.quality==='medium'?0.8:1;count=Math.max(2,Math.floor(count*mult));for(let i=0;i<count;i++){const p=this.pool.pop()||{};p.x=x;p.y=y;p.vx=(Math.random()*2-1)*90;p.vy=(Math.random()*2-1)*90;p.life=.4+Math.random()*.4;p.t=0;p.color=color;this.active.push(p);} }
  update(dt){for(let i=this.active.length-1;i>=0;i--){const p=this.active[i];p.t+=dt;if(p.t>=p.life){this.pool.push(p);this.active.splice(i,1);continue;}p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=140*dt;}}

  draw(ctx){for(const p of this.projectiles){ctx.fillStyle=p.type==='bolt'?'#f43f5e':'#f8fafc';ctx.beginPath();ctx.arc(p.x,p.y,p.type==='bolt'?4:3,0,Math.PI*2);ctx.fill();}}

class AIController {

  update(dt){this.timer-=dt;if(this.timer>0)return;this.timer=1.1+Math.random()*1.4;const e=this.engine;const difficulty=e.app.get('settings').difficulty;let lane=this.evaluateLane();let card=this.chooseCard();if(!card)return;const cdef=e.cardSystem.getById(card);if(cdef.cost>e.enemyEnergy)return;if(cdef.type==='spell'){if(Math.random()<0.55||difficulty==='hard'){const target=this.bestSpellTarget();if(target)e.castSpell('enemy',card,target.x,target.y);} }
      else {let x=lane==='left'?e.width*0.3:e.width*0.7;let y=90+Math.random()*60;e.deployUnit('enemy',card,x,y);} }

  chooseCard(){const cards=this.deck.getDeck();for(let i=0;i<10;i++){const id=cards[Math.random()*cards.length|0];if(this.engine.cardSystem.getById(id))return id;}return null;}

class BattleEngine {

      if(nearest && nd<=u.range){if(u.cooldown<=0){u.cooldown=u.attackSpeed; if(nearest.maxHp){this.projectiles.shoot(u,nearest,u.damage,u.team,u.cardId.includes('маг')?'bolt':'arrow');} }}
      else if(nearest){const dx=nearest.x-u.x,dy=nearest.y-u.y;const d=Math.max(1,Math.hypot(dx,dy));u.x+=dx/d*u.speed*dt;u.y+=dy/d*u.speed*dt;}

  }
  applyDamage(target,damage,fromTeam){target.hp-=damage;target.flash=1;if(target.hp<=0){target.hp=0;if(target.id){this.audio.destroy();this.particles.spawn(target.x,target.y,'rgb(239,68,68)',30);this.shake=.25;} else {target.dead=true;this.particles.spawn(target.x,target.y,'rgb(251,191,36)',18);} }}
  deployUnit(team,cardId,x,y){const card=this.cardSystem.getById(cardId);if(!card||card.type!=='unit')return false;const pool=team==='player'?'energy':'enemyEnergy';if(this[pool]<card.cost)return false;this[pool]-=card.cost;this.unitSystem.spawn(cardId,team,x,y);this.audio.ui();return true;}

    for(const u of this.unitSystem.units){const d=Math.hypot(u.x-x,u.y-y);if(d<70){if(cardId.includes('исцел')){if(u.team===team)u.hp=Math.min(u.maxHp,u.hp+card.baseDamage);}else{if(u.team!==team)this.applyDamage(u,card.baseDamage,team);}}}

  }

  render(){const ctx=this.ctx;ctx.save();if(this.shake>0){ctx.translate((Math.random()-.5)*8*this.shake,(Math.random()-.5)*8*this.shake);}const arena=ARENAS.find(a=>a.id===this.app.state.selectedArena)||ARENAS[0];this.arenaRenderer.drawBackground(ctx,this.width,this.height,arena,this.time);

      const hpw=80;ctx.fillStyle='#1e293b';ctx.fillRect(t.x-hpw/2,t.y-46,hpw,8);ctx.fillStyle='#84cc16';ctx.fillRect(t.x-hpw/2,t.y-46,hpw*(t.hp/t.maxHp),8);
      if(t.hp/t.maxHp<.5){ctx.strokeStyle='#f97316';ctx.strokeRect(t.x-24,t.y-32,48,64);}if(t.hp/t.maxHp<.25){ctx.strokeStyle='#dc2626';ctx.strokeRect(t.x-26,t.y-34,52,68);} }
    for(const u of this.unitSystem.units){if(u.dead)continue;ctx.save();ctx.translate(u.x,u.y);const wob=Math.sin(u.anim)*2;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,20,12,5,0,0,Math.PI*2);ctx.fill();ctx.fillStyle=u.team==='player'?'#bae6fd':'#fecaca';ctx.beginPath();ctx.arc(0,-16+wob,7,0,Math.PI*2);ctx.fill();ctx.fillStyle=u.flash>0?'#fff':'#334155';ctx.fillRect(-8,-10+wob,16,20);ctx.fillStyle='#94a3b8';ctx.fillRect(-12,-8+wob,4,14);ctx.fillRect(8,-8+wob,4,14);ctx.fillStyle='#64748b';ctx.fillRect(-6,10+wob,4,10);ctx.fillRect(2,10+wob,4,10);ctx.fillStyle='#facc15';ctx.fillRect(10,-4+wob,10,3);ctx.restore();
      ctx.fillStyle='rgba(15,23,42,.8)';ctx.fillRect(u.x-15,u.y-30,30,4);ctx.fillStyle='#22c55e';ctx.fillRect(u.x-15,u.y-30,30*(u.hp/u.maxHp),4);
    }
    this.projectiles.draw(ctx);this.particles.draw(ctx);ctx.restore();
  }
}

class UIManager {
  constructor(frame,app){this.frame=frame;this.app=app;this.screens={};this.toasts=[];this.toastWrap=document.createElement('div');this.toastWrap.className='toast-wrap';frame.appendChild(this.toastWrap);}
  onBattleFinished(win){if(window.app&&window.app.onBattleFinished)window.app.onBattleFinished(win);}
  toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;this.toastWrap.appendChild(t);setTimeout(()=>{t.style.opacity='0';t.style.transform='translateY(-6px)';},1600);setTimeout(()=>t.remove(),1900);}
  makeScreen(id){const s=document.createElement('div');s.className='screen';s.id=id;this.frame.appendChild(s);this.screens[id]=s;return s;}
  show(id){for(const k in this.screens)this.screens[k].classList.toggle('active',k===id);}
  updateTopbar(){const p=this.app.state.profile;if(!this.topbar)return;this.topbar.querySelector('.lv').textContent='Ур. '+p.level;this.topbar.querySelector('.cups').textContent='🏆 '+p.cups;this.topbar.querySelector('.gold').textContent='🪙 '+p.gold;}
  setEnergyElements(fill,label){this.energyFill=fill;this.energyLabel=label;}
  updateEnergy(v,max){if(!this.energyFill)return;this.energyFill.style.width=(v/max*100)+'%';this.energyLabel.textContent=`Энергия ${v.toFixed(1)}/${max}`;}
}

class ScreenManager {
  constructor(ui){this.ui=ui;}

class App {
  constructor(){

  buildTop(parent){const t=document.createElement('div');t.className='topbar';t.innerHTML=`<div class="account"><div class="avatar"></div><div><div style="font-weight:700">${this.state.get('profile.name')}</div><div class="small lv">Ур. ${this.state.get('profile.level')}</div></div></div><div class="row"><div class="card cups">🏆 ${this.state.get('profile.cups')}</div><div class="card gold">🪙 ${this.state.get('profile.gold')}</div></div>`;t.querySelector('.account').onclick=()=>this.openProfile();parent.appendChild(t);this.ui.topbar=t;}
  buildNav(parent){const nav=document.createElement('div');nav.className='nav';const tabs=[['menu','Главная','🏠'],['cards','Карты','🃏'],['deck','Колода','📚'],['road','Дорога','🎁'],['arenas','Арены','🏟️'],['settings','Настройки','⚙️']];for(const [id,txt,ic] of tabs){const b=document.createElement('button');b.innerHTML=`<div>${ic}</div><div>${txt}</div>`;b.onclick=()=>{for(const bb of nav.children)bb.classList.remove('active');b.classList.add('active');this.screens.show(id);};if(id==='menu')b.classList.add('active');nav.appendChild(b);}parent.appendChild(nav);}
  buildUI(){const frame=this.ui.frame;
    const menu=this.ui.makeScreen('menu');this.buildTop(menu);const mc=document.createElement('div');mc.className='main-content';mc.innerHTML=`<div class="card"><h2>Арена Легенд</h2><p>Собери колоду, улучшай карты и поднимай кубки.</p><button class="hero-button" id="startBattle">В БОЙ</button></div><div style="height:10px"></div><div class="card"><h3>Текущая арена</h3><div id="currentArenaCard"></div></div><div style="height:10px"></div><div class="card"><h3>Последние награды</h3><div id="recentRewards"></div></div>`;menu.appendChild(mc);this.buildNav(menu);

    const settings=this.ui.makeScreen('settings');this.buildTop(settings);const sc=document.createElement('div');sc.className='main-content';sc.innerHTML=`<div class="card"><h3>Качество</h3><div class="settings-grid" id="qualityBtns"></div></div><div style="height:8px"></div><div class="card"><h3>Сложность ИИ</h3><div class="filter-row" id="diffBtns"></div></div><div style="height:8px"></div><div class="card"><h3>Аудио</h3><div class="row between"><span>Музыка</span><input type="checkbox" id="setMusic"></div><div class="row between"><span>Эффекты</span><input type="checkbox" id="setSfx"></div></div>`;settings.appendChild(sc);this.buildNav(settings);

    const ebar=document.createElement('div');ebar.className='energy-bar';ebar.innerHTML='<div class="energy-fill"></div><div class="energy-label">Энергия 0/10</div>';battle.appendChild(ebar);this.ui.setEnergyElements(ebar.querySelector('.energy-fill'),ebar.querySelector('.energy-label'));
    const bu=document.createElement('div');bu.className='battle-ui';bu.innerHTML='<div class="hand" id="battleHand"></div>';battle.appendChild(bu);

    this.modal=document.createElement('div');this.modal.className='modal';this.modal.innerHTML='<div class="modal-card" id="modalContent"></div>';this.modal.onclick=(e)=>{if(e.target===this.modal)this.modal.classList.remove('show');};frame.appendChild(this.modal);

  }
  bindBattleInput(){const canvas=this.battle.canvas;canvas.addEventListener('click',e=>{if(!this.input.selectedCard)return;const r=canvas.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;const ok=this.battle.placePlayerCard(this.input.selectedCard.id,x,y);if(!ok)this.ui.toast('Недостаточно энергии или неверная цель');});}
  openProfile(){const p=this.state.state.profile;const stats=this.profile.stats().map(s=>`<div class="row between"><span>${s.k}</span><strong>${s.v}</strong></div>`).join('');this.showModal(`<h2>Профиль</h2><div class="card">${stats}</div><div style="height:8px"></div><button class="hero-button" id="closeModalBtn">Закрыть</button>`);document.getElementById('closeModalBtn').onclick=()=>this.modal.classList.remove('show');}

  onBattleFinished(win){this.trophy.onBattleEnd(win);this.showModal(`<h2>${win?'Победа!':'Поражение'}</h2><p>${win?'Вы получили +30 кубков':'Вы потеряли -18 кубков'}</p><button class="hero-button" id="backMenu">В меню</button>`);document.getElementById('backMenu').onclick=()=>{this.modal.classList.remove('show');this.screens.show('menu');};}
  renderBattleHand(){const h=document.getElementById('battleHand');h.innerHTML='';for(const id of this.deck.getDeck()){const c=this.cardSystem.getById(id);if(!c)continue;const el=document.createElement('div');el.className='hand-card';el.innerHTML=`<div style="font-weight:700;font-size:12px">${c.name}</div><div class="small">${c.type==='unit'?'Юнит':'Заклинание'} · ${c.cost}⚡</div>`;el.onclick=()=>{this.input.selectCard(c);for(const n of h.children)n.classList.remove('sel');el.classList.add('sel');};h.appendChild(el);}}
  renderCardsScreen(){const grid=document.getElementById('cardGrid');if(!grid)return;const q=document.getElementById('cardSearch').value;const type=this.cardFilterType||'all';const rarity=this.cardFilterRarity||'all';const list=this.cardSystem.list({q,type,rarity});grid.innerHTML='';for(const c of list.slice(0,120)){const lv=this.cardSystem.level(c.id);const cp=this.cardSystem.copies(c.id);const st=this.cardSystem.stats(c.id);const item=document.createElement('div');item.className='card';item.innerHTML=`<img src="${this.cardArt.render(c)}" style="width:100%;border-radius:8px"><div style="font-weight:700">${c.name}</div><div class="small">${c.rarity} · ${c.cost}⚡</div><div class="small">Ур.${lv} · копий ${cp}</div>`;
      item.onclick=()=>{const can=this.upgrade.canUpgrade(c.id);const nxt=this.upgrade.scaledStats(c,lv+1);this.showModal(`<h2>${c.name}</h2><img src="${this.cardArt.render(c,220,220)}" style="width:100%;border-radius:10px"><p>${c.description}</p><div class="card"><div class="row between"><span>Здоровье</span><strong>${st.hp} → ${nxt.hp}</strong></div><div class="row between"><span>Урон</span><strong>${st.damage} → ${nxt.damage}</strong></div><div class="row between"><span>Стоимость улучшения</span><strong>${this.upgrade.costFor(c.id)} золота</strong></div><div class="row between"><span>Нужно копий</span><strong>${this.upgrade.needCopiesFor(c.id)}</strong></div></div><div style="height:8px"></div><button class="hero-button" id="upBtn" ${can?'':'disabled style="opacity:.5"'}>Улучшить</button>`);const b=document.getElementById('upBtn');if(b)b.onclick=()=>{if(this.upgrade.upgrade(c.id)){this.ui.toast('Карта улучшена');this.modal.classList.remove('show');}else this.ui.toast('Недостаточно ресурсов');};};
      grid.appendChild(item);} }
  renderDeck(){const slots=document.getElementById('deckSlots');if(!slots)return;slots.innerHTML='';this.deck.getDeck().forEach((id,i)=>{const c=this.cardSystem.getById(id);const s=document.createElement('div');s.className='slot';s.textContent=c?c.name:'Пусто';s.onclick=()=>{this.deckEditingIndex=i;this.ui.toast('Выберите новую карту для слота '+(i+1));};slots.appendChild(s);});document.getElementById('avgEnergy').textContent=this.deck.averageEnergy();
    const pick=document.getElementById('deckCardPicker');pick.innerHTML='';for(const c of CARD_DB.slice(0,80)){const it=document.createElement('div');it.className='card';it.innerHTML=`<div style="font-weight:700">${c.name}</div><div class="small">${c.cost}⚡</div>`;it.onclick=()=>{if(this.deckEditingIndex==null)return;const ok=this.deck.setSlot(this.deckEditingIndex,c.id);if(!ok)this.ui.toast('Дубликаты запрещены');else this.ui.toast('Слот обновлён');};pick.appendChild(it);} }
  renderRoad(){const list=document.getElementById('roadList');if(!list)return;const cups=this.state.get('profile.cups');const max=this.rewardRoad.milestones.at(-1).cups;document.getElementById('roadProgress').style.width=Math.min(100,cups/max*100)+'%';document.getElementById('roadLabel').textContent=`${cups} / ${max} кубков`;
    list.innerHTML='';for(const m of this.rewardRoad.milestones){const claimed=this.rewardRoad.isClaimed(m.id);const can=this.rewardRoad.canClaim(m);const d=document.createElement('div');d.className='reward-item';d.innerHTML=`<div><div><strong>${m.cups} кубков</strong></div><div class="small">${m.reward.gold} золота, +${m.reward.copies} копий</div></div><button ${can?'':'disabled'}>${claimed?'Получено':can?'Забрать':'Закрыто'}</button>`;const b=d.querySelector('button');b.onclick=()=>{const r=this.rewardRoad.claim(m.id);if(r){this.ui.toast('Награда получена!');this.showModal(`<h2>Награда</h2><p>+${r.gold} золота</p><p>+${r.copies} копий карты</p>${r.cosmetic?'<p>Косметика: '+r.cosmetic+'</p>':''}<button class="hero-button" id="rwOk">OK</button>`);document.getElementById('rwOk').onclick=()=>this.modal.classList.remove('show');}};list.appendChild(d);} }
  renderArenas(){const g=document.getElementById('arenaGrid');if(!g)return;g.innerHTML='';for(const a of ARENAS){const unlocked=this.trophy.arenaUnlocked(a.id);const d=document.createElement('div');d.className='arena-item';d.style.background=`linear-gradient(160deg,${a.c1},${a.c2})`;d.innerHTML=`<div style="font-weight:700">${a.name}</div><div class="small">Требуется: ${a.cups} кубков</div>${this.state.get('selectedArena')===a.id?'<div class="small">Выбрана</div>':''}`;if(!unlocked){const l=document.createElement('div');l.className='arena-lock';l.textContent='🔒 Закрыто';d.appendChild(l);}d.onclick=()=>{if(this.arenaSystem.selectArena(a.id))this.ui.toast('Арена выбрана');else this.ui.toast('Недостаточно кубков');};g.appendChild(d);} }
  renderMenu(){const a=this.arenaSystem.getSelected();const holder=document.getElementById('currentArenaCard');if(holder)holder.innerHTML=`<div class="arena-item" style="background:linear-gradient(130deg,${a.c1},${a.c2});min-height:90px"><div style="font-weight:700">${a.name}</div><div class="small">Требование: ${a.cups}</div></div>`;
    const rr=document.getElementById('recentRewards');if(rr){const avail=this.rewardRoad.milestones.filter(m=>this.rewardRoad.canClaim(m)).slice(0,3);rr.innerHTML=avail.length?avail.map(m=>`<div class="small">Доступна награда за ${m.cups} кубков</div>`).join(''):'<div class="small">Пока нет доступных наград</div>';}}

    const d=document.getElementById('diffBtns');if(d&&!d.dataset.init){d.dataset.init='1';['easy','normal','hard'].forEach(v=>{const b=document.createElement('button');b.textContent=v;b.onclick=()=>this.state.update('settings.difficulty',v);d.appendChild(b);});}
    document.getElementById('setMusic').checked=this.state.get('settings.music');document.getElementById('setSfx').checked=this.state.get('settings.sfx');document.getElementById('setMusic').onchange=e=>this.state.update('settings.music',e.target.checked);document.getElementById('setSfx').onchange=e=>this.state.update('settings.sfx',e.target.checked);
  }
  renderDynamic(){this.ui.updateTopbar();this.renderMenu();this.renderCardsScreen();this.renderDeck();this.renderRoad();this.renderArenas();this.renderSettings();this.renderBattleHand();this.initCardFilters();}
  initCardFilters(){const wrap=document.getElementById('cardFilters');if(!wrap||wrap.dataset.init)return;wrap.dataset.init='1';const defs=[['all','Все'],['unit','Юниты'],['spell','Заклинания'],['Обычный','Обычные'],['Редкий','Редкие'],['Эпический','Эпические']];for(const [key,label] of defs){const b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(['unit','spell','all'].includes(key)){this.cardFilterType=key;}else{this.cardFilterRarity=key;}this.renderCardsScreen();};wrap.appendChild(b);}document.getElementById('cardSearch').oninput=()=>this.renderCardsScreen();}
}

<script>
(function(){
  const app = window.app;
  if(!app) return;

  const style = document.createElement('style');
  style.textContent = `
  .screen{transition:none !important}
  .screen.fx-enter{pointer-events:none}
  .screen.fx-enter-active{pointer-events:auto}
  .tab-extra{font-size:11px}
  .energy-bar.super{box-shadow:0 0 16px rgba(34,211,238,.35)}
  .energy-fill.pulse{filter:brightness(1.25)}
  .placement-overlay{position:absolute;inset:72px 0 100px 0;pointer-events:none;z-index:20;display:none}
  .placement-overlay.show{display:block}
  .results-panel h2{margin:0 0 6px 0}
  .hud-top{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;z-index:25;pointer-events:none}
  .hud-chip{background:rgba(15,23,42,.85);border:1px solid #334155;border-radius:12px;padding:6px 10px;font-weight:700;font-size:12px}
  .chest-card{background:linear-gradient(180deg,#1e293b,#0f172a);padding:10px;border:1px solid #334155;border-radius:10px;margin-bottom:8px}
  .offer{padding:10px;border-radius:10px;border:1px solid #334155;background:#0f172a;margin-bottom:8px}
  .quest{padding:10px;border:1px solid #334155;border-radius:10px;margin-bottom:8px}
  `;
  document.head.appendChild(style);

  class TweenManager {
    constructor(){ this.items=[]; }
    ease(name,t){
      const map={linear:t=>t,outCubic:t=>1-Math.pow(1-t,3),inOut:t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,outBack:t=>1+2.4*Math.pow(t-1,3)+1.4*Math.pow(t-1,2)};
      return (map[name]||map.outCubic)(Math.max(0,Math.min(1,t)));
    }
    to(obj,key,to,duration=.35,ease='outCubic',delay=0,onDone){
      this.items.push({obj,key,from:obj[key],to,duration,elapsed:0,ease,delay,onDone});
    }
    tick(dt){
      this.items=this.items.filter(t=>{
        if(t.delay>0){t.delay-=dt;return true;}
        t.elapsed+=dt; const p=this.ease(t.ease,t.elapsed/t.duration);
        t.obj[t.key]=t.from+(t.to-t.from)*p;
        if(t.elapsed>=t.duration){t.obj[t.key]=t.to; if(t.onDone)t.onDone(); return false;}
        return true;
      });
    }
  }

  app.tweens = new TweenManager();
  let tweenLast=performance.now();
  const tweenLoop=(now)=>{
    const dt=Math.min(0.05,(now-tweenLast)/1000);
    tweenLast=now;
    app.tweens.tick(dt);
    requestAnimationFrame(tweenLoop);
  };
  requestAnimationFrame(tweenLoop);

  const origShow = app.screens.show.bind(app.screens);
  app.screens.show = function(id){
    const screenMap=this.ui?.screens||app.ui?.screens||{};
    const from=this.current?screenMap[this.current]:null;
    const to=screenMap[id]||screenMap.menu;
    if(!to) return;
    if(from===to) return;
    if(from){from.style.opacity=1;from.style.transform='translateX(0)';from.classList.remove('active');}
    to.classList.add('active');
    to.style.opacity=0; to.style.transform='translateX(24px)';
    const st={o:0,x:24};
    app.tweens.to(st,'o',1,.28,'outCubic');
    app.tweens.to(st,'x',0,.34,'outBack',0,()=>{});
    const anim=()=>{to.style.opacity=st.o.toFixed(3);to.style.transform=`translateX(${st.x}px)`; if(st.o<0.999) requestAnimationFrame(anim);};
    requestAnimationFrame(anim);
    this.current=to.id;
  };

  const p=app.state.state.profile;
  const s=app.state.state;
  s.meta = s.meta||{};
  s.meta.history = s.meta.history||[];
  s.meta.chests = s.meta.chests||{slots:[null,null,null,null], opening:null};
  s.meta.quests = s.meta.quests||{daily:[],weekly:[],lastDaily:'',lastWeekly:''};
  s.meta.achievements = s.meta.achievements||{};
  s.meta.shop = s.meta.shop||{seed:'',claimedGift:false,bought:{}};

  const nowDate = ()=>new Date().toISOString().slice(0,10);
  const weekKey = ()=>{ const d=new Date(); const onejan=new Date(d.getFullYear(),0,1); return d.getFullYear()+'-W'+Math.ceil((((d-onejan)/86400000)+onejan.getDay()+1)/7); };

  function ensureQuests(){
    const q=s.meta.quests;
    if(q.lastDaily!==nowDate()){
      q.lastDaily=nowDate();
      q.daily=[
        {id:'play2',title:'Сыграть 2 боя',goal:2,progress:0,reward:{gold:120,cups:0}},
        {id:'cast8',title:'Разыграть 8 карт',goal:8,progress:0,reward:{gold:90,cups:0}},
        {id:'win1',title:'Победить 1 раз',goal:1,progress:0,reward:{gold:150,cups:8}},
      ];
    }
    if(q.lastWeekly!==weekKey()){
      q.lastWeekly=weekKey();
      q.weekly=[
        {id:'wins8',title:'Победить 8 раз',goal:8,progress:0,reward:{gold:550,cups:30,chest:'Ларец Бури'}},
        {id:'dmg',title:'Нанести 9000 урона башням',goal:9000,progress:0,reward:{gold:480,cups:24}}
      ];
    }
  }
  ensureQuests();

  function chestReward(type){
    const mul={"Сфера Искр":1,"Ларец Бури":1.5,"Кристальный Ящик":2.2}[type]||1;
    const gold=Math.floor((45+Math.random()*90)*mul);
    const copies=Math.floor((3+Math.random()*5)*mul);
    const pool=CARD_DB[Math.floor(Math.random()*CARD_DB.length)].id;
    return {gold,copies,card:pool};
  }
  function addChest(type){
    const slots=s.meta.chests.slots;
    const idx=slots.findIndex(v=>!v);
    if(idx<0){ app.ui.toast('Все слоты сундуков заняты'); return false; }
    slots[idx]={type,remain: type==='Сфера Искр'?20: type==='Ларец Бури'?45:90,started:false};
    app.state.emit();
    return true;
  }

  const origBuildNav=app.buildNav.bind(app);
  app.buildNav=function(parent){
    origBuildNav(parent);
    const nav=parent.querySelector('.nav');
    if(!nav || nav.dataset.extended) return;
    nav.dataset.extended='1';
    const extra=[['upgrades','Улучшения','⬆️'],['chests','Сундуки','📦'],['quests','Квесты','✅'],['achievements','Достижения','🏅'],['shop','Магазин','🛒']];
    for(const [id,txt,ic] of extra){const b=document.createElement('button');b.className='tab-extra';b.innerHTML=`<div>${ic}</div><div>${txt}</div>`;b.onclick=()=>{for(const bb of nav.children)bb.classList.remove('active');b.classList.add('active');app.screens.show(id);};nav.appendChild(b);}
  };

  const origBuildUI=app.buildUI.bind(app);
  app.buildUI=function(){
    origBuildUI();
    const mk=(id,title,html)=>{
      if(this.ui.screens[id]) return;
      const sc=this.ui.makeScreen(id); this.buildTop(sc);
      const c=document.createElement('div'); c.className='main-content'; c.innerHTML=`<div class="card"><h3>${title}</h3></div><div style="height:8px"></div>${html}`;
      sc.appendChild(c); this.buildNav(sc);
    };
    mk('upgrades','Прокачка карт','<div id="upgradeList"></div>');
    mk('chests','Сундуки','<div id="chestSlots"></div><div class="card"><h4>Открытие</h4><div id="chestOpen"></div></div>');
    mk('quests','Квесты','<div class="card"><h4>Ежедневные</h4><div id="dailyQuests"></div></div><div style="height:8px"></div><div class="card"><h4>Еженедельные</h4><div id="weeklyQuests"></div></div>');
    mk('achievements','Достижения','<div id="achievementList"></div>');
    mk('shop','Магазин','<div id="shopList"></div>');

    const battle=this.ui.screens.battle;
    if(!battle.querySelector('.placement-overlay')){
      const ov=document.createElement('canvas');ov.className='placement-overlay';ov.id='placementOverlay';battle.appendChild(ov);
      const hud=document.createElement('div');hud.className='hud-top';hud.innerHTML='<div class="hud-chip" id="battleTimer">03:00</div><div class="hud-chip" id="battleCrowns">👑 0 : 0</div>';battle.appendChild(hud);
    }
  };

  document.getElementById('frame').innerHTML='';
  app.ui.screens={};
  app.buildUI();
  app.renderDynamic();

  app.battle.regen=0.65; app.battle.enemyRegen=0.62;
  app.battle.energyLock=0; app.battle.enemyLock=0; app.battle.cardCd={}; app.battle.enemyCardCd={};
  app.battle.maxTime=180; app.battle.overtime=90; app.battle.inOvertime=false;

  const origStart=app.battle.start.bind(app.battle);
  app.battle.start=function(){
    origStart();
    this.energyLock=0;this.enemyLock=0;this.cardCd={};this.enemyCardCd={};
    this.maxTime=180;this.inOvertime=false;this.matchEnded=false;
    if(this.ui.energyFill)this.ui.energyFill.parentElement.classList.add('super');
  };

  app.battle.cleanupDead=function(){
    const before=this.unitSystem.units.length;
    this.unitSystem.units=this.unitSystem.units.filter(u=>!(u.dead&&u.deathTimer<=0));
    return before-this.unitSystem.units.length;
  };

  const origApplyDamage=app.battle.applyDamage.bind(app.battle);
  app.battle.applyDamage=function(target,damage,fromTeam){
    origApplyDamage(target,damage,fromTeam);
    if(target&&target.id&&target.hp<=0){
      target.dead=true;target.deathTimer=0.22;target.vy=-26;target.rot=0;
    }
  };

  function fmt(sec){sec=Math.max(0,Math.floor(sec));const m=Math.floor(sec/60);const s=sec%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;}
  function crowns(){
    const t=app.battle.towerSystem.towers;
    const p=t.filter(x=>x.team==='player'&&x.hp<=0).length;
    const e=t.filter(x=>x.team==='enemy'&&x.hp<=0).length;
    return {player:e,enemy:p};
  }

  const oldUpdate=app.battle.update.bind(app.battle);
  app.battle.update=function(dt){
    if(this.matchEnded)return;
    this.time+=dt;
    this.energyLock=Math.max(0,this.energyLock-dt); this.enemyLock=Math.max(0,this.enemyLock-dt);
    const regMul=this.inOvertime?1.25:1;
    if(this.energyLock<=0)this.energy=Math.min(this.maxEnergy,this.energy+this.regen*regMul*dt);
    if(this.enemyLock<=0)this.enemyEnergy=Math.min(this.maxEnergy,this.enemyEnergy+this.enemyRegen*regMul*dt);
    this.ui.updateEnergy(this.energy,this.maxEnergy);
    if(this.ui.energyFill){
      this.ui.energyFill.classList.toggle('pulse',Math.floor(performance.now()/200)%2===0&&this.energy<10&&this.energyLock<=0);
      this.ui.energyFill.parentElement.classList.toggle('super',this.energy>=9.99);
    }

    for(const k in this.cardCd){this.cardCd[k]=Math.max(0,this.cardCd[k]-dt);}
    for(const k in this.enemyCardCd){this.enemyCardCd[k]=Math.max(0,this.enemyCardCd[k]-dt);}

    const units=this.unitSystem.units;
    for(const u of units){
      if(u.dead){u.deathTimer=(u.deathTimer||0)-dt;u.y+=(u.vy||-20)*dt;u.rot=(u.rot||0)+dt*6;continue;}
      u.anim=(u.anim||0)+dt*8;u.cooldown-=dt;u.flash=Math.max(0,u.flash-dt*6);
      const enemies=this.unitSystem.units.filter(e=>e.team!==u.team&&!e.dead).concat(this.towerSystem.towers.filter(t=>t.team!==u.team&&t.hp>0));
      let nearest=null,nd=1e9;
      for(const e of enemies){const d=Math.hypot(e.x-u.x,e.y-u.y);if(d<nd){nd=d;nearest=e;}}
      if(nearest && nd<=u.range){if(u.cooldown<=0){u.cooldown=u.attackSpeed; this.projectiles.shoot(u,nearest,u.damage,u.team,'arrow'); this.particles.spawn(nearest.x,nearest.y,'rgba(255,255,255,.6)',4);}}
      else if(nearest){const ang=Math.atan2(nearest.y-u.y,nearest.x-u.x);u.x+=Math.cos(ang)*u.speed*dt;u.y+=Math.sin(ang)*u.speed*dt;}
    }
    for(const t of this.towerSystem.towers){if(t.hp<=0)continue;t.cool-=dt;if(t.cool>0)continue;const enemies=units.filter(u=>u.team!==t.team&&!u.dead);let tar=null,nd=1e9;for(const e of enemies){const d=Math.hypot(e.x-t.x,e.y-t.y);if(d<t.range&&d<nd){nd=d;tar=e;}}if(tar){t.cool=.95;this.projectiles.shoot(t,tar,t.damage,t.team,'arrow');}}
    this.projectiles.update(dt,this); this.particles.update(dt);
    this.cleanupDead();

    const mainP=this.towerSystem.towers.find(t=>t.team==='player'&&t.main);
    const mainE=this.towerSystem.towers.find(t=>t.team==='enemy'&&t.main);
    if(mainP.hp<=0||mainE.hp<=0){
      const win=mainE.hp<=0 && mainP.hp>0;
      return this.endMatch(win,'Башня короля уничтожена');
    }

    const left=this.maxTime-this.time;
    if(!this.inOvertime && left<=0){this.inOvertime=true;this.time=0;app.ui.toast('Овертайм! Регенерация ускорена');app.audio.cast();}
    else if(this.inOvertime && left<=0){
      const c=crowns();
      let win=false;
      if(c.player!==c.enemy) win=c.player>c.enemy;
      else win=mainE.hp<mainP.hp;
      return this.endMatch(win,'Время вышло');
    }

    const t=document.getElementById('battleTimer'); if(t)t.textContent=fmt(left);
    const cr=document.getElementById('battleCrowns'); const c=crowns(); if(cr)cr.textContent=`👑 ${c.player} : ${c.enemy}`;
    this.ai.update(dt); this.render();
  };

  app.battle.endMatch=function(win,reason){
    if(this.matchEnded) return; this.matchEnded=true; this.running=false;
    app.onBattleFinished(win,reason);
  };

  const oldDeploy=app.battle.deployUnit.bind(app.battle);
  app.battle.deployUnit=function(team,cardId,x,y){
    const cd=team==='player'?this.cardCd:this.enemyCardCd;
    const lockKey=team==='player'?'energyLock':'enemyLock';
    if((cd[cardId]||0)>0)return false;
    const ok=oldDeploy(team,cardId,x,y);
    if(ok){cd[cardId]=1.0;this[lockKey]=0.55; if(team==='player')questEvent('playCard',1);}
    return ok;
  };
  const oldCast=app.battle.castSpell.bind(app.battle);
  app.battle.castSpell=function(team,cardId,x,y){
    const cd=team==='player'?this.cardCd:this.enemyCardCd;
    const lockKey=team==='player'?'energyLock':'enemyLock';
    if((cd[cardId]||0)>0)return false;
    const ok=oldCast(team,cardId,x,y);
    if(ok){cd[cardId]=1.15;this[lockKey]=0.55; if(team==='player')questEvent('playCard',1);}
    return ok;
  };

  app.ui.updateEnergy=function(v,max){
    if(!this.energyFill)return;
    this.energyFill.style.width=(v/max*100)+'%';
    this.energyLabel.textContent=`Энергия: ${v.toFixed(1)}/${max}`;
  };

  const ov=document.getElementById('placementOverlay');
  function drawOverlay(x,y,valid){
    if(!ov) return;
    const r=ov.getBoundingClientRect();ov.width=r.width;ov.height=r.height;
    const c=ov.getContext('2d'); c.clearRect(0,0,ov.width,ov.height);
    c.fillStyle='rgba(56,189,248,.11)'; c.fillRect(0,ov.height*0.55,ov.width,ov.height*0.45);
    c.strokeStyle=valid?'rgba(34,197,94,.8)':'rgba(239,68,68,.85)'; c.lineWidth=2; c.beginPath(); c.arc(x,y,26,0,Math.PI*2); c.stroke();
  }

  app.bindBattleInput=function(){
    const canvas=this.battle.canvas;
    const state={drag:false,card:null};
    const getPos=e=>{const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};};
    const valid=y=>y>canvas.height*0.55;
    canvas.oncontextmenu=e=>{e.preventDefault();this.input.cancel();if(ov)ov.classList.remove('show');};
    canvas.addEventListener('pointerdown',e=>{
      if(this.input.selectedCard){state.drag=true;state.card=this.input.selectedCard; if(ov)ov.classList.add('show'); const p=getPos(e); drawOverlay(p.x,p.y,valid(p.y));}
    });
    canvas.addEventListener('pointermove',e=>{if(!state.drag||!state.card)return;const p=getPos(e);drawOverlay(p.x,p.y,valid(p.y));});
    canvas.addEventListener('pointerup',e=>{
      const p=getPos(e);
      if(this.input.selectedCard){
        if(!valid(p.y)){this.ui.toast('Нельзя ставить карту в зоне врага');}
        else {
          const ok=this.battle.placePlayerCard(this.input.selectedCard.id,p.x,p.y);
          if(!ok)this.ui.toast('Недостаточно энергии или карта на перезарядке');
        }
      }
      state.drag=false; state.card=null; if(ov)ov.classList.remove('show');
    });
  };

  const achDefs=[
    {id:'wins',title:'Победы',tiers:[1,10,30],reward:[50,180,500]},
    {id:'cups',title:'Путь кубков',tiers:[200,800,1600],reward:[80,220,600]},
    {id:'upgrade',title:'Улучшения карт',tiers:[1,10,25],reward:[50,130,360]}
  ];

  function questEvent(type,val){
    const q=s.meta.quests;
    const map={playCard:['cast8'],win:['win1','wins8'],towerDmg:['dmg'],battle:['play2']};
    for(const id of map[type]||[]){
      for(const listName of ['daily','weekly']){
        const it=q[listName].find(x=>x.id===id); if(!it||it.claimed) continue; it.progress=Math.min(it.goal,it.progress+val);
      }
    }
  }

  const origOnBattleFinished=app.onBattleFinished.bind(app);
  app.onBattleFinished=function(win,reason='Бой завершён'){
    this.trophy.onBattleEnd(win);
    questEvent('battle',1); if(win) questEvent('win',1);
    const chestTypes=['Сфера Искр','Ларец Бури','Кристальный Ящик'];
    if(win) addChest(chestTypes[Math.floor(Math.random()*chestTypes.length)]);
    s.meta.history.unshift({time:Date.now(),win,delta:win?30:-18,arena:this.arenaSystem.getSelected().name,reason});
    s.meta.history=s.meta.history.slice(0,20);
    const rewardGold=win?90:35; this.state.addGold(rewardGold);
    this.showModal(`<div class='results-panel'><h2>${win?'ПОБЕДА':'ПОРАЖЕНИЕ'}</h2><div class='small'>${reason}</div><p>Кубки: ${win?'+30':'-18'}</p><p>Золото: +${rewardGold}</p><div class='row'><button class='hero-button' id='again'>Сыграть ещё</button><button class='hero-button' id='menuBack'>В меню</button></div></div>`);
    document.getElementById('again').onclick=()=>{this.modal.classList.remove('show');this.startBattle();};
    document.getElementById('menuBack').onclick=()=>{this.modal.classList.remove('show');this.screens.show('menu');};
    this.state.emit();
  };

  const oldOpenProfile=app.openProfile.bind(app);
  app.openProfile=function(){
    const h=s.meta.history.slice(0,8).map(i=>`<div class='small'>${new Date(i.time).toLocaleString('ru-RU')} · ${i.win?'Победа':'Поражение'} (${i.delta>0?'+':''}${i.delta}) · ${i.arena}</div>`).join('');
    const p=this.state.get('profile');
    this.showModal(`<h2>Профиль</h2><div class='card'><div>Ник: <b>${p.name}</b></div><div>Уровень: ${p.level}</div><div>Кубки: ${p.cups}</div><div>Побед/Поражений: ${p.wins}/${p.losses}</div></div><div style='height:8px'></div><div class='card'><h4>История боёв</h4>${h||'<div class="small">Пока пусто</div>'}</div><div style='height:8px'></div><button class='hero-button' id='closeModalBtn'>Закрыть</button>`);
    document.getElementById('closeModalBtn').onclick=()=>this.modal.classList.remove('show');
  };

  app.renderUpgrades=function(){
    const el=document.getElementById('upgradeList'); if(!el)return; el.innerHTML='';
    for(const c of CARD_DB.slice(0,60)){
      const d=this.state.get('cards.'+c.id); if(!d) continue;
      const can=d.copies>=this.upgrade.needCopiesFor(c.id)&&this.state.get('profile.gold')>=this.upgrade.costFor(c.id);
      const row=document.createElement('div'); row.className='offer';
      row.innerHTML=`<div class='row between'><b>${c.name}</b><span>Ур. ${d.level}</span></div><div class='small'>Копии: ${d.copies}/${this.upgrade.needCopiesFor(c.id)} · Цена: ${this.upgrade.costFor(c.id)}</div><button ${can?'':'disabled'}>Улучшить</button>`;
      row.querySelector('button').onclick=()=>{if(this.upgrade.upgrade(c.id)){questEvent('upgrade',1);this.ui.toast('Улучшено');}else this.ui.toast('Не хватает золота/копий');};
      el.appendChild(row);
    }
  };

  app.renderChests=function(){
    const slots=document.getElementById('chestSlots'); if(!slots)return;
    slots.innerHTML='';
    s.meta.chests.slots.forEach((c,i)=>{
      const d=document.createElement('div'); d.className='chest-card';
      if(!c){ d.innerHTML=`<div>Слот ${i+1}: пусто</div>`; slots.appendChild(d); return; }
      d.innerHTML=`<div class='row between'><b>${c.type}</b><span>${c.started?Math.ceil(c.remain)+'с':'Готов к запуску'}</span></div><div class='row'><button id='start${i}'>${c.started?'Ускорить (бесплатно)':'Открывать'}</button></div>`;
      d.querySelector('button').onclick=()=>{
        if(!c.started){c.started=true;} else c.remain=0;
        if(c.remain<=0){const rw=chestReward(c.type);app.state.addGold(rw.gold);app.state.state.cards[rw.card].copies+=rw.copies; app.ui.toast(`Сундук: +${rw.gold} золота, +${rw.copies} ${app.cardSystem.getById(rw.card).name}`); s.meta.chests.slots[i]=null;}
        app.state.emit();
      };
      slots.appendChild(d);
    });
  };

  app.renderQuests=function(){
    ensureQuests();
    const rd=(arr,id)=>{const e=document.getElementById(id); if(!e)return; e.innerHTML=''; arr.forEach(q=>{const can=q.progress>=q.goal&&!q.claimed; const d=document.createElement('div'); d.className='quest'; d.innerHTML=`<div class='row between'><b>${q.title}</b><span>${q.progress}/${q.goal}</span></div><div class='progress'><div style='width:${Math.min(100,q.progress/q.goal*100)}%'></div></div><div class='small'>Награда: ${q.reward.gold} золота${q.reward.cups?', '+q.reward.cups+' кубков':''}</div><button ${can?'':'disabled'}>${q.claimed?'Получено':'Забрать'}</button>`; d.querySelector('button').onclick=()=>{q.claimed=true;app.state.addGold(q.reward.gold);if(q.reward.cups)app.state.addCups(q.reward.cups);if(q.reward.chest)addChest(q.reward.chest);app.ui.toast('Награда квеста получена');app.state.emit();}; e.appendChild(d);});};
    rd(s.meta.quests.daily,'dailyQuests'); rd(s.meta.quests.weekly,'weeklyQuests');
  };

  app.renderAchievements=function(){
    const e=document.getElementById('achievementList'); if(!e)return; e.innerHTML='';
    const val={wins:s.profile.wins,cups:s.profile.cups,upgrade:(s.meta.history.filter(x=>x.reason==='upgrade').length)};
    achDefs.forEach(a=>{
      const st=s.meta.achievements[a.id]||{tier:0,claimed:0};
      const need=a.tiers[st.tier]||null; const done=need!==null && (a.id==='upgrade'?0:val[a.id])>=need;
      const d=document.createElement('div'); d.className='offer';
      d.innerHTML=`<div class='row between'><b>${a.title}</b><span>Этап ${st.tier+1}/${a.tiers.length}</span></div><div class='small'>Требование: ${need??'Выполнено'} · Прогресс: ${val[a.id]||0}</div><button ${done?'':'disabled'}>${need?'Забрать '+a.reward[st.tier]+' золота':'Готово'}</button>`;
      d.querySelector('button').onclick=()=>{if(!done)return; app.state.addGold(a.reward[st.tier]); s.meta.achievements[a.id]={tier:st.tier+1}; app.ui.toast('Достижение получено'); app.state.emit();};
      e.appendChild(d);
    });
  };

  function seeded(seed){let h=2166136261;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}return ()=>((h=Math.imul(h^h>>>15,2246822507))>>>0)/4294967295;}
  app.renderShop=function(){
    const el=document.getElementById('shopList'); if(!el)return;
    const seed=nowDate(); const rng=seeded(seed);
    if(s.meta.shop.seed!==seed){s.meta.shop.seed=seed;s.meta.shop.claimedGift=false;s.meta.shop.bought={};}
    const offers=[
      {id:'gift',title:'Ежедневный подарок',desc:'Бесплатно 120 золота',price:0,reward:{gold:120}},
      {id:'card1',title:'Пачка карт',desc:'Случайные копии',price:Math.floor(60+rng()*80),reward:{copies:6,card:CARD_DB[Math.floor(rng()*CARD_DB.length)].id}},
      {id:'card2',title:'Редкая поставка',desc:'Больше копий и золота',price:Math.floor(120+rng()*120),reward:{copies:10,gold:80,card:CARD_DB[Math.floor(rng()*CARD_DB.length)].id}},
    ];
    el.innerHTML='';
    offers.forEach(o=>{const bought=s.meta.shop.bought[o.id];const d=document.createElement('div');d.className='offer';d.innerHTML=`<b>${o.title}</b><div class='small'>${o.desc}</div><div class='row between'><span>${o.price===0?'Бесплатно':o.price+' золота'}</span><button ${bought?'disabled':''}>${bought?'Куплено':'Получить'}</button></div>`;d.querySelector('button').onclick=()=>{if(bought)return;if(o.price>0&&s.profile.gold<o.price){app.ui.toast('Недостаточно золота');return;}if(o.price>0)app.state.addGold(-o.price);if(o.reward.gold)app.state.addGold(o.reward.gold);if(o.reward.copies){s.cards[o.reward.card].copies+=o.reward.copies;}s.meta.shop.bought[o.id]=true;app.ui.toast('Покупка успешна');app.state.emit();};el.appendChild(d);});
  };

  const oldRender=app.renderDynamic.bind(app);
  app.renderDynamic=function(){
    oldRender();
    this.renderUpgrades(); this.renderChests(); this.renderQuests(); this.renderAchievements(); this.renderShop();
  };

  const oldLoop=app.battle.loop.bind(app.battle);
  app.battle.loop=function(){
    if(!this.running) return;
    const now=performance.now(); this._last=this._last||now; const dt=Math.min(.033,(now-this._last)/1000); this._last=now;
    app.tweens.tick(dt);
    for(const c of s.meta.chests.slots){if(c&&c.started&&c.remain>0)c.remain=Math.max(0,c.remain-dt);}
    this.update(dt);
    requestAnimationFrame(()=>this.loop());
  };

  app.state.emit();
})();
</script>


<script>
(function(){
  const STORAGE_PREFIX='arena_legends_';
  const bootState={rendered:false,lastRender:performance.now(),lastUpdate:performance.now(),safe:false};
  const errors=[];

  function keyMatches(k){ return !!k && (k.startsWith(STORAGE_PREFIX)||/arena|legend|battle|deck|reward|quest/i.test(k)); }
  function resetAllData(){
    const del=[];
    for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(keyMatches(k)) del.push(k); }
    del.forEach(k=>localStorage.removeItem(k));
    location.reload();
  }

  const overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;right:8px;top:8px;width:min(92vw,460px);max-height:70vh;overflow:auto;z-index:99999;background:rgba(2,6,23,.95);border:1px solid #334155;border-radius:10px;padding:10px;font:12px/1.35 monospace;color:#e2e8f0;display:none';
  overlay.innerHTML='<div style="display:flex;justify-content:space-between"><b>Консоль ошибок (F1)</b><button id="errClr">Очистить</button></div><div id="errOut"></div>';
  document.body.appendChild(overlay);
  const errOut=overlay.querySelector('#errOut');
  overlay.querySelector('#errClr').onclick=()=>{errors.length=0;errOut.innerHTML='';};
  function pushError(msg,stack){
    errors.push({t:new Date().toLocaleTimeString('ru-RU'),msg:String(msg),stack:String(stack||'')});
    while(errors.length>50) errors.shift();
    errOut.innerHTML=errors.slice().reverse().map(e=>`<div style="border-top:1px solid #1e293b;padding:6px 0"><div style="color:#fca5a5">[${e.t}] ${e.msg}</div><pre style="white-space:pre-wrap;color:#93c5fd">${e.stack.replace(/[<>]/g,m=>m==='<'?'&lt;':'&gt;')}</pre></div>`).join('');
  }
  window.addEventListener('keydown',e=>{if(e.key==='F1'){e.preventDefault();overlay.style.display=overlay.style.display==='none'?'block':'none';}});
  window.onerror=(m,sr,l,c,er)=>{pushError(m,er?.stack||`${sr}:${l}:${c}`); return false;};
  window.addEventListener('unhandledrejection',e=>pushError('Unhandled rejection',e.reason?.stack||JSON.stringify(e.reason)));

  function ensureCanvasSize(){
    const c=document.getElementById('battleCanvas'); if(!c) return true;
    const r=c.getBoundingClientRect();
    if(r.width<=1||r.height<=1){ c.style.width='100%'; c.style.height='100%'; return false; }
    return true;
  }
  function showSafeMode(reason){
    if(bootState.safe) return;
    bootState.safe=true;
    const frame=document.getElementById('frame')||document.body;
    frame.innerHTML='';
    const wrap=document.createElement('div');
    wrap.className='safe-mode';
    wrap.style.cssText='position:absolute;inset:0;background:linear-gradient(180deg,#020617,#111827);color:#e2e8f0;padding:16px;font-family:Arial;overflow:auto';
    wrap.innerHTML=`<h2>SAFE MODE</h2><p>Причина: ${reason}</p><div id="diag" style="background:#0f172a;border:1px solid #334155;border-radius:10px;padding:10px"></div><div style="display:flex;gap:8px;margin-top:10px"><button id="resetSafe" style="flex:1;padding:12px;border-radius:10px;background:#ef4444;color:#fff;border:0">Сбросить настройки / очистить сохранения</button><button id="restartSafe" style="flex:1;padding:12px;border-radius:10px;background:#22d3ee;color:#00111f;border:0">Перезапуск</button></div>`;
    frame.appendChild(wrap);
    const diag=wrap.querySelector('#diag');
    const active=document.querySelector('.screen.active');
    diag.innerHTML=[`Canvas OK: ${ensureCanvasSize()}`,`window.app: ${!!window.app}`,`active screen: ${active?active.id:'нет'}`,`screens: ${document.querySelectorAll('.screen').length}`].map(x=>`<div>${x}</div>`).join('');
    wrap.querySelector('#resetSafe').onclick=resetAllData;
    wrap.querySelector('#restartSafe').onclick=()=>location.reload();
  }

  function smokeTest(){
    const cOk=ensureCanvasSize();
    const hasActive=!!document.querySelector('.screen.active');
    const visible=!!document.querySelector('.topbar,.safe-mode,.screen.active');
    if(!(cOk&&hasActive&&visible)){
      pushError('Smoke Test failed',`canvas=${cOk} active=${hasActive} visible=${visible}`);
      showSafeMode('Smoke Test провален');
      return false;
    }
    return true;
  }

  setTimeout(()=>{
    const active=document.querySelector('.screen.active');
    if(!active){ pushError('BOOT watchdog','No active screen in 1s'); showSafeMode('BOOT watchdog'); }
  },1000);

  const warn=document.createElement('div');
  warn.style.cssText='position:fixed;left:8px;top:8px;z-index:99998;background:rgba(15,23,42,.86);border:1px solid #334155;border-radius:8px;padding:6px 8px;font:11px monospace;color:#fde68a;display:none';
  document.body.appendChild(warn);

  function renderBeat(){ bootState.lastRender=performance.now(); bootState.rendered=true; requestAnimationFrame(renderBeat); }
  requestAnimationFrame(renderBeat);

  function patchApp(){
    const app=window.app; if(!app||!app.screens) return;
    if(!app.__bootPatch){
      app.__bootPatch=true;
      const os=app.screens.show?.bind(app.screens);
      app.screens.show=function(id){
        const screenMap=this.ui?.screens||window.app?.ui?.screens||{}; const target=screenMap[id]?id:'menu';
        try{ os&&os(target); }
        catch(e){ pushError('screen show error',e.stack||e); if(target!=='menu'&&screenMap.menu){ os('menu'); } else showSafeMode('ScreenManager fallback error'); }
      };
      if(app.battle){
        const ou=app.battle.update?.bind(app.battle);
        if(ou) app.battle.update=function(dt){ bootState.lastUpdate=performance.now(); return ou(dt); };
      }
      const settingsRoot=document.querySelector('#qualityBtns')?.closest('.main-content');
      if(settingsRoot&&!settingsRoot.querySelector('#resetDataSettings')){
        const card=document.createElement('div'); card.className='card'; card.style.marginTop='8px';
        card.innerHTML='<h3>Восстановление</h3><button id="resetDataSettings" class="hero-button" style="background:linear-gradient(180deg,#ef4444,#b91c1c);color:#fff">Сбросить настройки / очистить сохранения</button>';
        settingsRoot.appendChild(card);
        card.querySelector('#resetDataSettings').onclick=resetAllData;
      }
    }
    if(!document.querySelector('.screen.active')) app.screens.show('menu');
  }

  setInterval(()=>{
    patchApp();
    ensureCanvasSize();
    const now=performance.now();
    const renderStall=now-bootState.lastRender>1800;
    const updateStall=window.app?.battle?.running && now-bootState.lastUpdate>2200;
    warn.style.display=(renderStall||updateStall)?'block':'none';
    if(renderStall||updateStall) warn.textContent=`Предупреждение: ${renderStall?'render ':''}${updateStall?'update':''} stall`;
  },300);

  window.addEventListener('resize',()=>{ ensureCanvasSize(); try{window.app?.battle?.resize?.();}catch(e){pushError('resize',e.stack||e);} });
  window.addEventListener('orientationchange',()=>setTimeout(()=>{ensureCanvasSize(); try{window.app?.battle?.resize?.();}catch(e){pushError('orientation resize',e.stack||e);} },50));
  setTimeout(smokeTest,1400);
})();
</script>
</body></html>
