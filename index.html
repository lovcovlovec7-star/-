<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Линия Штурма</title>
  <style>
    :root{--bg:#07101d;--panel:rgba(18,28,44,.9);--line:rgba(132,187,255,.35);--txt:#e9f4ff;--muted:#9ab3cf;--acc:#5bc6ff;--gold:#ffcf61;--good:#81f5aa;--bad:#ff8f8f;--tabH:74px}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(circle at 50% -30%,#2a4368,#0a1320 55%,#070d18);color:var(--txt);font-family:Inter,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
    #app{position:fixed;inset:0;display:grid;place-items:center;padding:10px}
    #frame{width:min(98vw,56vh);height:min(98vh,175vw);aspect-ratio:9/16;position:relative;overflow:hidden;border-radius:18px;box-shadow:0 20px 70px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,255,255,.08);background:#12233c}
    #battleCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;background:#1c2f4c}
    #ui{position:absolute;inset:0;pointer-events:none}
    .screen{position:absolute;inset:0;opacity:0;transform:translateX(12px) scale(.985);transition:.25s ease;pointer-events:none}
    .screen.active{opacity:1;transform:none;pointer-events:auto}
    .shell{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(8,14,24,.45),rgba(6,10,18,.93))}
    .top{height:78px;display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(49,80,119,.35),rgba(11,19,33,.45));backdrop-filter:blur(4px)}
    .account{pointer-events:auto;display:flex;gap:10px;align-items:center;background:rgba(28,45,69,.8);border:1px solid rgba(153,205,255,.35);border-radius:999px;padding:6px 10px;cursor:pointer}
    .avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(180deg,#87d7ff,#3e8aca);font-weight:900;color:#10283f}
    .title{font-weight:900;letter-spacing:.4px}
    .content{flex:1;padding:12px;padding-bottom:calc(var(--tabH) + 10px);overflow:auto}
    .card{background:linear-gradient(180deg,rgba(34,54,80,.88),rgba(12,20,34,.95));border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:inset 0 0 25px rgba(131,190,255,.08)}
    .btn{pointer-events:auto;border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer;color:#0e2236;background:linear-gradient(180deg,#9eeaff,#49c0ff)}
    .btn.secondary{background:rgba(34,53,80,.9);color:#d6ebff;border:1px solid rgba(145,194,255,.35)}
    .btn.warn{background:linear-gradient(180deg,#ffcc95,#ff8f7b);color:#3a130b}
    .big{width:100%;font-size:25px;padding:18px}
    .tabs{position:absolute;left:8px;right:8px;bottom:8px;height:var(--tabH);display:grid;grid-template-columns:repeat(5,1fr);gap:6px;background:rgba(11,20,34,.75);border:1px solid rgba(155,204,255,.25);padding:8px;border-radius:14px}
    .tab{pointer-events:auto;border:0;border-radius:10px;background:rgba(23,40,62,.82);color:#d7ebff;font-weight:700;font-size:12px;cursor:pointer}
    .tab.active{background:linear-gradient(180deg,#6ed8ff,#299bde);color:#052036}
    .row{display:flex;gap:8px;align-items:center}.split{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .arena-grid,.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .arena{padding:8px;border-radius:12px;border:1px solid var(--line);min-height:110px;cursor:pointer;pointer-events:auto;position:relative;overflow:hidden}
    .arena.locked{filter:saturate(.2);opacity:.65}
    .arena small{color:var(--muted)}
    .track{overflow:auto;white-space:nowrap;padding:6px 2px}
    .milestone{display:inline-block;vertical-align:top;width:150px;margin-right:8px;border:1px solid var(--line);border-radius:11px;padding:8px;background:rgba(27,43,67,.85)}
    .cards-grid{grid-template-columns:repeat(3,1fr);max-height:420px;overflow:auto;padding-right:4px}
    .card-tile{pointer-events:auto;border:1px solid var(--line);border-radius:10px;background:rgba(21,33,53,.88);padding:6px;cursor:pointer}
    .deck-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{border:1px dashed rgba(155,202,255,.45);border-radius:10px;min-height:60px;padding:4px;text-align:center;display:grid;place-items:center}
    .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,8,14,.65);pointer-events:auto}
    .overlay.show{display:flex}
    .modal{width:min(90%,420px);max-height:80%;overflow:auto;background:linear-gradient(180deg,#1d3151,#0f1a2c);border:1px solid var(--line);border-radius:14px;padding:12px}

    .battle-ui{position:absolute;inset:0;display:none}.battle-ui.active{display:block}
    .hud{position:absolute;left:8px;right:8px;top:8px;display:grid;grid-template-columns:1fr auto 1fr;gap:6px;pointer-events:none}
    .hudbox{background:rgba(10,18,30,.72);border:1px solid rgba(158,208,255,.28);border-radius:10px;padding:8px;font-weight:800;text-align:center}
    .energy-wrap{position:absolute;left:14px;right:14px;top:70px;background:rgba(9,17,30,.86);border:1px solid rgba(144,205,255,.5);border-radius:12px;padding:8px 10px;z-index:20}
    .energy-label{font-weight:900;font-size:14px;margin-bottom:6px;text-shadow:0 0 8px rgba(104,196,255,.4)}
    .energy-bar{height:16px;border-radius:999px;background:rgba(31,47,69,.95);border:1px solid rgba(175,218,255,.45);overflow:hidden;position:relative}
    .energy-fill{height:100%;width:0%;background:linear-gradient(90deg,#4ab6ff,#90f2ff);box-shadow:0 0 14px rgba(103,214,255,.7);transition:width .18s linear, filter .2s ease}
    .energy-fill.full{filter:brightness(1.3);box-shadow:0 0 24px rgba(128,239,255,.95)}
    .energy-pulse{position:absolute;inset:0;background:linear-gradient(120deg,transparent,rgba(255,255,255,.3),transparent);animation:pulse 1.2s infinite;mix-blend-mode:screen;opacity:.3}
    @keyframes pulse{0%{transform:translateX(-100%)}100%{transform:translateX(120%)}}
    .hand{position:absolute;left:8px;right:8px;bottom:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .battle-card{pointer-events:auto;border-radius:10px;border:1px solid rgba(154,204,255,.35);padding:6px;background:rgba(15,26,42,.9);font-size:12px;cursor:pointer}
    .battle-card.selected{outline:2px solid #8fe5ff;transform:translateY(-4px)}.battle-card.off{opacity:.45}
    .zone{position:absolute;left:0;right:0;bottom:0;height:50%;border-top:2px dashed rgba(104,221,255,.8);background:linear-gradient(180deg,transparent,rgba(78,188,255,.13));display:none}
    .zone.show{display:block}
  </style>
</head>
<body>
<div id="app"><div id="frame"><canvas id="battleCanvas" width="900" height="1600"></canvas><div id="ui"></div></div></div>
<script>
(()=>{
const APP_STATES={BOOT:'BOOT',MAIN_MENU:'MAIN_MENU',PROFILE:'PROFILE',ARENA_SELECTION:'ARENA_SELECTION',COLLECTION:'COLLECTION',DECK_BUILDER:'DECK_BUILDER',CARD_UPGRADE:'CARD_UPGRADE',SETTINGS:'SETTINGS',BATTLE:'BATTLE',RESULTS:'RESULTS'};
const TEAM={PLAYER:'player',ENEMY:'enemy'};
const W=900,H=1600,LANES=[270,630];
const ARENAS=[
{id:'meadow',name:'Луговая долина',cups:0,palette:['#28466a','#1d3352','#2c7bb4'],river:810},
{id:'frost',name:'Морозный разлом',cups:200,palette:['#1f3f5f','#193453','#8ed5ff'],river:792},
{id:'ember',name:'Пепельный бастион',cups:500,palette:['#4a2f2f','#352020','#d87649'],river:825},
{id:'storm',name:'Грозовой берег',cups:900,palette:['#1f3550','#14263a','#8c88ff'],river:800},
{id:'sun',name:'Солнечный каньон',cups:1300,palette:['#5d4330','#3b2b1e','#f1b860'],river:840},
{id:'void',name:'Сумрачная цитадель',cups:1800,palette:['#2e2949','#1d1a32','#c686ff'],river:808}
];
const REWARDS=[{cups:100,type:'gold',value:250},{cups:300,type:'cards',card:'blade_runner',value:20},{cups:600,type:'frame',value:'Сапфировая рамка'},{cups:1000,type:'gold',value:600},{cups:1400,type:'cards',card:'spark_mage',value:10},{cups:1900,type:'frame',value:'Императорская рамка'}];
const CARDS={
blade_runner:{name:'Клинок',type:'unit',rarity:'common',cost:2,base:{hp:280,dmg:72,speed:115,range:22,as:1.2,r:14,target:'ground'}},
shield_brute:{name:'Щитоносец',type:'unit',rarity:'rare',cost:4,base:{hp:1020,dmg:100,speed:70,range:24,as:.82,r:20,target:'ground'}},
arc_shooter:{name:'Лучник дуги',type:'unit',rarity:'common',cost:3,base:{hp:360,dmg:90,speed:76,range:200,as:.88,r:14,target:'all',proj:420}},
spark_mage:{name:'Искровой маг',type:'unit',rarity:'epic',cost:4,base:{hp:320,dmg:80,speed:72,range:192,as:.76,r:15,target:'all',proj:350,splash:62}},
sky_drone:{name:'Небесный дрон',type:'unit',rarity:'rare',cost:3,base:{hp:260,dmg:72,speed:98,range:160,as:1,r:13,target:'all',proj:460,air:true}},
swarm_pack:{name:'Рой',type:'unit',rarity:'common',cost:3,base:{hp:100,dmg:42,speed:125,range:18,as:1.2,r:10,target:'ground',count:5}},
fire_burst:{name:'Огненный всплеск',type:'spell',rarity:'rare',cost:4,spell:{radius:100,dmg:250,towerMul:.5}},
freeze_pulse:{name:'Импульс льда',type:'spell',rarity:'epic',cost:3,spell:{radius:118,freeze:2.2}},
lightning_pike:{name:'Громовой пик',type:'spell',rarity:'legendary',cost:5,spell:{radius:240,chains:3,dmg:210,towerMul:.68}},
dash_totem:{name:'Тотем рывка',type:'spell',rarity:'common',cost:2,spell:{radius:125,dur:4,speed:1.45,as:1.25}}
};
const DEFAULT_DECK=['blade_runner','shield_brute','arc_shooter','spark_mage','sky_drone','swarm_pack','fire_burst','freeze_pulse'];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

class Save{constructor(){this.key='line_assault_overhaul_v3';this.data=this.load()}load(){const fb={profile:{nick:'Командир',level:1,xp:0,gold:500,cups:0,trophies:0,avatar:'⚔️',frame:'Обычная рамка'},selectedArena:'meadow',selectedDeck:[...DEFAULT_DECK],cards:{},settings:{quality:'high',sfx:true,difficulty:'normal'},stats:{wins:0,losses:0,battles:0},claimed:[]};for(const id in CARDS)fb.cards[id]={lvl:1,copies:80};try{const p=JSON.parse(localStorage.getItem(this.key)||'null');if(!p)return fb;return {...fb,...p,profile:{...fb.profile,...(p.profile||{})},settings:{...fb.settings,...(p.settings||{})},stats:{...fb.stats,...(p.stats||{})},cards:{...fb.cards,...(p.cards||{})},selectedDeck:(p.selectedDeck||fb.selectedDeck).slice(0,8)};}catch{return fb}}save(){localStorage.setItem(this.key,JSON.stringify(this.data))}}

class Audio{constructor(save){this.s=save;this.ctx=null;this.musicNode=null}ensure(){if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)()}tone(type='ui'){if(!this.s.data.settings.sfx)return;this.ensure();const c=this.ctx,o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.type=type==='hit'?'triangle':type==='spell'?'sawtooth':'sine';o.frequency.value=type==='hit'?120:type==='spell'?430:280;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.08,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.17);o.connect(g).connect(c.destination);o.start();o.stop(t+.2)}startMusic(){if(!this.s.data.settings.sfx)return;this.ensure();if(this.musicNode)return;const c=this.ctx,o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=76;const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=.18;lg.gain.value=16;lfo.connect(lg).connect(o.frequency);g.gain.value=.02;o.connect(g).connect(c.destination);o.start();lfo.start();this.musicNode={o,lfo,g}}stopMusic(){if(!this.musicNode)return;this.musicNode.o.stop();this.musicNode.lfo.stop();this.musicNode=null}}

class UI{constructor(app){this.app=app;this.root=document.getElementById('ui');this.build()}build(){this.shell=document.createElement('div');this.shell.className='screen shell active';this.shell.innerHTML=`<div class='top'><div class='title'>Линия Штурма</div><div class='account' id='acc'><div class='avatar' id='ava'></div><div><div id='nick'></div><small id='lvl'></small></div></div></div><div class='content' id='content'></div><div class='tabs'>
<button class='tab active' data-tab='home'>Домой</button><button class='tab' data-tab='cards'>Карты</button><button class='tab' data-tab='deck'>Колода</button><button class='tab' data-tab='up'>Улучшения</button><button class='tab' data-tab='set'>Настройки</button></div>`;
this.root.appendChild(this.shell);this.tabs=[...this.shell.querySelectorAll('.tab')];this.tabs.forEach(b=>b.onclick=()=>this.openTab(b.dataset.tab));this.shell.querySelector('#acc').onclick=()=>this.app.setState(APP_STATES.PROFILE);
this.battle=document.createElement('div');this.battle.className='battle-ui';this.battle.innerHTML=`<div class='hud'><div class='hudbox' id='left'>Игрок 0👑</div><div class='hudbox' id='timer'>03:00</div><div class='hudbox' id='right'>ИИ 0👑</div></div><div class='energy-wrap'><div class='energy-label' id='energyLabel'>Энергия: 0 / 10</div><div class='energy-bar'><div class='energy-fill' id='energyFill'></div><div class='energy-pulse'></div></div></div><div class='zone' id='zone'></div><div class='hand' id='hand'></div>`;
this.root.appendChild(this.battle);
this.modal=document.createElement('div');this.modal.className='overlay';this.root.appendChild(this.modal);
this.result=document.createElement('div');this.result.className='overlay';this.root.appendChild(this.result);
this.openTab('home')}
updateTop(){const p=this.app.save.data.profile;this.shell.querySelector('#ava').textContent=p.avatar;this.shell.querySelector('#nick').textContent=p.nick;this.shell.querySelector('#lvl').textContent=`Ур. ${p.level} · Кубки ${p.cups}`}
openTab(tab){this.tabs.forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));if(tab==='home')this.app.setState(APP_STATES.MAIN_MENU);if(tab==='cards')this.app.setState(APP_STATES.COLLECTION);if(tab==='deck')this.app.setState(APP_STATES.DECK_BUILDER);if(tab==='up')this.app.setState(APP_STATES.CARD_UPGRADE);if(tab==='set')this.app.setState(APP_STATES.SETTINGS)}
render(){this.updateTop();const st=this.app.state;const c=this.shell.querySelector('#content');if(st===APP_STATES.MAIN_MENU)c.innerHTML=this.home();if(st===APP_STATES.PROFILE)c.innerHTML=this.profile();if(st===APP_STATES.ARENA_SELECTION)c.innerHTML=this.arenas();if(st===APP_STATES.COLLECTION)c.innerHTML=this.collection();if(st===APP_STATES.DECK_BUILDER)c.innerHTML=this.deck();if(st===APP_STATES.CARD_UPGRADE)c.innerHTML=this.upgrades();if(st===APP_STATES.SETTINGS)c.innerHTML=this.settings();this.bindDynamic();}
bindDynamic(){const p=this.app.save.data.profile;const c=this.shell.querySelector('#content');c.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>this.app.setState(APP_STATES[b.dataset.go]));c.querySelectorAll('[data-arena]').forEach(el=>el.onclick=()=>{const ar=ARENAS.find(a=>a.id===el.dataset.arena);if(p.cups<ar.cups)return;this.app.save.data.selectedArena=ar.id;this.app.save.save();this.render()});c.querySelectorAll('[data-claim]').forEach(b=>b.onclick=()=>{const i=+b.dataset.claim,r=REWARDS[i];if(p.cups<r.cups||this.app.save.data.claimed.includes(i))return;this.app.save.data.claimed.push(i);if(r.type==='gold')p.gold+=r.value;if(r.type==='cards')this.app.save.data.cards[r.card].copies+=r.value;if(r.type==='frame')p.frame=r.value;this.app.save.save();this.render()});
const s=c.querySelector('#cardSearch'),f=c.querySelector('#cardFilter');if(s)s.oninput=()=>this.render();if(f)f.onchange=()=>this.render();c.querySelectorAll('[data-detail]').forEach(el=>el.onclick=()=>this.cardModal(el.dataset.detail));
c.querySelectorAll('[data-slot]').forEach(el=>el.onclick=()=>this.deckPick(+el.dataset.slot));c.querySelector('#saveDeck')?.addEventListener('click',()=>{this.app.save.save();alert('Колода сохранена')});
c.querySelectorAll('[data-up]').forEach(el=>el.onclick=()=>this.upgrade(el.dataset.up));
c.querySelector('#quality')?.addEventListener('change',e=>{this.app.save.data.settings.quality=e.target.value;this.app.save.save()});
c.querySelector('#difficulty')?.addEventListener('change',e=>{this.app.save.data.settings.difficulty=e.target.value;this.app.save.save()});
c.querySelector('#sfx')?.addEventListener('change',e=>{this.app.save.data.settings.sfx=e.target.checked;this.app.save.save()});}
rewardRoad(){const cups=this.app.save.data.profile.cups;return `<div class='track'>${REWARDS.map((r,i)=>`<div class='milestone'><b>${r.cups}🏆</b><br><small>${r.type==='gold'?`Золото: ${r.value}`:r.type==='cards'?`Карты: ${CARDS[r.card].name} +${r.value}`:`Рамка: ${r.value}`}</small><br><button class='btn secondary' data-claim='${i}' ${cups<r.cups||this.app.save.data.claimed.includes(i)?'disabled':''}>${this.app.save.data.claimed.includes(i)?'Получено':'Забрать'}</button></div>`).join('')}</div>`}
home(){const p=this.app.save.data.profile,ar=ARENAS.find(a=>a.id===this.app.save.data.selectedArena);return `<div class='card'><h2 style='margin:0'>Главный зал</h2><p style='color:var(--muted)'>Арена: <b>${ar.name}</b> · ${p.gold} золота · ${p.cups} кубков</p><button class='btn big' data-go='BATTLE'>В БОЙ</button><div style='height:8px'></div><button class='btn secondary' data-go='ARENA_SELECTION'>Арены</button></div><div style='height:10px'></div><div class='card'><h3 style='margin:0 0 8px'>Дорога наград</h3>${this.rewardRoad()}</div>`}
profile(){const p=this.app.save.data.profile,s=this.app.save.data.stats;return `<div class='card'><h2>Профиль</h2><p>Ник: <b>${p.nick}</b></p><p>Уровень: <b>${p.level}</b> (${p.xp}/100 XP)</p><p>Кубки: <b>${p.cups}</b> · Золото: <b>${p.gold}</b></p><p>Рамка аватара: <b>${p.frame}</b></p><p>Бои: ${s.battles} · Победы: ${s.wins} · Поражения: ${s.losses}</p><button class='btn secondary' data-go='MAIN_MENU'>Назад</button></div>`}
arenas(){const cups=this.app.save.data.profile.cups,sel=this.app.save.data.selectedArena;return `<div class='card'><h2 style='margin-top:0'>Выбор арены</h2><div class='arena-grid'>${ARENAS.map(a=>`<div class='arena ${cups<a.cups?'locked':''}' data-arena='${a.id}' style='background:linear-gradient(160deg,${a.palette[0]},${a.palette[1]})'><b>${a.name}</b><br><small>${a.cups} кубков</small><br><small>${sel===a.id?'Выбрана':''}</small></div>`).join('')}</div><div style='height:8px'></div><button class='btn secondary' data-go='MAIN_MENU'>Назад</button></div>`}
collection(){const q=(this.shell.querySelector('#cardSearch')?.value||'').toLowerCase(),f=this.shell.querySelector('#cardFilter')?.value||'all';const arr=Object.keys(CARDS).filter(id=>{const c=CARDS[id],ok=!q||c.name.toLowerCase().includes(q)||id.includes(q);return ok&&(f==='all'||c.type===f)});return `<div class='card'><div class='row'><input id='cardSearch' placeholder='Поиск...' style='flex:1'><select id='cardFilter'><option value='all'>Все</option><option value='unit'>Юниты</option><option value='spell'>Заклинания</option></select></div><div style='height:8px'></div><div class='cards-grid'>${arr.map(id=>{const cp=this.app.save.data.cards[id];return `<div class='card-tile' data-detail='${id}'><b>${CARDS[id].name}</b><br><small>Ур. ${cp.lvl} · Копий ${cp.copies}</small><br><small>Энергия ${CARDS[id].cost}</small></div>`}).join('')}</div></div>`}
cardModal(id){const c=CARDS[id],cp=this.app.save.data.cards[id],stats=this.scaled(c,cp.lvl);this.modal.classList.add('show');this.modal.innerHTML=`<div class='modal'><h3>${c.name}</h3><p>${c.type==='spell'?'Заклинание':'Юнит'} · Ур. ${cp.lvl}</p><p>${c.type==='unit'?`HP ${stats.hp.toFixed(0)} · Урон ${stats.dmg.toFixed(0)} · Скорость ${stats.speed.toFixed(0)}`:`Радиус ${c.spell.radius}`}</p><button class='btn secondary' id='close'>Закрыть</button></div>`;this.modal.querySelector('#close').onclick=()=>this.modal.classList.remove('show')}
scaled(card,lvl){if(card.type!=='unit')return card.spell;const m=1+0.11*(lvl-1),b=card.base;return {...b,hp:b.hp*m,dmg:b.dmg*m,speed:b.speed*(1+0.03*(lvl-1))}}
deck(){const d=this.app.save.data.selectedDeck;const avg=(d.reduce((s,id)=>s+CARDS[id].cost,0)/d.length).toFixed(2);return `<div class='card'><h3>Конструктор колоды</h3><p>8 слотов · без дубликатов · Средняя энергия: <b>${avg}</b></p><div class='deck-slots'>${new Array(8).fill(0).map((_,i)=>`<div class='slot' data-slot='${i}'>${d[i]?CARDS[d[i]].name:'Пусто'}</div>`).join('')}</div><div style='height:8px'></div><button class='btn' id='saveDeck'>Сохранить колоду</button></div>`}

class Unit{constructor(scene,side,id,x,y,lane){this.s=scene;this.side=side;this.id=id;this.c=scene.cardScaled(id);this.x=x;this.y=y;this.lane=lane;this.hp=this.c.hp;this.maxHp=this.c.hp;this.r=this.c.r;this.cd=Math.random()*.4;this.dead=false;this.flash=0;this.freeze=0;this.a=0}

draw(g,q){if(this.dead)return;const player=this.side===TEAM.PLAYER,col=player?'#67c7ff':'#ff8f8f';
if(q!=='low'){g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(this.x,this.y+this.r+6,this.r*1.2,this.r*.4,0,0,Math.PI*2);g.fill()}

if(this.flash>0){g.fillStyle=`rgba(255,255,255,${this.flash*4})`;g.beginPath();g.arc(0,0,this.r*1.6,0,Math.PI*2);g.fill();}

g.fillStyle='rgba(0,0,0,.45)';g.fillRect(this.x-this.r,this.y-this.r-12,this.r*2,5);g.fillStyle='#82f7ac';g.fillRect(this.x-this.r,this.y-this.r-12,this.r*2*(this.hp/this.maxHp),5)}

class Tower{constructor(scene,side,x,y,kind,lane=-1){this.s=scene;this.side=side;this.kind=kind;this.lane=lane;this.x=x;this.y=y;this.r=30;this.maxHp=kind==='core'?3500:2200;this.hp=this.maxHp;this.dead=false;this.cd=0;this.type='tower'}damage(v){if(this.dead)return;this.hp-=v;this.s.shake=10;this.s.fx.push({t:'spark',x:this.x,y:this.y-20,n:12,col:'#ffd4bd',life:.4});if(this.hp<=0){this.hp=0;this.dead=true;this.s.fx.push({t:'explode',x:this.x,y:this.y,n:50,col:'#ffb792',life:1.2});this.s.shake=22;}}

}

class Battle{constructor(app){this.app=app;this.g=app.ctx;this.units=[];this.projectiles=[];this.fx=[];this.shake=0;this.time=180;this.overtime=false;this.energy={player:5,enemy:5};this.energyVis=5;this.crowns={player:0,enemy:0};this.hand=[...app.save.data.selectedDeck.slice(0,4)];this.deck=[...app.save.data.selectedDeck];this.next=4;this.selected=null;this.arena=ARENAS.find(a=>a.id===app.save.data.selectedArena)||ARENAS[0];this.towers=[new Tower(this,TEAM.PLAYER,LANES[0],1360,'side',0),new Tower(this,TEAM.PLAYER,LANES[1],1360,'side',1),new Tower(this,TEAM.PLAYER,450,1500,'core'),new Tower(this,TEAM.ENEMY,LANES[0],240,'side',0),new Tower(this,TEAM.ENEMY,LANES[1],240,'side',1),new Tower(this,TEAM.ENEMY,450,100,'core')];this.aiT=.8;this.bindInput();app.audio.startMusic()}
cardScaled(id){const c=CARDS[id],lvl=this.app.save.data.cards[id].lvl,m=1+.11*(lvl-1);if(c.type!=='unit')return c.spell;const b=c.base;return {...b,hp:b.hp*m,dmg:b.dmg*m,speed:b.speed*(1+.03*(lvl-1))}}
bindInput(){this.click=(e)=>{const r=this.app.canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*900,y=(e.clientY-r.top)/r.height*1600;if(this.selected&&y>810){this.playCard(TEAM.PLAYER,this.selected,x,y);this.selected=null;this.ui.refresh()}};this.app.canvas.addEventListener('pointerdown',this.click)}
destroy(){this.app.canvas.removeEventListener('pointerdown',this.click);this.app.audio.stopMusic()}
playCard(side,id,x,y){const card=CARDS[id];if(this.energy[side]<card.cost)return false;this.energy[side]-=card.cost;this.app.audio.tone(card.type==='spell'?'spell':'ui');if(card.type==='unit'){const lane=Math.abs(x-LANES[0])<Math.abs(x-LANES[1])?0:1;if(id==='swarm_pack'){for(let i=0;i<5;i++){const a=i*Math.PI*2/5;this.units.push(new Unit(this,side,id,x+Math.cos(a)*18,y+Math.sin(a)*18,lane))}} else this.units.push(new Unit(this,side,id,x,y,lane));} else {this.castSpell(side,id,x,y)}if(side===TEAM.PLAYER){const idx=this.hand.indexOf(id);if(idx>=0){this.hand[idx]=this.deck[this.next%this.deck.length];this.next++}}return true}
castSpell(side,id,x,y){if(id==='fire_burst'){this.fx.push({t:'fire',x,y,n:34,col:'#ffae66',life:.7});for(const u of this.units.filter(u=>u.side!==side&&!u.dead)){const d=Math.hypot(u.x-x,u.y-y);if(d<100)u.damage(250*(1-d/130))}for(const t of this.towers.filter(t=>t.side!==side&&!t.dead)){if(Math.hypot(t.x-x,t.y-y)<120)t.damage(125)}}
if(id==='freeze_pulse'){this.fx.push({t:'freeze',x,y,n:26,col:'#98e6ff',life:1});for(const u of this.units.filter(u=>u.side!==side&&!u.dead)){if(Math.hypot(u.x-x,u.y-y)<118)u.freeze=Math.max(u.freeze,2.2)}}
if(id==='lightning_pike'){const tar=[...this.units.filter(u=>u.side!==side&&!u.dead),...this.towers.filter(t=>t.side!==side&&!t.dead)].sort((a,b)=>Math.hypot(a.x-x,a.y-y)-Math.hypot(b.x-x,b.y-y)).slice(0,3);for(const t of tar){const dmg=t.type==='tower'?140:210;t.damage(dmg);this.fx.push({t:'light',x1:x,y1:y,x2:t.x,y2:t.y,life:.2})}}
if(id==='dash_totem'){this.fx.push({t:'buff',x,y,n:18,col:'#93ffe3',life:1.4})}}
ai(dt){this.aiT-=dt;const diff=this.app.save.data.settings.difficulty;const pace=diff==='easy'?1.15:diff==='hard'?.55:.85;if(this.aiT>0)return;this.aiT=pace+Math.random()*.45;const weakLane=this.towers.filter(t=>t.side===TEAM.ENEMY&&t.kind==='side').sort((a,b)=>a.hp-b.hp)[0]?.lane??0;const push=this.units.filter(u=>u.side===TEAM.PLAYER&&!u.dead).length;let options=this.deck.filter(id=>CARDS[id].cost<=this.energy.enemy);if(!options.length)return;if(push>=5&&options.includes('fire_burst')){this.playCard(TEAM.ENEMY,'fire_burst',450,1250);return}if(push>=4&&options.includes('freeze_pulse')){this.playCard(TEAM.ENEMY,'freeze_pulse',450,1200);return}const pref=options.find(i=>CARDS[i].type==='unit'&&i.includes('shield'))||options[0];const x=LANES[weakLane]+(Math.random()*70-35),y=230+Math.random()*45;this.playCard(TEAM.ENEMY,pref,x,y)}
update(dt){this.time-=dt;if(this.time<=0&&!this.overtime){this.overtime=true;this.time=60}if(this.time<=0){this.finish();return}const regen=(this.overtime?1/1.45:1/2.8);this.energy.player=clamp(this.energy.player+regen*dt,0,10);this.energy.enemy=clamp(this.energy.enemy+regen*dt,0,10);
for(const u of this.units)u.update(dt);this.units=this.units.filter(u=>!u.dead);
for(const t of this.towers)t.update(dt);
for(const p of this.projectiles){if(!p.target||p.target.dead){p.dead=true;continue}const dx=p.target.x-p.x,dy=p.target.y-p.y,d=Math.hypot(dx,dy)||1,st=p.speed*dt;p.x+=dx/d*st;p.y+=dy/d*st;if(d<12){if(p.splash){for(const u of this.units.filter(u=>u.side!==p.from.side&&!u.dead)){const dd=Math.hypot(u.x-p.x,u.y-p.y);if(dd<p.splash)u.damage(p.dmg*(1-dd/(p.splash*1.3)))} } else p.target.damage(p.dmg);this.fx.push({t:'spark',x:p.x,y:p.y,n:10,col:'#fff2ca',life:.4});p.dead=true;this.app.audio.tone('hit')}}this.projectiles=this.projectiles.filter(p=>!p.dead);
this.fx.forEach(f=>f.life-=dt);this.fx=this.fx.filter(f=>f.life>0);this.ai(dt);
const epCore=this.towers.find(t=>t.side===TEAM.ENEMY&&t.kind==='core'),plCore=this.towers.find(t=>t.side===TEAM.PLAYER&&t.kind==='core');if(epCore.dead||plCore.dead)this.finish();}
finish(){const p=this.towers.filter(t=>t.side===TEAM.PLAYER&&t.dead).length,e=this.towers.filter(t=>t.side===TEAM.ENEMY&&t.dead).length;this.crowns={player:e,enemy:p};const win=e>p||(e===p&&this.towers.find(t=>t.side===TEAM.ENEMY&&t.kind==='core').hp<this.towers.find(t=>t.side===TEAM.PLAYER&&t.kind==='core').hp);const prof=this.app.save.data.profile,st=this.app.save.data.stats;st.battles++;if(win){st.wins++;const gain=30;prof.cups+=gain;this.app.ui.showResults(true,gain)}else{st.losses++;const loss=20;prof.cups=Math.max(0,prof.cups-loss);this.app.ui.showResults(false,loss)}this.app.save.save();this.app.enterMenu()}
render(){const g=this.g,a=this.arena;g.save();if(this.shake>0){this.shake*=.86;g.translate((Math.random()-.5)*this.shake,(Math.random()-.5)*this.shake)}const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,a.palette[0]);bg.addColorStop(1,a.palette[1]);g.fillStyle=bg;g.fillRect(0,0,W,H);g.fillStyle='rgba(255,255,255,.05)';for(let i=0;i<26;i++)g.fillRect(0,i*60,W,1);g.fillStyle='rgba(43,88,132,.75)';g.fillRect(0,a.river,W,72);g.fillStyle='rgba(255,255,255,.08)';g.fillRect(0,a.river+34,W,3);
for(const t of this.towers)t.draw(g);for(const u of this.units)u.draw(g,this.app.save.data.settings.quality);
for(const p of this.projectiles){g.fillStyle='#ffe9c0';g.beginPath();g.arc(p.x,p.y,4,0,Math.PI*2);g.fill()}
for(const f of this.fx){if(f.t==='light'){g.strokeStyle='rgba(178,222,255,.85)';g.lineWidth=3;g.beginPath();g.moveTo(f.x1,f.y1);const mx=(f.x1+f.x2)/2+(Math.random()*36-18);const my=(f.y1+f.y2)/2+(Math.random()*36-18);g.lineTo(mx,my);g.lineTo(f.x2,f.y2);g.stroke();continue}const cnt=this.app.save.data.settings.quality==='low'?Math.floor((f.n||1)*.5):this.app.save.data.settings.quality==='medium'?Math.floor((f.n||1)*.8):(f.n||1);for(let i=0;i<cnt;i++){const ang=i/cnt*Math.PI*2+performance.now()*0.001,rad=(1-f.life)*26*(i%3+1);g.fillStyle=f.col||'#fff';g.globalAlpha=Math.max(0,Math.min(1,f.life));g.beginPath();g.arc((f.x||0)+Math.cos(ang)*rad,(f.y||0)+Math.sin(ang)*rad,2.2,0,Math.PI*2);g.fill()}g.globalAlpha=1}g.restore();this.app.ui.updateBattleHud(this)}
}

class App{constructor(){this.canvas=document.getElementById('battleCanvas');this.ctx=this.canvas.getContext('2d');this.save=new Save();this.audio=new Audio(this.save);this.ui=new UI(this);this.state=APP_STATES.BOOT;this.scene=null;this.last=performance.now();this.loop=this.loop.bind(this);this.enterMenu();requestAnimationFrame(this.loop)}setState(s){this.state=s;if(s===APP_STATES.BATTLE)this.startBattle();else this.ui.render()}enterMenu(){if(this.scene){this.scene.destroy();this.scene=null;this.ui.hideBattle()}if(this.state!==APP_STATES.RESULTS)this.state=APP_STATES.MAIN_MENU;this.ui.render()}startBattle(){this.scene=new Battle(this);this.ui.showBattle(this.scene)}loop(t){const dt=Math.min(.033,(t-this.last)/1000);this.last=t;if(this.scene){this.scene.update(dt);this.scene.render()}else{const g=this.ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#1e3350');g.addColorStop(1,'#0d192a');this.ctx.fillStyle=g;this.ctx.fillRect(0,0,W,H)}requestAnimationFrame(this.loop)}}
new App();
})();
</script>
