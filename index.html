<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Арена Линий</title>
  <style>
    :root {
      --bg0: #070b14;
      --bg1: #101a2b;
      --bg2: #162640;
      --panel: rgba(15, 27, 43, 0.92);
      --panel-soft: rgba(27, 44, 68, 0.88);
      --line: rgba(145, 189, 255, 0.28);
      --text: #e8f2ff;
      --muted: #9db4cf;
      --accent: #56cbff;
      --good: #7df3a4;
      --warn: #ffd27f;
      --bad: #ff8f8f;
      --tabH: 72px;
      --radius: 14px;
      --common: #9db7cd;
      --rare: #65b8ff;
      --epic: #ca8bff;
      --legendary: #ffc45c;
    }

    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: radial-gradient(circle at 50% -10%, #243b5b 0%, #0a111e 45%, #070b14 100%);
      color: var(--text);
      overflow: hidden;
      user-select: none;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 12px;
    }

    #frame {
      width: min(95vw, 56vh);
      height: min(95vh, 170vw);
      aspect-ratio: 9 / 16;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 24px 80px rgba(0,0,0,0.55), inset 0 0 0 1px rgba(255,255,255,0.06);
      background: linear-gradient(165deg, #1b2f4c, #0d1828 60%);
      isolation: isolate;
    }

    #battleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
      background: #1b2c45;
    }

    #uiRoot {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .screen {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      transform: translateX(20px) scale(0.98);
      transition: opacity .22s ease, transform .22s ease;
    }

    .screen.active {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .menu-shell {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, rgba(8,14,24,0.55), rgba(4,8,16,0.95));
    }

    .topbar {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(40,65,96,0.35), rgba(12,20,34,0.4));
      backdrop-filter: blur(3px);
    }

    .brand {
      font-weight: 900;
      letter-spacing: 0.4px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.45);
    }

    .pill {
      border-radius: 999px;
      border: 1px solid rgba(134, 187, 255, 0.42);
      padding: 5px 10px;
      color: #d4ebff;
      background: rgba(27, 45, 69, 0.75);
      font-size: 12px;
      font-weight: 700;
    }

    .screen-content {
      flex: 1;
      position: relative;
      overflow: hidden;
      padding: 14px;
      padding-bottom: calc(var(--tabH) + 14px);
    }

    .card-panel {
      border-radius: var(--radius);
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(30,49,74,0.84), rgba(12,20,35,0.9));
      box-shadow: inset 0 0 30px rgba(138,197,255,0.07);
    }

    .home-hero {
      margin-top: 18px;
      padding: 20px;
      text-align: center;
    }

    .home-hero h1 { margin: 0 0 8px; font-size: 30px; }
    .home-hero p { margin: 0; color: var(--muted); line-height: 1.35; }

    .big-play {
      margin-top: 20px;
      width: 100%;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(180deg, #8de8ff, #49beff 55%, #38a2f0);
      color: #0a2034;
      font-weight: 900;
      font-size: 22px;
      padding: 18px 10px;
      cursor: pointer;
      box-shadow: 0 14px 30px rgba(56, 166, 245, 0.4);
    }

    .section-title {
      margin: 12px 0 8px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .8px;
      color: #cce4ff;
      opacity: .85;
    }

    .deck-strip {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      padding: 8px;
      min-height: 76px;
    }

    .deck-slot {
      border-radius: 10px;
      border: 1px dashed rgba(153, 198, 255, 0.38);
      min-height: 58px;
      display: grid;
      place-items: center;
      color: rgba(208,231,255,0.5);
      font-size: 11px;
      text-align: center;
      padding: 4px;
      background: rgba(18,28,46,0.68);
    }

    .deck-slot.filled {
      border-style: solid;
      color: #f5fbff;
      background: rgba(30, 52, 82, 0.95);
    }

    .home-stats {
      margin-top: 10px;
      padding: 10px;
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(3, 1fr);
    }

    .home-stat {
      text-align: center;
      border-radius: 10px;
      border: 1px solid rgba(146,188,245,0.32);
      padding: 8px 4px;
      background: rgba(15, 29, 48, 0.78);
    }

    .home-stat .v {
      font-size: 19px;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 4px;
    }

    .home-stat .k {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .bottom-tabs {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 8px;
      height: var(--tabH);
      border-radius: 16px;
      border: 1px solid rgba(133,182,255,0.35);
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      padding: 6px;
      background: linear-gradient(180deg, rgba(21,35,56,0.95), rgba(10,17,30,0.96));
      backdrop-filter: blur(4px);
      pointer-events: auto;
    }

    .tab-btn {
      border: 0;
      border-radius: 10px;
      background: rgba(42,66,98,0.5);
      color: #bfdaff;
      font-weight: 700;
      cursor: pointer;
      font-size: 12px;
      transition: all .2s ease;
    }

    .tab-btn.active {
      background: linear-gradient(180deg, #83d9ff, #5fbfff 70%, #4eaaf0);
      color: #07233a;
      box-shadow: 0 6px 18px rgba(103, 198, 255, 0.44);
    }

    .controls-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 8px;
    }

    .input, .select, .btn {
      width: 100%;
      border-radius: 10px;
      border: 1px solid rgba(152,198,255,0.34);
      background: rgba(17,31,51,0.88);
      color: var(--text);
      padding: 9px 10px;
      font-size: 13px;
      outline: none;
    }

    .btn {
      cursor: pointer;
      font-weight: 800;
      background: linear-gradient(180deg, #7ad9ff, #57c1ff 60%, #479ce6);
      color: #092138;
      border: 0;
    }

    .btn.secondary {
      background: linear-gradient(180deg, #43658d, #304e72);
      color: #e2f0ff;
      border: 1px solid rgba(144,190,255,0.35);
    }

    .btn.warn {
      background: linear-gradient(180deg, #ffbb7f, #ff9f58);
      color: #3d1900;
    }

    .cards-grid {
      height: calc(100% - 90px);
      overflow-y: auto;
      padding-right: 4px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .card-tile {
      border-radius: 12px;
      border: 1px solid rgba(153, 200, 255, 0.34);
      background: linear-gradient(180deg, rgba(34,54,84,0.95), rgba(14,24,40,0.95));
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      min-height: 180px;
      position: relative;
    }

    .tile-head {
      display: flex;
      justify-content: space-between;
      padding: 7px 8px;
      font-size: 11px;
      color: #cbddf8;
      align-items: center;
    }

    .cost-badge {
      border-radius: 999px;
      width: 24px;
      height: 24px;
      display: grid;
      place-items: center;
      font-weight: 900;
      color: #eef9ff;
      background: radial-gradient(circle at 30% 20%, #8ad8ff, #2d8ed8 70%, #1f64b5);
      border: 1px solid rgba(255,255,255,0.4);
      box-shadow: 0 0 12px rgba(88,175,255,0.55);
    }

    .tile-canvas {
      height: 88px;
      margin: 0 8px;
      border-radius: 10px;
      border: 1px solid rgba(174,210,255,0.26);
      background: radial-gradient(circle at 40% 15%, rgba(103,146,196,0.5), rgba(18,30,48,0.95));
    }

    .tile-name {
      margin: 8px 8px 2px;
      font-size: 13px;
      font-weight: 800;
    }

    .tile-desc {
      margin: 0 8px 8px;
      color: #a4bdd8;
      font-size: 11px;
      line-height: 1.35;
    }

    .rarity-tag {
      position: absolute;
      right: 8px;
      bottom: 8px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .6px;
      text-transform: uppercase;
      opacity: .95;
    }

    .deck-builder-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
      gap: 8px;
    }

    .deck-top {
      padding: 8px;
    }

    .deck-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 8px;
      font-size: 12px;
      color: #cce3ff;
    }

    .deck-actions {
      margin-top: 8px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .collection-list {
      flex: 1;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      padding-right: 2px;
    }

    .mini-card {
      min-height: 84px;
      border-radius: 11px;
      border: 1px solid rgba(149,194,255,.34);
      background: linear-gradient(180deg, rgba(36,58,90,.95), rgba(15,23,39,.96));
      display: grid;
      grid-template-columns: 56px 1fr;
      gap: 6px;
      padding: 6px;
      cursor: pointer;
    }

    .mini-art {
      width: 56px;
      height: 70px;
      border-radius: 8px;
      border: 1px solid rgba(168,212,255,.28);
      background: radial-gradient(circle at 40% 20%, rgba(101,148,201,.5), rgba(16,27,45,.95));
    }

    .mini-name { font-size: 12px; font-weight: 800; margin-bottom: 2px; }
    .mini-meta { font-size: 10px; color: #b4cbe2; }

    .settings-list {
      display: grid;
      gap: 10px;
    }

    .setting-row {
      border-radius: 12px;
      border: 1px solid rgba(143,188,255,.3);
      padding: 10px;
      background: rgba(17,30,49,.85);
    }

    .setting-row h4 { margin: 0 0 4px; }
    .setting-row p { margin: 0 0 8px; color: #a6bfd8; font-size: 12px; }

    .toggle-line {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      margin-top: 6px;
    }

    .switch {
      width: 52px;
      height: 28px;
      border-radius: 999px;
      background: #2e4668;
      border: 1px solid rgba(160,206,255,.35);
      position: relative;
      cursor: pointer;
    }

    .switch::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      top: 2px;
      left: 2px;
      border-radius: 50%;
      background: #d8ebff;
      transition: transform .15s ease;
    }

    .switch.on { background: linear-gradient(180deg, #70deff, #4caee9); }
    .switch.on::after { transform: translateX(24px); }

    .modal-mask {
      position: absolute;
      inset: 0;
      background: rgba(5,10,18,.66);
      display: none;
      place-items: center;
      z-index: 30;
      pointer-events: auto;
    }

    .modal-mask.show { display: grid; }

    .modal {
      width: min(92%, 420px);
      max-height: 90%;
      border-radius: 14px;
      border: 1px solid rgba(157, 201, 255, 0.4);
      background: linear-gradient(180deg, rgba(36,56,86,.97), rgba(11,19,33,.97));
      padding: 12px;
      overflow: auto;
    }

    .modal h3 { margin: 0 0 8px; }
    .modal p { margin: 0; color: #b7cbe2; font-size: 13px; }

    #previewCanvas {
      width: 100%;
      height: 150px;
      border-radius: 10px;
      border: 1px solid rgba(149,197,255,.35);
      margin-top: 8px;
      background: linear-gradient(180deg, #2c4c70, #1a2f4f 65%, #273042);
    }

    .battle-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: none;
    }

    .battle-overlay.active { display: block; }

    .hud-top {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 8px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 8px;
      align-items: center;
      pointer-events: none;
    }

    .hud-box {
      border-radius: 10px;
      border: 1px solid rgba(167,210,255,.35);
      background: rgba(14,26,43,.75);
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    .timer { font-size: 20px; font-weight: 900; }

    .energy-hud {
      position: absolute;
      left: 10px;
      right: 10px;
      top: 64px;
      pointer-events: none;
      background: rgba(12,22,36,.72);
      border: 1px solid rgba(140,208,255,.45);
      border-radius: 12px;
      padding: 6px 10px;
    }
    .energy-hud .txt { font-size: 18px; font-weight: 900; text-align:center; }
    .energy-bar { height: 12px; border-radius: 999px; background: rgba(0,0,0,.5); overflow:hidden; margin-top:4px; }
    .energy-fill { height:100%; width:0%; background: linear-gradient(90deg,#4dd0ff,#7bf4c3); box-shadow: 0 0 14px rgba(98,215,255,.45); transition: width .12s linear; }
    .energy-hud.full .energy-fill { background: linear-gradient(90deg,#8ef4ff,#e4ff90); box-shadow: 0 0 22px rgba(226,255,151,.95); }


    .overtime-banner {
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 201, 146, 0.5);
      background: linear-gradient(180deg, rgba(255,194,128,.9), rgba(237,120,68,.9));
      color: #3d1700;
      font-weight: 900;
      letter-spacing: .8px;
      display: none;
    }

    .overtime-banner.show { display: block; }

    .hand-wrap {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 8px;
      pointer-events: auto;
      display: grid;
      grid-template-columns: 1fr 62px;
      gap: 8px;
      align-items: end;
    }

    .hand-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      height: 132px;
    }

    .battle-card {
      border-radius: 12px;
      border: 2px solid rgba(170,207,255,0.42);
      background: linear-gradient(180deg, rgba(47,73,106,0.96), rgba(13,22,38,0.96));
      box-shadow: inset 0 0 24px rgba(119,177,255,.15);
      position: relative;
      cursor: pointer;
      overflow: hidden;
      transform: translateY(0);
      transition: transform .1s ease, filter .1s ease;
      touch-action: none;
    }

    .battle-card.selected { transform: translateY(-10px); filter: brightness(1.15); }
    .battle-card.unaffordable { filter: grayscale(.85) brightness(.7); }
    .battle-card.dragging { opacity: .35; }

    .drag-ghost {
      position: absolute;
      width: 120px;
      height: 110px;
      margin-left: -60px;
      margin-top: -55px;
      border-radius: 12px;
      border: 2px solid rgba(165,235,255,.9);
      background: linear-gradient(180deg, rgba(50,86,132,0.95), rgba(15,25,44,0.95));
      box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 20px rgba(115,212,255,.45);
      pointer-events: none;
      z-index: 30;
      display: none;
    }

    .battle-card canvas {
      position: absolute;
      left: 8px;
      right: 8px;
      top: 24px;
      height: 62px;
      border-radius: 8px;
      border: 1px solid rgba(177,215,255,.25);
      background: radial-gradient(circle at 40% 20%, rgba(110,158,214,.45), rgba(16,27,45,.95));
    }

    .battle-card .name {
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 5px;
      text-align: center;
      font-size: 10px;
      font-weight: 800;
      line-height: 1.1;
    }

    .gem {
      position: absolute;
      top: 4px;
      left: 4px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-size: 12px;
      font-weight: 900;
      background: radial-gradient(circle at 30% 20%, #9ce1ff, #3a95db 65%, #2b63b0);
      border: 1px solid rgba(255,255,255,.45);
      box-shadow: 0 0 12px rgba(73,167,255,.55);
    }

    .next-card {
      height: 84px;
      border-radius: 12px;
      border: 1px solid rgba(160,206,255,.35);
      background: rgba(14,24,40,.92);
      position: relative;
      overflow: hidden;
      font-size: 10px;
      text-align: center;
      color: #d0e6ff;
      padding-top: 4px;
    }

    #resultsScreen {
      position: absolute;
      inset: 0;
      z-index: 50;
      display: none;
      place-items: center;
      pointer-events: auto;
      background: rgba(3,7,13,.74);
    }

    #resultsScreen.show { display: grid; }

    .result-card {
      width: min(88%, 380px);
      border-radius: 16px;
      border: 1px solid rgba(162,206,255,.42);
      background: linear-gradient(180deg, rgba(33,54,84,.97), rgba(8,15,27,.97));
      padding: 14px;
      text-align: center;
    }

    .debug-panel {
      position: absolute;
      right: 8px;
      top: 74px;
      border-radius: 8px;
      border: 1px solid rgba(180,220,255,.35);
      background: rgba(8,15,26,.7);
      padding: 6px;
      font: 11px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: #cbecff;
      pointer-events: none;
      display: none;
      white-space: pre;
    }

    .debug-panel.show { display: block; }

    .fade-tip {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 148px;
      pointer-events: none;
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(164,210,255,.45);
      background: rgba(8,15,26,.72);
      color: #d6ebff;
      font-size: 11px;
      font-weight: 700;
      opacity: 0;
      transition: opacity .22s;
    }

    .fade-tip.show { opacity: 1; }

    ::-webkit-scrollbar { width: 9px; }
    ::-webkit-scrollbar-thumb { background: rgba(110,149,196,.5); border-radius: 999px; }
  </style>
</head>
<body>
<div id="app">
  <div id="frame">
    <canvas id="battleCanvas" width="900" height="1600"></canvas>
    <div id="uiRoot"></div>
  </div>
</div>
<script>
/*
  Controls:
  - Menu: use bottom tabs (Home/Cards/Deck/Settings).
  - Play: tap В БОЙ on Home.
  - Battle: tap a card in hand, then tap player half to deploy.
  - Debug: press `D` to toggle debug metrics/hitboxes.

  Structure overview:
  - AppController: bootstraps systems, main loop, state transitions.
  - ScreenManager/MenuUI/CollectionUI/DeckBuilderUI/SettingsUI: front-end shell + navigation.
  - BattleScene + UnitSystem/TowerSystem/ProjectileSystem/ParticleSystem: match logic/render.
  - CardRenderer: consistent procedural card art/icons for all screens + battle hand.
  - SaveSystem: localStorage persistence for deck, unlocked cards, settings, and profile stats.

  Save behavior:
  - localStorage key: "laneforge_overhaul_save_v1".
  - Stores selected deck (8 cards), unlocked cards, settings, and lifetime stats.
  - Save runs on deck/settings changes and after every battle result.
*/
(() => {
  'use strict';

  const W = 900;
  const H = 1600;
  const LANES = [280, 620];
  const APP_STATES = {
    BOOT: 'BOOT',
    MAIN_MENU: 'MAIN_MENU',
    КОЛЛЕКЦИЯ: 'КОЛЛЕКЦИЯ',
    DECK_BUILDER: 'DECK_BUILDER',
    SETTINGS: 'SETTINGS',
    BATTLE: 'BATTLE',
    RESULTS: 'RESULTS'
  };
  const TEAM = { PLAYER: 'player', ENEMY: 'enemy' };

  const CARD_LIBRARY = {
    blade_runner: {
      id: 'blade_runner', name: 'Клинок', type: 'unit', rarity: 'common', cost: 2,
      desc: 'Быстрый боец ближнего боя. Давит на любой линии.',
      stats: { hp: 280, dmg: 72, speed: 118, range: 24, as: 1.18, target: 'ground', radius: 14, aggro: 170, projectile: 0, air: false },
      role: ['swarm', 'pressure']
    },
    shield_brute: {
      id: 'shield_brute', name: 'Щитоносец', type: 'unit', rarity: 'rare', cost: 4,
      desc: 'Живучий фронтлайн-танк с умеренным уроном.',
      stats: { hp: 1040, dmg: 108, speed: 72, range: 25, as: 0.82, target: 'ground', radius: 20, aggro: 175, projectile: 0, air: false },
      role: ['tank']
    },
    arc_shooter: {

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;

  class SaveSystem {
    constructor() {
      this.key = 'laneforge_overhaul_save_v1';
      this.data = this.load();
    }
    load() {
      const fallback = {
        selectedDeck: [...DEFAULT_DECK],
        unlockedCards: Object.keys(CARD_LIBRARY),
        settings: { sfx: true, music: true, sfxVolume: 0.7, musicVolume: 0.45, quality: 'high', difficulty: 'normal', colorblind: false, debug: false },
        stats: { wins: 0, losses: 0, battles: 0, crownsFor: 0, crownsAgainst: 0 }
      };
      try {
        const raw = localStorage.getItem(this.key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return {
          selectedDeck: Array.isArray(parsed.selectedDeck) ? parsed.selectedDeck.filter(id => CARD_LIBRARY[id]).slice(0,8) : fallback.selectedDeck,
          unlockedCards: Array.isArray(parsed.unlockedCards) ? parsed.unlockedCards.filter(id => CARD_LIBRARY[id]) : fallback.unlockedCards,
          settings: { ...fallback.settings, ...(parsed.settings || {}) },
          stats: { ...fallback.stats, ...(parsed.stats || {}) }
        };
      } catch {
        return fallback;
      }
    }
    save() {
      localStorage.setItem(this.key, JSON.stringify(this.data));
    }
    setDeck(deck) {
      this.data.selectedDeck = deck.slice(0,8);
      this.save();
    }
    setSetting(k, v) {
      this.data.settings[k] = v;
      this.save();
    }
    setDebug(v) {
      this.data.settings.debug = !!v;
      this.save();
    }
    updateStats(match) {
      const s = this.data.stats;
      s.battles += 1;
      s.crownsFor += match.playerCrowns;
      s.crownsAgainst += match.enemyCrowns;
      if (match.result === 'victory') s.wins += 1;
      else s.losses += 1;
      this.save();
    }
    reset() {
      localStorage.removeItem(this.key);
      this.data = this.load();
      this.save();
    }
  }

  class AudioSystem {
    constructor(save) {
      this.save = save;
      this.ctx = null;
      this.musicNodes = null;
      this.musicTick = 0;
    }
    ensure() {
      if (!this.ctx) {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }
    volumeSfx(){ return clamp(this.save.data.settings.sfxVolume ?? 0.7,0,1); }
    volumeMusic(){ return clamp(this.save.data.settings.musicVolume ?? 0.45,0,1); }
    beep(type='tap') {
      if (!this.save.data.settings.sfx) return;
      this.ensure();
      const c = this.ctx;
      const now = c.currentTime;
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = type === 'impact' ? 'triangle' : type === 'spell' ? 'sawtooth' : 'sine';
      const f = type === 'impact' ? 110 : type === 'spell' ? 420 : 280;
      o.frequency.setValueAtTime(f, now);
      o.frequency.exponentialRampToValueAtTime(f * (type === 'spell' ? 1.4 : 0.85), now + 0.1);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.exponentialRampToValueAtTime(0.09*this.volumeSfx(), now + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
      o.connect(g).connect(c.destination);
      o.start(now); o.stop(now + 0.15);
    }
    pulse(freq, dur=0.22, type='sine', vol=0.04){
      this.ensure();
      const c=this.ctx, n=c.currentTime;
      const o=c.createOscillator(), g=c.createGain();
      o.type=type; o.frequency.value=freq;
      g.gain.setValueAtTime(0.0001,n);
      g.gain.exponentialRampToValueAtTime(vol*this.volumeMusic(),n+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,n+dur);
      o.connect(g).connect(c.destination); o.start(n); o.stop(n+dur+0.02);
    }
    update(dt, inBattle=false){
      if (!this.save.data.settings.music || !inBattle) return;
      this.musicTick -= dt;
      if (this.musicTick>0) return;
      this.musicTick = 0.48;
      const seq=[220,262,294,330,294,262,247,196];
      const i=(Math.floor(performance.now()/480))%seq.length;
      this.pulse(seq[i],0.35,'triangle',0.035);
      if(i%2===0) this.pulse(seq[(i+3)%seq.length]*0.5,0.4,'sine',0.02);
    }
  }

  class InputSystem {
    constructor(canvas) {
      this.canvas = canvas;
      this.pointer = { x: 0, y: 0, down: false, pressed: false, released: false, id: null };
      this.keyPressed = {};
      this.bind();
    }
    bind() {
      const upd = (e) => {
        const r = this.canvas.getBoundingClientRect();
        this.pointer.x = (e.clientX - r.left) / r.width * this.canvas.width;
        this.pointer.y = (e.clientY - r.top) / r.height * this.canvas.height;
      };
      this.canvas.addEventListener('contextmenu', e => e.preventDefault());
      this.canvas.addEventListener('pointerdown', e => {
        upd(e); this.pointer.down = true; this.pointer.pressed = true; this.pointer.id = e.pointerId;
        this.canvas.setPointerCapture?.(e.pointerId);
        e.preventDefault();
      }, { passive: false });
      window.addEventListener('pointermove', e => { if (this.pointer.id == null || e.pointerId === this.pointer.id) upd(e); }, { passive: false });
      window.addEventListener('pointerup', e => {
        upd(e); this.pointer.down = false; this.pointer.released = true; this.pointer.id = null;
        e.preventDefault();
      }, { passive: false });
      window.addEventListener('pointercancel', () => { this.pointer.down = false; this.pointer.released = true; this.pointer.id = null; });
      window.addEventListener('keydown', e => { this.keyPressed[e.key.toLowerCase()] = true; });
    }
    endFrame() {
      this.pointer.pressed = false;
      this.pointer.released = false;
      this.keyPressed = {};
    }
  }

  class ParticleSystem {
    constructor(app) {
      this.app = app;
      this.max = 500;
      this.pool = Array.from({ length: this.max }, () => ({ alive: false }));
    }
    spawn(type, x, y, cfg={}) {
      const q = this.app.save.data.settings.quality;
      const qualityMul = q === 'low' ? 0.6 : q === 'medium' ? 0.85 : 1;
      if (Math.random() > qualityMul) return;
      const p = this.pool.find(p => !p.alive);
      if (!p) return;
      p.alive = true;
      p.type = type;
      p.x = x;
      p.y = y;
      p.vx = cfg.vx ?? (Math.random() - 0.5) * 80;
      p.vy = cfg.vy ?? (Math.random() - 0.5) * 80;
      p.life = cfg.life ?? 0.45;
      p.maxLife = p.life;
      p.size = cfg.size ?? (2 + Math.random() * 4);
      p.color = cfg.color ?? '#fff';
      p.glow = cfg.glow ?? 0;
    }
    burst(type, x, y, count, color) {
      for (let i = 0; i < count; i++) {
        this.spawn(type, x, y, {
          vx: (Math.random() - 0.5) * 200,
          vy: (Math.random() - 0.5) * 200,
          life: 0.25 + Math.random() * 0.35,
          size: 1 + Math.random() * 4,
          color
        });
      }
    }
    update(dt) {
      for (const p of this.pool) {
        if (!p.alive) continue;
        p.life -= dt;
        if (p.life <= 0) { p.alive = false; continue; }
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 80 * dt;
      }
    }
    draw(ctx) {
      for (const p of this.pool) {
        if (!p.alive) continue;
        ctx.globalAlpha = p.life / p.maxLife;
        ctx.fillStyle = p.color;
        if (p.glow) {
          ctx.shadowBlur = 12;
          ctx.shadowColor = p.color;
        }
        if (p.type === 'trail') {
          ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size * 1.6, p.size * 0.8);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
      }
      ctx.globalAlpha = 1;
    }
    aliveCount() {
      let n = 0;
      for (const p of this.pool) if (p.alive) n++;
      return n;
    }
  }

  class Unit {
    constructor(scene, side, cardId, x, y, lane) {
      this.scene = scene;
      this.side = side;
      this.cardId = cardId;
      this.cfg = CARD_LIBRARY[cardId].stats;
      this.x = x;
      this.y = y;
      this.radius = this.cfg.radius;
      this.maxHp = this.cfg.hp;
      this.hp = this.maxHp;
      this.cooldown = Math.random() * 0.3;
      this.speedMul = 1;
      this.asMul = 1;
      this.buffT = 0;
      this.freezeT = 0;
      this.dead = false;
      this.air = !!this.cfg.air;
      this.target = null;
      this.lane = lane;
      this.vx = 0;
      this.vy = 0;
      this.flash = 0;
      this.statsOwner = side;
    }
    validTarget(t) {
      if (!t || t.dead || t.side === this.side) return false;
      if (t.type === 'unit' && t.air && this.cfg.target === 'ground') return false;
      return true;
    }
    getPriorityTarget() {
      const enemies = this.scene.allTargets.filter(t => this.validTarget(t));
      if (!enemies.length) return null;
      const ownSideThreat = enemies.filter(e => this.side === TEAM.PLAYER ? e.y > 820 : e.y < 780);
      const list = ownSideThreat.length ? ownSideThreat : enemies;
      let best = null, bestScore = 1e9;
      for (const e of list) {
        const d = dist2(this.x, this.y, e.x, e.y);
        const towerBias = e.type === 'tower' ? 60 * 60 : 0;
        const score = d + towerBias;
        if (score < bestScore) { bestScore = score; best = e; }
      }
      return best;
    }
    takeDamage(amount) {
      this.hp -= amount;
      this.flash = 0.12;
      this.scene.fx.burst('hit', this.x, this.y, 4, '#ffecc8');
      if (this.hp <= 0) {
        this.dead = true;
        this.scene.fx.burst('boom', this.x, this.y, 12, '#ffc8c8');
      }
    }
    applyFreeze(t) {
      this.freezeT = Math.max(this.freezeT, t);
    }
    applyBuff(speedMul, asMul, t) {
      this.speedMul = Math.max(this.speedMul, speedMul);
      this.asMul = Math.max(this.asMul, asMul);
      this.buffT = Math.max(this.buffT, t);
    }
    update(dt) {
      if (this.dead) return;
      this.cooldown -= dt;
      this.flash = Math.max(0, this.flash - dt);
      this.freezeT = Math.max(0, this.freezeT - dt);
      if (this.buffT > 0) {
        this.buffT -= dt;
        if (this.buffT <= 0) { this.speedMul = 1; this.asMul = 1; }
      }
      if (!this.target || !this.validTarget(this.target)) this.target = this.getPriorityTarget();
      if (!this.target) return;
      const d = Math.hypot(this.target.x - this.x, this.target.y - this.y);
      const atkR = this.cfg.range + (this.target.radius || 26);
      if (d <= atkR) {
        if (this.cooldown <= 0) {
          const dmg = this.cfg.dmg;
          if (this.cfg.projectile > 0) {
            this.scene.projectiles.spawn(this, this.target, dmg, this.cfg.projectile, this.cfg.splash || 0);
          } else {
            this.target.takeDamage(dmg);
            this.scene.registerDamage(this.side, dmg);
            this.scene.audio.beep('impact');
          }
          this.cooldown = (1 / this.cfg.as) / this.asMul;
        }
        return;
      }
      let dirX = (this.target.x - this.x) / (d || 1);
      let dirY = (this.target.y - this.y) / (d || 1);
      const riverPush = (!this.air && this.y > 710 && this.y < 890) ? (this.lane === 0 ? -0.25 : 0.25) : 0;
      dirX += riverPush;
      const mag = Math.hypot(dirX, dirY) || 1;
      dirX /= mag; dirY /= mag;
      const speed = this.cfg.speed * this.speedMul * (this.freezeT > 0 ? 0.25 : 1);
      this.vx = lerp(this.vx, dirX * speed, 0.2);
      this.vy = lerp(this.vy, dirY * speed, 0.2);
      this.x += this.vx * dt;
      this.y += this.vy * dt;
      if (Math.random() < 0.2) this.scene.fx.spawn('trail', this.x, this.y + this.radius, { life: 0.2, size: 2, color: 'rgba(201,175,140,.8)' });
    }
    draw(ctx, colorblind=false, debug=false) {
      if (this.dead) return;
      const teamC = this.side === TEAM.PLAYER
        ? (colorblind ? '#f2d35d' : '#74cbff')
        : (colorblind ? '#5cc36d' : '#ff9a8e');
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.fillStyle = 'rgba(0,0,0,.3)';
      ctx.beginPath(); ctx.ellipse(0, this.radius + 3, this.radius*1.1, this.radius*0.4, 0, 0, Math.PI*2); ctx.fill();
      if (this.freezeT > 0) {
        ctx.strokeStyle = '#bce7ff';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0,0,this.radius+2,0,Math.PI*2); ctx.stroke();
      }
      if (this.buffT > 0) {
        ctx.strokeStyle = '#84ffe5';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(0,0,this.radius+6,0,Math.PI*2); ctx.stroke();
      }
      ctx.fillStyle = teamC;
      ctx.beginPath(); ctx.arc(0,0,this.radius,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#12253f';
      ctx.beginPath(); ctx.arc(0,-this.radius*0.2,this.radius*0.58,0,Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ebf8ff';
      ctx.beginPath(); ctx.arc(-this.radius*0.2,-this.radius*0.3, this.radius*0.11,0,Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc(this.radius*0.2,-this.radius*0.3, this.radius*0.11,0,Math.PI*2); ctx.fill();
      if (this.flash > 0) {
        ctx.fillStyle = `rgba(255,255,255,${this.flash*2})`;
        ctx.beginPath(); ctx.arc(0,0,this.radius+2,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
      const barW = this.radius * 2.1;
      ctx.fillStyle = 'rgba(0,0,0,.45)';
      ctx.fillRect(this.x - barW/2, this.y - this.radius - 10, barW, 4);
      ctx.fillStyle = '#7df3a4';
      ctx.fillRect(this.x - barW/2, this.y - this.radius - 10, barW * (this.hp / this.maxHp), 4);
      if (debug) {
        ctx.strokeStyle = 'rgba(255,255,255,.32)';
        ctx.beginPath(); ctx.arc(this.x,this.y,this.cfg.aggro,0,Math.PI*2); ctx.stroke();
      }
    }
  }

  class Tower {
    constructor(scene, side, x, y, kind, lane=-1) {
      this.scene = scene;
      this.side = side;
      this.type = 'tower';
      this.kind = kind;
      this.lane = lane;
      this.x = x;
      this.y = y;
      this.radius = 28;
      this.maxHp = kind === 'core' ? 3400 : 2200;
      this.hp = this.maxHp;
      this.range = kind === 'core' ? 290 : 250;
      this.dmg = kind === 'core' ? 114 : 90;
      this.cooldown = 0;
      this.destroyed = false;
      this.dead = false;
    }
    takeDamage(d) {
      if (this.destroyed) return;
      this.hp -= d;
      this.scene.shake = Math.max(this.scene.shake, 4);
      this.scene.fx.burst('hit', this.x, this.y - 30, 8, '#ffcfb9');
      if (this.hp <= 0) {
        this.hp = 0;
        this.destroyed = true;
        this.dead = true;
        this.scene.fx.burst('boom', this.x, this.y - 14, 30, '#ffbaa5');
      }
    }
    update(dt) {
      if (this.destroyed) return;
      this.cooldown -= dt;
      if (this.cooldown > 0) return;
      const enemies = this.scene.units.filter(u => !u.dead && u.side !== this.side);
      let best = null, bestD = 1e9;
      for (const u of enemies) {
        const d = dist2(this.x,this.y,u.x,u.y);
        if (d < this.range * this.range && d < bestD) { best = u; bestD = d; }
      }
      if (!best) return;
      this.scene.projectiles.spawn(this, best, this.dmg, 480, 0);
      this.cooldown = this.kind === 'core' ? 1.13 : 0.95;
    }
    draw(ctx, colorblind=false) {
      const c = this.side === TEAM.PLAYER
        ? (colorblind ? '#f3d35f' : '#5da4df')
        : (colorblind ? '#63c86f' : '#e18172');
      ctx.save();
      ctx.translate(this.x,this.y);
      ctx.fillStyle='rgba(0,0,0,.32)'; ctx.beginPath(); ctx.ellipse(0,42,56,12,0,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#6b7689'; ctx.fillRect(-36,20,72,26);
      const g=ctx.createLinearGradient(0,-62,0,32);
      g.addColorStop(0,'#d8e8f9'); g.addColorStop(0.2,c); g.addColorStop(1,'#233750');
      ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(-28,-34,56,58,10); ctx.fill();
      ctx.fillStyle='#324760'; ctx.beginPath(); ctx.roundRect(-18,-48,36,16,6); ctx.fill();
      if (this.destroyed) {
        ctx.strokeStyle = 'rgba(40,20,20,.8)';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(-12,-8); ctx.lineTo(8,14); ctx.moveTo(10,-12); ctx.lineTo(-6,15); ctx.stroke();
      }
      ctx.restore();
      const hpW = 112;
      ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(this.x-hpW/2, this.y-78, hpW, 12);
      ctx.strokeStyle = this.side===TEAM.PLAYER ? 'rgba(120,210,255,.95)' : 'rgba(255,146,146,.95)';
      ctx.strokeRect(this.x-hpW/2, this.y-78, hpW, 12);
      ctx.fillStyle=this.side===TEAM.PLAYER ? '#5be0ff' : '#ff8b8b'; ctx.fillRect(this.x-hpW/2, this.y-78, hpW * (this.hp/this.maxHp), 12);
    }
  }

  class ProjectileSystem {
    constructor(scene) {
      this.scene = scene;
      this.list = [];
    }
    spawn(from, target, dmg, speed, splash=0) {
      this.list.push({ from, target, x: from.x, y: from.y - 10, dmg, speed, splash, dead: false });
    }
    update(dt) {
      for (const p of this.list) {
        if (p.dead) continue;
        if (!p.target || p.target.dead) { p.dead = true; continue; }
        const dx = p.target.x - p.x;
        const dy = p.target.y - p.y;
        const d = Math.hypot(dx, dy) || 1;
        const step = p.speed * dt;
        this.scene.fx.spawn('trail', p.x, p.y, { life: .14, size: 2, color: '#fff6c3' });
        if (d <= step + 6) {
          p.x = p.target.x; p.y = p.target.y;
          this.impact(p);
          p.dead = true;
        } else {
          p.x += dx / d * step;
          p.y += dy / d * step;
        }
      }
      this.list = this.list.filter(p => !p.dead);
    }
    impact(p) {
      if (p.splash > 0) {
        const enemies = this.scene.units.filter(u => !u.dead && u.side !== p.from.side);
        for (const e of enemies) {
          const d = Math.hypot(e.x - p.x, e.y - p.y);
          if (d <= p.splash) {
            e.takeDamage(p.dmg * (1 - d / (p.splash * 1.25)));
            this.scene.registerDamage(p.from.side, p.dmg);
          }
        }
      } else if (p.target.takeDamage) {
        p.target.takeDamage(p.dmg);
        this.scene.registerDamage(p.from.side, p.dmg);
      }
      this.scene.fx.burst('impact', p.x, p.y, 9, '#ffe9be');
      this.scene.audio.beep('impact');
      if (p.target.type === 'tower') this.scene.shake = Math.max(this.scene.shake, 5);
    }
    draw(ctx, debug=false) {
      for (const p of this.list) {
        ctx.fillStyle = '#fff5c6';
        ctx.beginPath();
        ctx.arc(p.x,p.y,4,0,Math.PI*2);
        ctx.fill();
        if (debug) {
          ctx.strokeStyle = 'rgba(255,255,255,.4)';
          ctx.beginPath();
          ctx.arc(p.x,p.y,8,0,Math.PI*2);
          ctx.stroke();
        }
      }
    }
  }

  class UnitSystem {
    constructor(scene) {
      this.scene = scene;
    }
    spawn(side, cardId, x, y, lane=0) {
      const card = CARD_LIBRARY[cardId];
      if (cardId === 'swarm_pack') {
        for (let i=0;i<card.stats.count;i++) {
          const a = (Math.PI * 2) * (i/card.stats.count);
          const r = 14 + Math.random()*8;
          this.scene.units.push(new Unit(this.scene, side, cardId, x + Math.cos(a)*r, y + Math.sin(a)*r, lane));
        }
      } else {
        this.scene.units.push(new Unit(this.scene, side, cardId, x, y, lane));
      }
    }
    update(dt) {
      for (const u of this.scene.units) u.update(dt);
      this.scene.units = this.scene.units.filter(u => !u.dead);
    }
    draw(ctx, debug) {
      for (const u of this.scene.units) u.draw(ctx, this.scene.app.save.data.settings.colorblind, debug);
    }
  }

  class TowerSystem {
    constructor(scene) {
      this.scene = scene;
      this.towers = [];
      this.setup();
    }
    setup() {
      this.towers = [
        new Tower(this.scene, TEAM.PLAYER, LANES[0], 1360, 'side', 0),
        new Tower(this.scene, TEAM.PLAYER, LANES[1], 1360, 'side', 1),
        new Tower(this.scene, TEAM.PLAYER, 450, 1500, 'core', -1),
        new Tower(this.scene, TEAM.ENEMY, LANES[0], 240, 'side', 0),
        new Tower(this.scene, TEAM.ENEMY, LANES[1], 240, 'side', 1),
        new Tower(this.scene, TEAM.ENEMY, 450, 90, 'core', -1)
      ];
    }
    update(dt) { for (const t of this.towers) t.update(dt); }
    draw(ctx) { for (const t of this.towers) t.draw(ctx, this.scene.app.save.data.settings.colorblind); }
    getBy(side, kind, lane=null) {
      return this.towers.find(t => t.side===side && t.kind===kind && (lane===null || t.lane===lane));
    }
    aliveSides(side) {
      return this.towers.filter(t => t.side===side && t.kind==='side' && !t.destroyed).length;
    }
  }

  class BotAI {
    constructor(scene) {
      this.scene = scene;
      this.timer = 0;
      this.hand = ['shield_brute','arc_shooter','swarm_pack','fire_burst'];
      this.deck = ['blade_runner','shield_brute','arc_shooter','spark_mage','sky_drone','swarm_pack','fire_burst','lightning_pike'];
      this.nextI = 4;
    }
    step(dt) {
      const diff = this.scene.app.save.data.settings.difficulty;
      const pace = diff === 'easy' ? 1.4 : diff === 'hard' ? 0.72 : 1.0;
      this.timer -= dt;
      if (this.timer > 0) return;
      this.timer = (0.65 + Math.random()*0.75) * pace;
      const elixir = this.scene.elixir.enemy;
      const card = this.chooseCard(elixir);
      if (!card) return;
      if (!this.scene.canAfford(TEAM.ENEMY, card)) return;
      const lane = this.chooseLane();
      const x = LANES[lane] + (Math.random()-0.5)*34;
      const y = 360 + Math.random()*90;
      if (CARD_LIBRARY[card].type === 'spell') {
        const target = this.chooseSpellPoint(card, lane);
        this.scene.playCard(TEAM.ENEMY, card, target.x, target.y, lane);
      } else {
        this.scene.playCard(TEAM.ENEMY, card, x, y, lane);
      }
      this.rotate(card);
    }
    chooseLane() {
      const p0 = this.scene.towerSystem.getBy(TEAM.PLAYER, 'side', 0).hp;
      const p1 = this.scene.towerSystem.getBy(TEAM.PLAYER, 'side', 1).hp;
      if (Math.random() < .2) return Math.random() < .5 ? 0 : 1;
      return p0 < p1 ? 0 : 1;
    }
    chooseCard(elixir) {
      const affordable = this.hand.filter(id => CARD_LIBRARY[id].cost <= elixir);
      if (!affordable.length) return null;
      const enemyPush = this.scene.units.filter(u => u.side===TEAM.PLAYER && u.y < 1000).length;
      if (enemyPush >= 4 && affordable.includes('fire_burst')) return 'fire_burst';
      if (enemyPush >= 5 && affordable.includes('freeze_pulse')) return 'freeze_pulse';
      return pick(affordable);
    }
    chooseSpellPoint(card, lane) {
      const enemies = this.scene.units.filter(u => u.side===TEAM.PLAYER);
      if (enemies.length) {
        const clustered = [...enemies].sort((a,b) => a.y - b.y)[0];
        return { x: clustered.x, y: clustered.y };
      }
      return { x: LANES[lane], y: 1140 };
    }
    rotate(card) {
      const idx = this.hand.indexOf(card);
      if (idx >= 0) this.hand.splice(idx,1);
      this.hand.push(this.deck[this.nextI % this.deck.length]);
      this.nextI++;
    }
  }

  class BattleScene {
    constructor(app) {
      this.app = app;
      this.ctx = app.ctx;
      this.input = app.input;
      this.audio = app.audio;
      this.fx = new ParticleSystem(app);
      this.projectiles = new ProjectileSystem(this);
      this.towerSystem = new TowerSystem(this);
      this.unitSystem = new UnitSystem(this);
      this.units = [];
      this.allTargets = [];
      this.bot = new BotAI(this);
      this.time = 180;
      this.overtime = false;
      this.ended = false;
      this.elixir = { player: 5, enemy: 5 };
      this.elixirRate = 1 / 2.8;
      this.playerDeck = [...app.save.data.selectedDeck];
      this.playerHand = this.playerDeck.slice(0,4);
      this.playerNextIndex = 4;
      this.selectedCard = null;
      this.stats = {
        cardsPlayer: 0,
        cardsEnemy: 0,
        damagePlayer: 0,
        damageEnemy: 0,
        result: 'draw',
        crowns: { player: 0, enemy: 0 }
      };
      this.shake = 0;
      this.ui = app.menuUI.createBattleOverlay(this);
    }
    destroy() { this.ui.remove(); }
    canAfford(side, cardId) {
      return this.elixir[side] >= CARD_LIBRARY[cardId].cost;
    }
    registerDamage(side, dmg) {
      if (side === TEAM.PLAYER) this.stats.damagePlayer += dmg;
      else this.stats.damageEnemy += dmg;
    }
    playCard(side, cardId, x, y, lane=0) {
      const card = CARD_LIBRARY[cardId];
      if (!card) return false;
      if (!this.canAfford(side, cardId)) return false;
      this.elixir[side] -= card.cost;
      if (card.type === 'unit') {
        this.unitSystem.spawn(side, cardId, x, y, lane);
      } else {
        this.castSpell(side, cardId, x, y, lane);
      }
      if (side === TEAM.PLAYER) {
        this.stats.cardsPlayer += 1;
        const i = this.playerHand.indexOf(cardId);
        if (i >= 0) {
          this.playerHand.splice(i,1);
          this.playerHand.push(this.playerDeck[this.playerNextIndex % this.playerDeck.length]);
          this.playerNextIndex++;
        }
      } else this.stats.cardsEnemy += 1;
      this.audio.beep(card.type === 'spell' ? 'spell' : 'tap');
      return true;
    }
    castSpell(side, cardId, x, y) {
      const card = CARD_LIBRARY[cardId];
      const sp = card.spell;
      if (cardId === 'fire_burst') {
        this.fx.burst('fire', x, y, 30, '#ffad6b');
        for (const u of this.units) {
          if (u.side === side || u.dead) continue;
          const d = Math.hypot(u.x-x, u.y-y);
          if (d <= sp.radius) u.takeDamage(sp.dmg * (1 - d / (sp.radius*1.2)));
        }
        for (const t of this.towerSystem.towers) {
          if (t.side === side || t.destroyed) continue;
          const d = Math.hypot(t.x-x, t.y-y);
          if (d <= sp.radius + 20) t.takeDamage(sp.dmg * sp.towerMul);
        }
      } else if (cardId === 'freeze_pulse') {
        this.fx.burst('ice', x, y, 30, '#bfe9ff');
        for (const u of this.units) {
          if (u.side === side || u.dead) continue;
          const d = Math.hypot(u.x-x, u.y-y);
          if (d <= sp.radius) u.applyFreeze(sp.freeze);
        }
      } else if (cardId === 'lightning_pike') {
        const targets = [...this.units.filter(u => u.side!==side && !u.dead), ...this.towerSystem.towers.filter(t => t.side!==side && !t.destroyed)]
          .sort((a,b) => dist2(a.x,a.y,x,y) - dist2(b.x,b.y,x,y))
          .slice(0, sp.chains);
        for (const t of targets) {
          const dmg = t.type === 'tower' ? sp.dmg * sp.towerMul : sp.dmg;
          t.takeDamage(dmg);
          this.fx.burst('zap', t.x, t.y, 8, '#fff3aa');
        }
      } else if (cardId === 'dash_totem') {
        this.fx.burst('buff', x, y, 20, '#8bffe9');
        for (const u of this.units) {
          if (u.side !== side || u.dead) continue;
          const d = Math.hypot(u.x-x, u.y-y);
          if (d <= sp.radius) u.applyBuff(sp.speedMul, sp.asMul, sp.duration);
        }
      }
      this.shake = Math.max(this.shake, 4);
    }
    playerTryDeploy(x,y) {
      if (!this.selectedCard) return false;
      if (y < 860) { this.app.menuUI.tip('Размещайте только на своей половине'); this.shake = Math.max(this.shake, 6); return false; }
      const lane = Math.abs(x-LANES[0]) < Math.abs(x-LANES[1]) ? 0 : 1;
      const c = CARD_LIBRARY[this.selectedCard];
      let ok = false;
      if (c.type === 'spell') ok = this.playCard(TEAM.PLAYER, this.selectedCard, x, y, lane);
      else ok = this.playCard(TEAM.PLAYER, this.selectedCard, LANES[lane], clamp(y, 930, 1480), lane);
      if (!ok) { this.app.menuUI.tip('Нельзя разместить карту'); this.shake = Math.max(this.shake, 6); return false; }
      this.selectedCard = null;
      this.ui.refreshHand();
      return true;
    }
    getCrowns(side) {
      const enemy = side === TEAM.PLAYER ? TEAM.ENEMY : TEAM.PLAYER;
      let c = 0;
      for (const t of this.towerSystem.towers) if (t.side===enemy && t.kind==='side' && t.destroyed) c++;
      const core = this.towerSystem.getBy(enemy,'core');
      if (core.destroyed) c += 1;
      return c;
    }
    update(dt) {
      if (this.ended) return;
      if (this.input.keyPressed['escape']) this.selectedCard = null;
      if (this.input.pointer.pressed) this.playerTryDeploy(this.input.pointer.x, this.input.pointer.y);
      const regen = this.overtime ? this.elixirRate * 2 : this.elixirRate;
      this.elixir.player = clamp(this.elixir.player + regen * dt, 0, 10);
      this.elixir.enemy = clamp(this.elixir.enemy + regen * dt, 0, 10);
      this.time -= dt;
      if (this.time <= 0 && !this.overtime) {
        this.overtime = true;
        this.time = 60;
        this.ui.setOvertime(true);
      } else if (this.time <= 0 && this.overtime) {
        this.finish();
      }
      this.bot.step(dt);
      this.allTargets = [...this.units, ...this.towerSystem.towers];
      this.unitSystem.update(dt);
      this.towerSystem.update(dt);
      this.projectiles.update(dt);
      this.fx.update(dt);
      const pCore = this.towerSystem.getBy(TEAM.PLAYER,'core');
      const eCore = this.towerSystem.getBy(TEAM.ENEMY,'core');
      if (pCore.destroyed || eCore.destroyed) this.finish();
      this.ui.updateHUD();
      this.shake = Math.max(0, this.shake - dt * 10);
    }
    finish() {
      this.ended = true;
      const pc = this.getCrowns(TEAM.PLAYER);
      const ec = this.getCrowns(TEAM.ENEMY);
      this.stats.crowns.player = pc;
      this.stats.crowns.enemy = ec;
      if (pc > ec) this.stats.result = 'victory';
      else if (pc < ec) this.stats.result = 'defeat';
      else {
        const pCore = this.towerSystem.getBy(TEAM.PLAYER,'core').hp;
        const eCore = this.towerSystem.getBy(TEAM.ENEMY,'core').hp;
        this.stats.result = eCore < pCore ? 'victory' : eCore > pCore ? 'defeat' : 'draw';
      }
      this.app.onBattleFinished(this.stats);
    }
    drawArena(ctx) {
      const shakeX = (Math.random()-0.5) * this.shake;
      const shakeY = (Math.random()-0.5) * this.shake;
      ctx.save();
      ctx.translate(shakeX, shakeY);
      const g = ctx.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#27496f'); g.addColorStop(0.5,'#446a8f'); g.addColorStop(0.5,'#2f4664'); g.addColorStop(1,'#2a3f5a');
      ctx.fillStyle = g;
      ctx.fillRect(0,0,W,H);
      ctx.fillStyle = 'rgba(143,196,255,.08)';
      for (let i=0;i<12;i++) {
        ctx.fillRect(0, i*140 + (i%2?26:0), W, 60);
      }
      ctx.fillStyle = '#27415f'; ctx.fillRect(0,710,W,180);
      ctx.fillStyle='rgba(173,218,255,.12)'; ctx.fillRect(0,786,W,18);
      ctx.fillStyle='rgba(130,186,255,.18)'; ctx.fillRect(LANES[0]-22,710,44,180);
      ctx.fillStyle='rgba(130,186,255,.18)'; ctx.fillRect(LANES[1]-22,710,44,180);
      ctx.strokeStyle = 'rgba(177,220,255,.2)';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,800); ctx.lineTo(W,800); ctx.stroke();
      if (this.selectedCard) {
        ctx.fillStyle = 'rgba(122, 214, 255, 0.16)';
        ctx.fillRect(0,860,W,H-860);
        const x = this.input.pointer.x;
        const y = clamp(this.input.pointer.y, 930, 1480);
        const lane = Math.abs(x-LANES[0]) < Math.abs(x-LANES[1]) ? 0 : 1;
        ctx.strokeStyle = 'rgba(142,236,255,.85)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(LANES[lane], y, 26, 0, Math.PI*2); ctx.stroke();
      }
      this.towerSystem.draw(ctx);
      this.unitSystem.draw(ctx, this.app.save.data.settings.debug);
      this.projectiles.draw(ctx, this.app.save.data.settings.debug);
      this.fx.draw(ctx);
      ctx.restore();
    }
    render() { this.drawArena(this.ctx); }
  }

    constructor(root) {
      this.root = root;
      this.screens = new Map();
      this.active = null;

    register(name, el) {
      this.screens.set(name, el);
      this.root.appendChild(el);

    show(name) {
      if (this.active === name) return;
      for (const [n,el] of this.screens) el.classList.toggle('active', n === name);

    createBattleOverlay(scene) {
      this.battleLayer.innerHTML = `

        </div>

      const toCanvas = (clientX, clientY) => {
        const r = this.app.canvas.getBoundingClientRect();
        return { x: (clientX - r.left) / r.width * this.app.canvas.width, y: (clientY - r.top) / r.height * this.app.canvas.height };
      };
      const overlay = {
        root: this.battleLayer,
        timerEl: this.battleLayer.querySelector('#timerHUD'),
        leftEl: this.battleLayer.querySelector('#leftHUD'),
        rightEl: this.battleLayer.querySelector('#rightHUD'),

        nextEl: this.battleLayer.querySelector('#nextCard'),

        energyTxt: this.battleLayer.querySelector('#energyTxt'),
        energyFill: this.battleLayer.querySelector('#energyFill'),
        ghostEl: this.battleLayer.querySelector('#dragGhost'),
        refreshHand: () => {
          overlay.handEl.innerHTML = '';
          for (const cardId of scene.playerHand) {
            const card = CARD_LIBRARY[cardId];
            const el = document.createElement('div');
            const canAfford = scene.elixir.player >= card.cost;
            el.className = 'battle-card' + (scene.selectedCard===cardId ? ' selected':'') + (canAfford ? '' : ' unaffordable');

              scene.selectedCard = scene.selectedCard === cardId ? null : cardId;
              overlay.refreshHand();
            };
            el.onpointerdown = (ev) => {
              if (!canAfford) return;
              ev.preventDefault();
              scene.drag = { cardId, sourceEl: el, pointerId: ev.pointerId };
              el.classList.add('dragging');
              overlay.ghostEl.style.display = 'block';
              overlay.ghostEl.innerHTML = `<div class="gem">${card.cost}</div><canvas width="120" height="70"></canvas><div class="name" style="position:absolute;left:6px;right:6px;bottom:6px;font-size:10px;text-align:center">${card.name}</div>`;
              const gc = overlay.ghostEl.querySelector('canvas');

              scene.app.cardRenderer.drawCardArt(gc.getContext('2d'), cardId, 0, 0, 120, 70, performance.now()*0.001);
            };
            overlay.handEl.appendChild(el);

          overlay.nextEl.innerHTML = '<div>ДАЛЕЕ</div>';
          overlay.nextEl.appendChild(n);

        },
        moveDrag: (clientX, clientY) => {
          if (!scene.drag) return;
          const p = toCanvas(clientX, clientY);
          this.app.input.pointer.x = p.x; this.app.input.pointer.y = p.y;
          const rr = this.battleLayer.getBoundingClientRect();
          overlay.ghostEl.style.left = `${clientX - rr.left}px`;
          overlay.ghostEl.style.top = `${clientY - rr.top}px`;
        },
        endDrag: (clientX, clientY) => {
          if (!scene.drag) return;
          const p = toCanvas(clientX, clientY);
          scene.selectedCard = scene.drag.cardId;
          const ok = scene.playerTryDeploy(p.x, p.y);
          scene.drag.sourceEl?.classList.remove('dragging');
          overlay.ghostEl.style.display = 'none';
          scene.drag = null;
          if (!ok) scene.selectedCard = null;
          overlay.refreshHand();
        },
        setOvertime: v => overlay.otEl.classList.toggle('show', v),
        updateHUD: () => {
          const t = Math.max(0, scene.time);
          const m = (t / 60) | 0;
          const s = ((t % 60) | 0).toString().padStart(2,'0');
          overlay.timerEl.textContent = `${m}:${s}`;
          overlay.leftEl.textContent = `Игрок ${scene.getCrowns(TEAM.PLAYER)} 👑`;
          overlay.rightEl.textContent = `ИИ ${scene.getCrowns(TEAM.ENEMY)} 👑`;
          overlay.energyTxt.textContent = `Энергия: ${scene.elixir.player.toFixed(1)}/10`;

          overlay.energyFill.style.width = `${perc}%`;
          overlay.energyHud.classList.toggle('full', scene.elixir.player >= 9.95);
          overlay.refreshHand();
        },
        remove: () => { this.battleLayer.innerHTML = ''; }
      };
      window.addEventListener('pointermove', (e) => overlay.moveDrag(e.clientX, e.clientY), { passive: true });
      window.addEventListener('pointerup', (e) => overlay.endDrag(e.clientX, e.clientY), { passive: true });
      overlay.refreshHand();
      return overlay;
    }
    showResults(stats) {

    buildModal() {

    renderLayout() {
      this.root.innerHTML = `
        <div class="controls-row">

          <select class="select" id="filterType">
            <option value="all">Все типы</option>

      this.root.querySelector('#filterType').onchange = (e) => { this.filter = e.target.value; this.renderGrid(); };
      this.root.querySelector('#sortType').onchange = (e) => { this.sort = e.target.value; this.renderGrid(); };
      this.root.querySelector('#clearFilter').onclick = () => {

    getCards() {
      let cards = Object.values(CARD_LIBRARY);
      if (this.filter !== 'all') cards = cards.filter(c => c.type === this.filter);
      if (this.search) cards = cards.filter(c => c.name.toLowerCase().includes(this.search) || c.desc.toLowerCase().includes(this.search));
      if (this.sort === 'cost') cards.sort((a,b) => a.cost - b.cost || a.name.localeCompare(b.name));
      if (this.sort === 'rarity') {
        const order = { common: 1, rare: 2, epic: 3, legendary: 4 };
        cards.sort((a,b) => order[a.rarity]-order[b.rarity] || a.cost-b.cost);
      }
      if (this.sort === 'name') cards.sort((a,b) => a.name.localeCompare(b.name));
      return cards;
    }
    renderGrid() {
      this.grid.innerHTML = '';
      const list = this.getCards();
      for (const c of list) {
        const tile = document.createElement('div');
        tile.className = 'card-tile';
        tile.style.borderColor = RARITY_COLOR[c.rarity];
        tile.innerHTML = `
          <div class="tile-head"><span>${c.type.toUpperCase()}</span><span class="cost-badge">${c.cost}</span></div>

          <div class="tile-name">${c.name}</div>
          <div class="tile-desc">${c.desc}</div>
          <div class="rarity-tag" style="color:${RARITY_COLOR[c.rarity]}">${({common:"Обычная",rare:"Редкая",epic:"Эпическая",legendary:"Легендарная"}[c.rarity])}</div>`;
        this.app.cardRenderer.drawCardArt(tile.querySelector('canvas').getContext('2d'), c.id, 0,0,180,96,performance.now()*0.001);
        tile.onclick = () => this.openDetail(c.id);
        this.grid.appendChild(tile);
      }
    }
    openDetail(cardId) {
      const c = CARD_LIBRARY[cardId];
      const body = this.modal.querySelector('.modal');
      const stats = c.type === 'unit'
        ? `ЗД ${c.stats.hp} · УРН ${c.stats.dmg} · СКР ${c.stats.speed} · ДАЛЬН ${c.stats.range} · АТК/с ${c.stats.as}`
        : Object.entries(c.spell).map(([k,v]) => `${k}:${v}`).join(' · ');
      body.innerHTML = `<h3>${c.name}</h3><p>${c.desc}</p><p style="margin-top:6px">${stats}</p>
        <canvas id="detailArt" width="360" height="170" style="width:100%;height:170px;border-radius:10px;border:1px solid rgba(160,203,255,.35);margin-top:8px;background:radial-gradient(circle at 40% 20%,rgba(106,151,205,.5),rgba(16,27,44,.95));"></canvas>
        <canvas id="previewCanvas" width="360" height="150"></canvas>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <button class="btn" id="previewBtn">Preview</button>
          <button class="btn secondary" id="closeDetailBtn">Close</button>
        </div>`;
      this.app.cardRenderer.drawCardArt(body.querySelector('#detailArt').getContext('2d'), cardId, 0,0,360,170,performance.now()*0.001);
      body.querySelector('#closeDetailBtn').onclick = () => this.modal.classList.remove('show');
      body.querySelector('#previewBtn').onclick = () => this.playPreview(c);
      this.modal.classList.add('show');
    }
    playPreview(card) {
      const c = this.modal.querySelector('#previewCanvas');
      const ctx = c.getContext('2d');
      let t = 0;
      const run = () => {
        t += 0.016;
        ctx.clearRect(0,0,c.width,c.height);
        const bg = ctx.createLinearGradient(0,0,0,c.height);
        bg.addColorStop(0,'#3d618a'); bg.addColorStop(1,'#243a57');
        ctx.fillStyle = bg; ctx.fillRect(0,0,c.width,c.height);
        ctx.fillStyle='rgba(160,210,255,.2)'; ctx.fillRect(0,70,c.width,16);
        this.app.cardRenderer.drawCardArt(ctx, card.id, 105 + Math.sin(t*2)*20, 18 + Math.cos(t*3)*2, 150, 105, t);
        if (card.type === 'spell') {
          ctx.strokeStyle = card.id==='freeze_pulse' ? '#bce7ff' : card.id==='fire_burst' ? '#ffbf81' : '#fff1ab';
          ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(180,95,30 + Math.sin(t*6)*6,0,Math.PI*2); ctx.stroke();
        } else {
          ctx.fillStyle = '#e9f7ff';
          ctx.fillText('Unit preview', 12, 20);
          ctx.fillStyle = '#78deff';
          ctx.beginPath(); ctx.arc(300,92,20 + Math.sin(t*8)*2,0,Math.PI*2); ctx.fill();
        }
      };
      for (let i=0;i<40;i++) setTimeout(run, i*16);
    }
  }

  class DeckBuilderUI {
    constructor(app, root, menu) {
      this.app = app;
      this.root = root;
      this.menu = menu;
      this.deck = [...this.app.save.data.selectedDeck];
      this.render();
    }
    recommendedDeck() {
      const all = Object.values(CARD_LIBRARY);
      const pickBy = role => all.find(c => c.role.includes(role) && !this.deck.includes(c.id));
      const suggested = [];
      const add = (c) => { if (c && suggested.length < 8 && !suggested.includes(c.id)) suggested.push(c.id); };
      add(all.find(c => c.id==='shield_brute'));
      add(pickBy('ranged')); add(pickBy('swarm')); add(pickBy('anti-air'));
      add(all.find(c => c.type==='spell' && c.id==='fire_burst'));
      add(all.find(c => c.type==='spell' && c.id==='freeze_pulse'));
      while (suggested.length < 8) add(pick(all));
      this.deck = suggested.slice(0,8);
      this.render();
    }
    removeFromDeck(cardId) {
      const i = this.deck.indexOf(cardId);
      if (i >= 0) this.deck.splice(i, 1);
      this.render();
    }
    addToDeck(cardId) {
      if (this.deck.includes(cardId)) { this.menu.tip('No duplicates allowed'); return; }
      if (this.deck.length >= 8) { this.menu.tip('В колоде уже 8 карт'); return; }
      this.deck.push(cardId);
      this.render();
    }
    saveDeck() {
      if (this.deck.length !== 8) { this.menu.tip('В колоде должно быть ровно 8 карт'); return; }
      this.app.save.setDeck(this.deck);
      this.menu.tip('Колода сохранена');
      this.app.homeUI?.render();
    }
    summary() {
      const avg = this.deck.reduce((s,id)=>s+CARD_LIBRARY[id].cost,0) / Math.max(1,this.deck.length);
      const units = this.deck.filter(id => CARD_LIBRARY[id].type==='unit').length;
      const spells = this.deck.filter(id => CARD_LIBRARY[id].type==='spell').length;
      return { avg, units, spells };
    }
    render() {
      const sum = this.summary();
      this.root.innerHTML = `
        <div class="deck-builder-layout">
          <div class="card-panel deck-top">
            <div class="section-title" style="margin-top:0">СЛОТЫ КОЛОДЫ (${this.deck.length}/8)</div>
            <div class="deck-strip" id="deckSlots"></div>
            <div class="deck-info">
              <div>Средняя стоимость: <b>${sum.avg.toFixed(2)}</b></div>
              <div>Юниты ${sum.units} / Заклинания ${sum.spells}</div>
            </div>
            <div class="deck-actions">
              <button class="btn" id="saveDeckBtn">Сохранить колоду</button>
              <button class="btn secondary" id="recommendBtn">Рекомендовать</button>
            </div>
          </div>
          <div class="section-title">КОЛЛЕКЦИЯ</div>
          <div class="collection-list" id="deckCollection"></div>
        </div>`;
      const slots = this.root.querySelector('#deckSlots');
      for (let i=0;i<8;i++) {
        const id = this.deck[i];
        const slot = document.createElement('div');
        slot.className = 'deck-slot' + (id ? ' filled' : '');
        if (id) {
          slot.innerHTML = `${CARD_LIBRARY[id].name}<br><small>Стоимость ${CARD_LIBRARY[id].cost}</small>`;
          slot.onclick = () => this.removeFromDeck(id);
        } else slot.textContent = 'Пусто';
        slots.appendChild(slot);
      }
      this.root.querySelector('#saveDeckBtn').onclick = () => this.saveDeck();
      this.root.querySelector('#recommendBtn').onclick = () => this.recommendedDeck();
      const list = this.root.querySelector('#deckCollection');
      for (const c of Object.values(CARD_LIBRARY)) {
        const item = document.createElement('div');
        item.className = 'mini-card';
        item.style.borderColor = RARITY_COLOR[c.rarity];
        item.innerHTML = `<canvas class="mini-art" width="56" height="70"></canvas><div><div class="mini-name">${c.name}</div><div class="mini-meta">${c.type==='unit'?'Юнит':'Заклинание'} · Стоимость ${c.cost}</div><div class="mini-meta">${({common:"Обычная",rare:"Редкая",epic:"Эпическая",legendary:"Легендарная"}[c.rarity])}</div></div>`;
        this.app.cardRenderer.drawCardArt(item.querySelector('canvas').getContext('2d'), c.id, 0,0,56,70,performance.now()*0.001);
        item.onclick = () => this.addToDeck(c.id);
        list.appendChild(item);
      }
    }
  }

  class SettingsUI {
    constructor(app, root, menu) {
      this.app = app;
      this.root = root;
      this.menu = menu;
      this.render();
    }
    makeSwitch(on, fn) {
      const s = document.createElement('div');
      s.className = 'switch' + (on ? ' on' : '');
      s.onclick = () => {
        on = !on;
        s.classList.toggle('on', on);
        fn(on);
      };
      return s;
    }
    render() {
      const cfg = this.app.save.data.settings;
      this.root.innerHTML = `<div class="settings-list" id="settingsList"></div>`;
      const list = this.root.querySelector('#settingsList');

      const row1 = document.createElement('div');
      row1.className = 'setting-row';
      row1.innerHTML = `<h4>Звук</h4><p>Управление музыкой и звуковыми эффектами.</p><div class="toggle-line"><span>Звуки</span></div><div class="toggle-line"><span>Музыка</span></div><label>Громкость звуков <input type="range" min="0" max="1" step="0.05" id="sfxVol"></label><label>Громкость музыки <input type="range" min="0" max="1" step="0.05" id="musicVol"></label>`;
      const toggles = row1.querySelectorAll('.toggle-line');
      toggles[0].appendChild(this.makeSwitch(cfg.sfx, v => this.app.save.setSetting('sfx', v)));
      toggles[1].appendChild(this.makeSwitch(cfg.music ?? true, v => this.app.save.setSetting('music', v)));
      const sfxVol = row1.querySelector('#sfxVol'); sfxVol.value = cfg.sfxVolume ?? 0.7; sfxVol.oninput = () => this.app.save.setSetting('sfxVolume', Number(sfxVol.value));
      const musicVol = row1.querySelector('#musicVol'); musicVol.value = cfg.musicVolume ?? 0.45; musicVol.oninput = () => this.app.save.setSetting('musicVolume', Number(musicVol.value));
      list.appendChild(row1);

      const row2 = document.createElement('div');
      row2.className = 'setting-row';
      row2.innerHTML = `<h4>Качество</h4><p>Настройка плотности частиц и теней.</p><select class="select"><option value="low">Низкое</option><option value="medium">Среднее</option><option value="high">Высокое</option></select>`;
      const q = row2.querySelector('select'); q.value = cfg.quality;
      q.onchange = () => this.app.save.setSetting('quality', q.value);
      list.appendChild(row2);

      const row3 = document.createElement('div');
      row3.className = 'setting-row';
      row3.innerHTML = `<h4>Сложность ИИ</h4><p>Скорость решений и давление противника.</p><select class="select"><option value="easy">Легко</option><option value="normal">Нормально</option><option value="hard">Сложно</option></select>`;
      const d = row3.querySelector('select'); d.value = cfg.difficulty;
      d.onchange = () => this.app.save.setSetting('difficulty', d.value);
      list.appendChild(row3);

      const row4 = document.createElement('div');
      row4.className = 'setting-row';
      row4.innerHTML = `<h4>Доступность</h4><p>Смена цветов команд для удобства.</p><div class="toggle-line"><span>Режим дальтонизма</span></div>`;
      row4.querySelector('.toggle-line').appendChild(this.makeSwitch(cfg.colorblind, v => this.app.save.setSetting('colorblind', v)));
      list.appendChild(row4);

      const row5 = document.createElement('div');
      row5.className = 'setting-row';
      row5.innerHTML = `<h4>Данные</h4><p>Удалить колоду, настройки и статистику.</p><button class="btn warn">Сбросить сохранение</button>`;
      row5.querySelector('button').onclick = () => {
        if (confirm('Сбросить все данные?')) {
          this.app.save.reset();
          this.menu.tip('Данные сброшены. Обновление интерфейса...');
          this.app.reloadMenu();
        }
      };
      list.appendChild(row5);
    }
  }

  class AppController {
    constructor() {
      this.canvas = document.getElementById('battleCanvas');
      this.ctx = this.canvas.getContext('2d');
      this.uiRoot = document.getElementById('uiRoot');
      this.input = new InputSystem(this.canvas);
      this.save = new SaveSystem();
      this.audio = new AudioSystem(this.save);
      this.cardRenderer = new CardRenderer();
      this.menuUI = new MenuUI(this);
      this.homeUI = this.menuUI.homeUI;
      this.state = APP_STATES.BOOT;
      this.scene = null;
      this.acc = 0;
      this.step = 1/60;
      this.last = performance.now();
      this.fps = 60;
      this.fpsSmooth = 60;
      this.bindKeys();
      this.enterMenu();
      requestAnimationFrame(this.loop.bind(this));
    }
    bindKeys() {
      window.addEventListener('keydown', (e) => {
        if (e.key.toLowerCase() === 'd') {
          this.save.setDebug(!this.save.data.settings.debug);
          this.menuUI.tip(`Отладка ${this.save.data.settings.debug ? 'ВКЛ':'ВЫКЛ'}`);
        }
      });
      window.addEventListener('contextmenu', (e) => {
        if (this.state === APP_STATES.BATTLE && this.scene?.selectedCard) {
          e.preventDefault();
          this.scene.selectedCard = null;
          this.scene.ui.refreshHand();
        }
      });
    }
    setState(s) { this.state = s; }
    reloadMenu() {
      this.menuUI.homeUI.render();
      this.menuUI.collectionUI.renderGrid();
      this.menuUI.deckUI.deck = [...this.save.data.selectedDeck];
      this.menuUI.deckUI.render();
      this.menuUI.settingsUI.render();
      this.menuUI.refreshTop();
    }
    enterMenu() {
      this.setState(APP_STATES.MAIN_MENU);
      this.menuUI.showMenu(true);
      this.menuUI.showBattle(false);
      if (this.scene) { this.scene.destroy(); this.scene = null; }
      this.reloadMenu();
    }
    startBattle() {
      this.scene?.destroy();
      this.scene = new BattleScene(this);
      this.menuUI.showMenu(false);
      this.menuUI.showBattle(true);
      this.setState(APP_STATES.BATTLE);
    }
    onBattleFinished(stats) {
      this.setState(APP_STATES.RESULTS);
      this.save.updateStats({ result: stats.result, playerCrowns: stats.crowns.player, enemyCrowns: stats.crowns.enemy });
      this.menuUI.refreshTop();
      this.menuUI.showResults(stats);
    }
    update(dt) {
      if (this.state === APP_STATES.BATTLE && this.scene) {
        this.scene.update(dt);
      }
      this.audio.update(dt, this.state === APP_STATES.BATTLE);
    }
    render() {
      if (this.state === APP_STATES.BATTLE && this.scene) {
        this.scene.render();
        this.menuUI.updateDebug(this.scene, this.fpsSmooth);
      } else {
        const g = this.ctx.createLinearGradient(0,0,0,H);
        g.addColorStop(0,'#1a2c45'); g.addColorStop(1,'#0c1728');
        this.ctx.fillStyle = g;
        this.ctx.fillRect(0,0,W,H);
      }
    }
    loop(now) {
      const dt = Math.min(0.033, (now - this.last) / 1000);
      this.last = now;
      this.fps = 1 / dt;
      this.fpsSmooth = lerp(this.fpsSmooth, this.fps, 0.09);
      this.acc += dt;
      while (this.acc >= this.step) {
        this.update(this.step);
        this.acc -= this.step;
      }
      this.render();
      this.input.endFrame();
      requestAnimationFrame(this.loop.bind(this));
    }
  }

  new AppController();
})();
</script>
</body>
</html>
