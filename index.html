<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arena Engine</title>
<style>
:root{--bg:#0b1220;--panel:#121c2e;--line:#2a3a57;--text:#d8e6ff;--muted:#9bb0d8;--good:#22c55e;--bad:#ef4444;--cyan:#22d3ee;--gold:#f59e0b}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at top,#111b31,#090f1c 60%);font-family:Arial,sans-serif;color:var(--text)}
#app{height:100%;display:flex;align-items:center;justify-content:center}.frame{width:min(100vw,520px);height:100%;max-height:960px;border:1px solid var(--line);position:relative;overflow:hidden;background:#0b1220}
.screen{position:absolute;inset:0;opacity:0;pointer-events:none;transform:translateX(20px);transition:.3s}.screen.active{opacity:1;pointer-events:auto;transform:none}
.top{height:72px;padding:10px 12px;background:linear-gradient(180deg,#192744,#111a2e);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.main{position:absolute;top:72px;bottom:72px;left:0;right:0;overflow:auto;padding:12px}.card{border:1px solid var(--line);background:#121b30;border-radius:12px;padding:10px;margin-bottom:10px}
.btn{background:#1b2b49;color:#d2e1ff;border:1px solid #2f4671;padding:8px 10px;border-radius:10px;cursor:pointer}.primary{width:100%;padding:14px;font-weight:700;background:linear-gradient(180deg,#5eead4,#0ea5a4);color:#03262b;border:0;border-radius:12px;cursor:pointer}
.nav{position:absolute;bottom:0;left:0;right:0;height:72px;background:#0a1221;border-top:1px solid var(--line);display:flex}.nav button{flex:1;background:none;border:0;color:#9cb1d8}
#battleCanvas{position:absolute;inset:0 0 128px 0;width:100%;height:calc(100% - 128px);display:block;background:linear-gradient(180deg,#113161,#195789 45%,#1d5b24 46%,#17471f)}
#hud{position:absolute;left:0;right:0;bottom:0;height:128px;border-top:1px solid var(--line);background:#0b1528}
#hand{display:flex;gap:8px;padding:8px;overflow:auto}.hand-card{min-width:100px;border:1px solid #335386;background:#12203c;border-radius:10px;padding:8px;cursor:pointer}.hand-card.sel{outline:2px solid var(--cyan)}
.energy{height:22px;margin:6px 10px;border:1px solid #365383;background:#172540;border-radius:999px;overflow:hidden;position:relative}.energy>div{height:100%;width:0%;background:linear-gradient(90deg,#60a5fa,#22d3ee)}.energy span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
#toast{position:absolute;top:84px;left:12px;right:12px;display:flex;flex-direction:column;gap:6px;pointer-events:none}.toast{background:#10203b;border:1px solid #324a74;padding:8px;border-radius:10px}
.modal{position:absolute;inset:0;background:rgba(2,6,14,.82);display:none;align-items:center;justify-content:center;z-index:10}.modal.show{display:flex}.modal-card{width:92%;max-height:92%;overflow:auto;background:#0e1a31;border:1px solid #2c446d;border-radius:14px;padding:14px}
.small{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<div id="app"><div class="frame" id="frame"></div></div>
<script>
'use strict';

const CARD_POOL = Array.from({length:64}, (_,i)=>({
  id:'c'+(i+1), name:['Blade','Archer','Mage','Tank','Rogue','Frost'][i%6]+' '+(i+1),
  cost:2+i%6, hp:190+i*8, damage:24+i%34, speed:58+i%16, range: i%2?32:140,
  attackRate:0.7+(i%5)*0.15, critChance:0.06+(i%4)*0.02, critMul:1.5+(i%3)*0.3,
  projectile:!!(i%2), status:['none','burn','slow','freeze','speed'][i%5], color:`hsl(${(i*27)%360} 75% 60%)`
}));

class BalanceConfigSystem{constructor(){this.cfg={matchDuration:180,overtimeDuration:60,maxEnergy:10,regenRate:0.75,regenDelay:1.15,comboWindow:2.2,cell:70,profiler:false};}get(k){return this.cfg[k];}}
class EventDispatcher{constructor(){this.m=new Map();}on(t,f){if(!this.m.has(t))this.m.set(t,[]);this.m.get(t).push(f);}emit(t,p){(this.m.get(t)||[]).forEach(f=>f(p));}}
class TweenManager{constructor(){this.t=[];}to(o,k,a,b,d){this.t.push({o,k,a,b,d,t:0});o[k]=a;}update(dt){this.t=this.t.filter(x=>{x.t+=dt;const p=Math.min(1,x.t/x.d);x.o[x.k]=x.a+(x.b-x.a)*(1-Math.pow(1-p,3));return p<1;});}}
class AnimationEngine{constructor(){this.tween=new TweenManager();}update(dt){this.tween.update(dt);}flash(e,c='#fff'){e.flash=0.12;e.flashC=c;}pulse(e){this.tween.to(e,'scale',1,1.2,0.12);setTimeout(()=>this.tween.to(e,'scale',1.2,1,0.12),120);}}
class CameraSystem{constructor(){this.shake=0;this.slow=1;}impact(p){this.shake=Math.max(this.shake,p);}victory(){this.slow=.45;setTimeout(()=>this.slow=1,900);}update(dt){this.shake=Math.max(0,this.shake-dt*3);}apply(ctx){ctx.setTransform(1,0,0,1,(Math.random()-.5)*this.shake*10,(Math.random()-.5)*this.shake*10);}}
class EntityManager{constructor(){this.units=[];this.towers=[];this.projectiles=[];this.particles=[];this.damageNumbers=[];this.id=1;}nid(){return this.id++;}cleanup(){for(const k of ['units','projectiles','particles','damageNumbers']){this[k]=this[k].filter(e=>!e.dead);}}}
class SpatialGrid{constructor(cell){this.cell=cell;this.m=new Map();}clear(){this.m.clear();}k(x,y){return ((x/this.cell)|0)+','+((y/this.cell)|0);}add(u){const k=this.k(u.x,u.y);if(!this.m.has(k))this.m.set(k,[]);this.m.get(k).push(u);}near(x,y,r){let o=[];const c=this.cell,ax=((x-r)/c)|0,bx=((x+r)/c)|0,ay=((y-r)/c)|0,by=((y+r)/c)|0;for(let i=ax;i<=bx;i++)for(let j=ay;j<=by;j++){const a=this.m.get(i+','+j);if(a)o=o.concat(a);}return o;}}
class ParticleEngine{constructor(em){this.em=em;}burst(x,y,c,n=14){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=70+Math.random()*170;this.em.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.35,size:2+Math.random()*3,c,dead:false});}}shock(x,y){this.em.particles.push({x,y,life:.3,size:6,shock:true,dead:false,c:'rgba(255,255,255,.6)'});}update(dt){for(const p of this.em.particles){p.life-=dt;if(p.life<=0)p.dead=true;if(p.shock){p.size+=260*dt;continue;}p.vy+=90*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}}render(ctx){for(const p of this.em.particles){ctx.globalAlpha=Math.max(0,p.life*2);if(p.shock){ctx.strokeStyle=p.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.stroke();}else{ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();}}ctx.globalAlpha=1;}}
class SoundEngine{constructor(){this.ctx=null;this.vol=.2;}a(){if(!this.ctx)this.ctx=new (window.AudioContext||window.webkitAudioContext)();}tone(f,t=.08,type='sine',g=.12){this.a();const o=this.ctx.createOscillator(),gain=this.ctx.createGain();o.type=type;o.frequency.value=f;gain.gain.value=g*this.vol;o.connect(gain);gain.connect(this.ctx.destination);o.start();gain.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+t);o.stop(this.ctx.currentTime+t);}hit(){this.tone(390,.05,'square',.14)}death(){this.tone(150,.2,'sawtooth',.25)}tower(){this.tone(90,.38,'sawtooth',.34)}crit(){this.tone(760,.08,'triangle',.2)}place(){this.tone(500,.05,'sine',.12)}victory(){this.tone(640,.2,'triangle',.2);setTimeout(()=>this.tone(860,.25,'triangle',.2),180)}defeat(){this.tone(180,.3,'sine',.28)}}
class DamageNumberSystem{constructor(em){this.em=em;}spawn(x,y,v,crit){this.em.damageNumbers.push({x,y,v,crit,life:.8,vy:-22,dead:false});}update(dt){for(const d of this.em.damageNumbers){d.life-=dt;d.y+=d.vy*dt;d.vy-=8*dt;if(d.life<=0)d.dead=true;}}render(ctx){for(const d of this.em.damageNumbers){ctx.globalAlpha=Math.max(0,d.life*1.4);ctx.fillStyle=d.crit?'#fbbf24':'#ffe4e6';ctx.font=(d.crit?20:15)+'px Arial';ctx.fillText(Math.round(d.v)+(d.crit?'!':''),d.x,d.y);}ctx.globalAlpha=1;}}
class StatusEffectSystem{apply(t,type,p=.2,d=1.4){if(type==='none')return;t.effects=t.effects||[];t.effects.push({type,p,d});}update(t,dt){t.moveM=1;t.atkM=1;if(!t.effects)return;for(const e of t.effects){e.d-=dt;if(e.type==='freeze'){t.moveM*=0;t.atkM*=.5;}if(e.type==='slow')t.moveM*=Math.max(.2,1-e.p);if(e.type==='speed')t.moveM*=1+e.p;if(e.type==='burn')t.dot=(t.dot||0)+(t.maxHp*.015+5*e.p)*dt;}t.effects=t.effects.filter(e=>e.d>0);}}
class DeathSystem{constructor(core){this.core=core;}killUnit(u){if(u.dead)return;u.hitbox=false;u.dead=true;this.core.anim.flash(u,'#ffd4dc');this.core.particles.burst(u.x,u.y,u.color,16);this.core.particles.shock(u.x,u.y);this.core.sound.death();this.core.events.emit('unitDeath',u);}killTower(t){if(t.dead)return;t.hitbox=false;t.dead=true;this.core.particles.burst(t.x,t.y,'#ffcaa6',44);this.core.particles.shock(t.x,t.y);this.core.sound.tower();this.core.events.emit('towerDestroyed',t);}}
class EnergySystem{constructor(b){this.max=b.get('maxEnergy');this.cur=5;this.rate=b.get('regenRate');this.delay=0;this.delaySet=b.get('regenDelay');this.capFx=0;}use(c){if(this.cur<c)return false;this.cur-=c;this.delay=this.delaySet;return true;}update(dt){if(this.delay>0){this.delay-=dt;return;}this.cur=Math.min(this.max,this.cur+this.rate*dt);this.capFx=this.cur>=this.max?Math.min(1,this.capFx+dt*2):Math.max(0,this.capFx-dt*3);}}
class AdvancedAISystem{constructor(core){this.core=core;this.t=.9;}update(dt){this.t-=dt;if(this.t>0)return;this.t=.8+Math.random()*.5;const c=this.pick();const lane=this.lane();this.core.spawn(c,'ai',lane);}pick(){const e=this.core.em.units.filter(u=>u.team==='player'&&!u.dead);if(!e.length)return CARD_POOL[(Math.random()*CARD_POOL.length)|0];const ranged=e.filter(x=>x.range>60).length;const pref=ranged?'Rogue':'Tank';return CARD_POOL.find(c=>c.name.includes(pref))||CARD_POOL[(Math.random()*CARD_POOL.length)|0];}lane(){const a=this.scoreLane(.3),b=this.scoreLane(.7);return a>b?0:1;}scoreLane(y){const e=this.core.em.units;const fr=e.filter(u=>u.team==='ai'&&Math.abs(u.y-this.core.h*y)<110&&!u.dead).length;const en=e.filter(u=>u.team==='player'&&Math.abs(u.y-this.core.h*y)<110&&!u.dead).length;return en*2-fr+Math.random();}}
class TrophyLeagueSystem{constructor(){this.t=+(localStorage.getItem('trophies')||1200);this.h=JSON.parse(localStorage.getItem('history')||'[]');}league(){const t=this.t;return t<1000?'Bronze':t<1400?'Silver':t<1800?'Gold':t<2300?'Platinum':t<2800?'Diamond':'Master';}apply(win,c){const d=win?26+c*3:-(18-c*2);this.t=Math.max(0,this.t+d);localStorage.setItem('trophies',this.t);return d;}add(m){this.h.unshift(m);this.h=this.h.slice(0,25);localStorage.setItem('history',JSON.stringify(this.h));}}
class MatchResultSystem{constructor(core){this.core=core;}result(){const p=this.core.main('player'),a=this.core.main('ai');if(!p.dead&&a.dead)return{winner:'player',reason:'Enemy main tower destroyed'};if(p.dead&&!a.dead)return{winner:'ai',reason:'Main tower destroyed'};const pd=this.core.state.destroy.player,ad=this.core.state.destroy.ai;if(pd!==ad)return{winner:pd<ad?'player':'ai',reason:'Crowns'};const php=this.core.em.towers.filter(t=>t.team==='player').reduce((s,t)=>s+Math.max(0,t.hp),0);const ahp=this.core.em.towers.filter(t=>t.team==='ai').reduce((s,t)=>s+Math.max(0,t.hp),0);if(php===ahp)return{winner:'draw',reason:'Tie'};return{winner:php>ahp?'player':'ai',reason:'Tower HP'};}}
class InputRouter{constructor(core){this.core=core;this.sel=null;}bind(canvas,hand){hand.addEventListener('click',e=>{const c=e.target.closest('.hand-card');if(!c)return;this.sel=c.dataset.id;[...hand.children].forEach(n=>n.classList.toggle('sel',n===c));});canvas.addEventListener('click',e=>{if(!this.sel)return;const card=CARD_POOL.find(c=>c.id===this.sel);const r=canvas.getBoundingClientRect();const x=(e.clientX-r.left)*this.core.w/r.width,y=(e.clientY-r.top)*this.core.h/r.height;if(y<this.core.h*.5)return this.core.toast('Deploy on your side');this.core.spawn(card,'player',y<this.core.h*.72?0:1,x,y);});}}
class CombatSystem{constructor(core){this.core=core;this.grid=new SpatialGrid(core.balance.get('cell'));}update(dt){const em=this.core.em;this.grid.clear();em.units.forEach(u=>!u.dead&&this.grid.add(u));for(const u of em.units){if(u.dead)continue;this.unit(u,dt);}for(const p of em.projectiles){if(p.dead)continue;this.proj(p,dt);}}target(u){const near=this.grid.near(u.x,u.y,u.range+40).filter(e=>!e.dead&&e.team!==u.team);if(near.length)return near.sort((a,b)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(b.x-u.x,b.y-u.y))[0];const towers=this.core.em.towers.filter(t=>!t.dead&&t.team!==u.team);if(!towers.length)return null;return towers.sort((a,b)=>Math.hypot(a.x-u.x,a.y-u.y)-Math.hypot(b.x-u.x,b.y-u.y))[0];}unit(u,dt){const t=this.target(u);if(!t){u.y+=(u.team==='player'?-1:1)*u.speed*dt*.4;return;}const dx=t.x-u.x,dy=t.y-u.y,d=Math.hypot(dx,dy);if(d<=u.range){u.cd-=dt*(u.atkM||1);if(u.cd<=0){u.cd=u.attackRate;this.attack(u,t);}}else{const m=u.speed*(u.moveM||1);u.x+=dx/(d||1)*m*dt;u.y+=dy/(d||1)*m*dt;}}attack(a,t){const crit=Math.random()<a.critChance,dmg=a.damage*(crit?a.critMul:1);if(a.projectile)this.core.em.projectiles.push({id:this.core.em.nid(),x:a.x,y:a.y,tid:t.id,team:a.team,dmg,crit,s:a.status,spd:280,color:a.color,trail:[],dead:false});else this.core.damage.push({to:t,dmg,crit,s:a.status});if(crit)this.core.sound.crit();else this.core.sound.hit();a.combo.t=performance.now();a.combo.c++;}proj(p,dt){const t=this.core.find(p.tid);if(!t||t.dead)return p.dead=true;const dx=t.x-p.x,dy=t.y-p.y,d=Math.hypot(dx,dy);p.trail.push([p.x,p.y]);if(p.trail.length>7)p.trail.shift();if(d<10){this.core.damage.push({to:t,dmg:p.dmg,crit:p.crit,s:p.s});this.core.particles.burst(p.x,p.y,p.color,7);this.core.particles.shock(p.x,p.y);return p.dead=true;}p.x+=dx/(d||1)*p.spd*dt;p.y+=dy/(d||1)*p.spd*dt;}}
class GameCore{constructor(ui){this.ui=ui;this.balance=new BalanceConfigSystem();this.events=new EventDispatcher();this.anim=new AnimationEngine();this.camera=new CameraSystem();this.em=new EntityManager();this.particles=new ParticleEngine(this.em);this.damageNumbers=new DamageNumberSystem(this.em);this.status=new StatusEffectSystem();this.death=new DeathSystem(this);this.energy=new EnergySystem(this.balance);this.ai=new AdvancedAISystem(this);this.trophies=new TrophyLeagueSystem();this.resultCalc=new MatchResultSystem(this);this.sound=new SoundEngine();this.input=new InputRouter(this);this.combat=new CombatSystem(this);this.damage=[];this.state={time:this.balance.get('matchDuration'),ot:false,ended:false,destroy:{player:0,ai:0},stats:{dealt:0,taken:0,kills:0,deaths:0,spawns:0,crits:0}};this.combo={c:0,t:0};this.prof={on:false,t:{input:0,logic:0,col:0,damage:0,cleanup:0,render:0},m:{}};this.bindEvents();}
bindEvents(){this.events.on('towerDestroyed',t=>{if(t.team==='player')this.state.destroy.player++;else this.state.destroy.ai++;if(t.main)this.finish(t.team==='player'?'ai':'player','Main tower destroyed');});this.events.on('unitDeath',u=>{if(u.team==='player')this.state.stats.deaths++;else this.state.stats.kills++;});}
init(canvas){this.canvas=canvas;this.ctx=canvas.getContext('2d');this.resize();window.addEventListener('resize',()=>this.resize());this.input.bind(this.canvas,this.ui.hand);this.spawnTowers();this.newHand();requestAnimationFrame(t=>this.loop(t));}
resize(){const r=this.canvas.getBoundingClientRect();this.canvas.width=r.width*devicePixelRatio;this.canvas.height=r.height*devicePixelRatio;this.ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);this.w=r.width;this.h=r.height;}
mark(n){if(!this.prof.on)return;this.prof.m[n]=performance.now();}end(n,k){if(!this.prof.on)return;this.prof.t[k]=this.prof.t[k]*.85+(performance.now()-this.prof.m[n])*.15;}
spawnTowers(){const mk=(team,x,y,main=false)=>({id:this.em.nid(),team,x,y,maxHp:main?3200:1900,hp:main?3200:1900,w:40,h:56,main,dead:false,hitbox:true,color:team==='player'?'#60a5fa':'#f87171'});this.em.towers.push(mk('player',this.w*.25,this.h*.8),mk('player',this.w*.75,this.h*.8),mk('player',this.w*.5,this.h*.9,true),mk('ai',this.w*.25,this.h*.2),mk('ai',this.w*.75,this.h*.2),mk('ai',this.w*.5,this.h*.1,true));}
main(team){return this.em.towers.find(t=>t.team===team&&t.main);}find(id){for(const a of [this.em.units,this.em.towers]){const e=a.find(x=>x.id===id&&!x.dead);if(e)return e;}return null;}
newHand(){this.hand=Array.from({length:4},()=>CARD_POOL[(Math.random()*CARD_POOL.length)|0]);this.ui.hand.innerHTML=this.hand.map(c=>`<div class='hand-card' data-id='${c.id}'><div>${c.name}</div><div class='small'>${c.cost} energy</div></div>`).join('');}
spawn(card,team,lane=0,x=null,y=null){if(team==='player'&&!this.energy.use(card.cost)){this.toast('No energy');return false;}const py=team==='player'?(lane?this.h*.84:this.h*.68):(lane?this.h*.16:this.h*.32);const u={id:this.em.nid(),team,x:x??this.w*(.2+Math.random()*.6),y:y??py,maxHp:card.hp,hp:card.hp,damage:card.damage,speed:card.speed,range:card.range,attackRate:card.attackRate,cd:Math.random()*card.attackRate,critChance:card.critChance,critMul:card.critMul,projectile:card.projectile,status:card.status,color:card.color,radius:10+card.cost,dead:false,hitbox:true,moveM:1,atkM:1,scale:1,flash:0,flashC:'#fff',combo:this.combo};this.em.units.push(u);this.state.stats.spawns++;this.sound.place();return true;}
processDamage(){for(const h of this.damage){const t=h.to;if(!t||t.dead||!t.hitbox)continue;t.hp-=h.dmg;if(t.team==='ai')this.state.stats.dealt+=h.dmg;else this.state.stats.taken+=h.dmg;if(h.crit)this.state.stats.crits++;this.damageNumbers.spawn(t.x,t.y-10,h.dmg,h.crit);this.anim.flash(t,h.crit?'#ffe08a':'#fff');if(h.s&&h.s!=='none')this.status.apply(t,h.s,.2,1.6);this.camera.impact(h.crit?.22:.1);if(t.hp<=0){if('main' in t||'w' in t)this.death.killTower(t);else this.death.killUnit(t);}}this.damage.length=0;}
finish(winner,reason){if(this.state.ended)return;this.state.ended=true;const win=winner==='player';const stars=Math.max(0,Math.min(3,this.state.destroy.ai-this.state.destroy.player+1));const delta=this.trophies.apply(win,stars);const m={date:new Date().toISOString(),winner,reason,delta,league:this.trophies.league(),stats:this.state.stats};this.trophies.add(m);if(win){this.camera.victory();this.sound.victory();}else this.sound.defeat();setTimeout(()=>this.showResult(m),800);}
showResult(m){this.ui.result.innerHTML=`<h2>${m.winner==='player'?'Victory':m.winner==='ai'?'Defeat':'Draw'}</h2><div class='small'>${m.reason}</div><h3>${m.delta>=0?'+':''}${m.delta} trophies</h3><div class='small'>League: ${m.league}</div><div class='grid'><div class='card'>Damage dealt<br><b>${Math.round(m.stats.dealt)}</b></div><div class='card'>Damage taken<br><b>${Math.round(m.stats.taken)}</b></div><div class='card'>Kills<br><b>${m.stats.kills}</b></div><div class='card'>Deaths<br><b>${m.stats.deaths}</b></div><div class='card'>Units spawned<br><b>${m.stats.spawns}</b></div><div class='card'>Critical hits<br><b>${m.stats.crits}</b></div></div><button class='primary' id='exitBtn'>Back to menu</button>`;this.ui.modal.classList.add('show');this.ui.result.querySelector('#exitBtn').onclick=()=>location.reload();}
toast(s){const d=document.createElement('div');d.className='toast';d.textContent=s;this.ui.toast.appendChild(d);setTimeout(()=>d.remove(),1400);}
update(dt0){const dt=dt0*this.camera.slow;this.mark('i');this.end('i','input');this.mark('l');if(!this.state.ended){this.state.time-=dt;if(this.state.time<=0&&!this.state.ot){this.state.ot=true;this.state.time=this.balance.get('overtimeDuration');this.toast('Overtime!');}else if(this.state.time<=0&&this.state.ot){const r=this.resultCalc.result();this.finish(r.winner,r.reason);}this.energy.update(dt);this.ai.update(dt);}for(const u of this.em.units){if(u.dead)continue;this.status.update(u,dt);if(u.dot){this.damage.push({to:u,dmg:u.dot,crit:false,s:'none'});u.dot=0;}if(u.flash>0)u.flash-=dt;}this.anim.update(dt);this.camera.update(dt);this.end('l','logic');this.mark('c');this.combat.update(dt);this.end('c','col');this.mark('d');this.processDamage();this.end('d','damage');this.mark('x');this.particles.update(dt);this.damageNumbers.update(dt);this.em.cleanup();this.end('x','cleanup');}
render(){const c=this.ctx;c.clearRect(0,0,this.w,this.h);this.camera.apply(c);c.fillStyle=this.state.ot?'rgba(255,90,90,.12)':'rgba(255,255,255,.02)';c.fillRect(0,0,this.w,this.h);c.setLineDash([8,6]);c.strokeStyle='rgba(255,255,255,.18)';c.beginPath();c.moveTo(0,this.h*.5);c.lineTo(this.w,this.h*.5);c.stroke();c.setLineDash([]);for(const t of this.em.towers){if(t.dead)continue;c.fillStyle=t.color;c.fillRect(t.x-t.w/2,t.y-t.h/2,t.w,t.h);const hp=Math.max(0,t.hp)/t.maxHp;c.fillStyle='#172946';c.fillRect(t.x-34,t.y-t.h/2-12,68,7);c.fillStyle=hp>.5?'#22c55e':hp>.25?'#f59e0b':'#ef4444';c.fillRect(t.x-34,t.y-t.h/2-12,68*hp,7);}for(const p of this.em.projectiles){for(let i=0;i<p.trail.length;i++){const q=p.trail[i];c.globalAlpha=i/p.trail.length*.5;c.fillStyle=p.color;c.beginPath();c.arc(q[0],q[1],2,0,Math.PI*2);c.fill();}c.globalAlpha=1;c.fillStyle=p.color;c.beginPath();c.arc(p.x,p.y,4,0,Math.PI*2);c.fill();}for(const u of this.em.units){if(u.dead)continue;c.save();c.translate(u.x,u.y);c.scale(u.scale||1,u.scale||1);c.fillStyle=u.flash>0?u.flashC:u.color;c.beginPath();c.arc(0,0,u.radius,0,Math.PI*2);c.fill();c.fillStyle='#0a1325';c.fillRect(-u.radius,-u.radius-7,u.radius*2,4);c.fillStyle='#22c55e';c.fillRect(-u.radius,-u.radius-7,(u.hp/u.maxHp)*u.radius*2,4);c.restore();}this.particles.render(c);this.damageNumbers.render(c);if(this.combo.c>1&&performance.now()-this.combo.t<2200){c.fillStyle='#ffe08a';c.font='bold 24px Arial';c.fillText('Combo x'+this.combo.c,this.w*.35,this.h*.5-20);}else if(performance.now()-this.combo.t>2200)this.combo.c=0;if(this.prof.on){c.fillStyle='rgba(0,0,0,.5)';c.fillRect(6,6,this.w-12,20);c.fillStyle='#8ee6ff';c.font='12px monospace';c.fillText(Object.entries(this.prof.t).map(([k,v])=>k+':'+v.toFixed(2)).join(' | '),10,20);}this.ui.energyFill.style.width=(this.energy.cur/this.energy.max*100)+'%';this.ui.energyFill.style.filter=this.energy.capFx?'brightness('+(1+this.energy.capFx*.6)+')':'none';this.ui.energyLabel.textContent='Energy '+this.energy.cur.toFixed(1)+' / '+this.energy.max;this.ui.timer.textContent=(this.state.ot?'OT ':'')+Math.ceil(this.state.time)+'s';this.ui.trophies.textContent='Trophies '+this.trophies.t+' ('+this.trophies.league()+')';}
loop(ts){this.lt=this.lt||ts;const dt=Math.min(.05,(ts-this.lt)/1000);this.lt=ts;this.update(dt);this.mark('r');this.render();this.end('r','render');requestAnimationFrame(t=>this.loop(t));}}

function mount(){const frame=document.getElementById('frame');frame.innerHTML=`<section class='screen active' id='menu'><div class='top'><div><b>Arena Engine Rewrite</b><div class='small' id='menuT'></div></div><button class='btn' id='historyBtn'>History</button></div><div class='main'><div class='card'><b>Battle rewrite complete</b><div class='small'>Input → logic → collision → damage → cleanup → render.</div></div><div class='card'><b>Major systems</b><div class='small'>GameCore, EntityManager, CombatSystem, DeathSystem, StatusEffectSystem, AnimationEngine, TweenManager, CameraSystem, AdvancedAISystem, TrophyLeagueSystem, MatchResultSystem, EnergySystem, BalanceConfigSystem, DamageNumberSystem, ParticleEngine, SoundEngine, InputRouter.</div></div><button class='primary' id='start'>Start Ranked</button></div><div class='nav'><button>Battle</button><button>Cards</button><button>Profile</button></div></section><section class='screen' id='battle'><canvas id='battleCanvas'></canvas><div id='toast'></div><div id='hud'><div class='top' style='height:42px;padding:6px 10px'><div id='timer'>180s</div><div id='trophy'>Trophies</div><button class='btn' id='prof'>Profiler</button></div><div class='energy'><div id='energyFill'></div><span id='energyLabel'>Energy</span></div><div id='hand'></div></div></section><div class='modal' id='history'><div class='modal-card'><h3>Match history</h3><div id='historyList'></div><button class='btn' id='closeH'>Close</button></div></div><div class='modal' id='resultModal'><div class='modal-card' id='resultBody'></div></div>`;
const ui={menu:frame.querySelector('#menu'),battle:frame.querySelector('#battle'),start:frame.querySelector('#start'),historyBtn:frame.querySelector('#historyBtn'),history:frame.querySelector('#history'),historyList:frame.querySelector('#historyList'),closeH:frame.querySelector('#closeH'),canvas:frame.querySelector('#battleCanvas'),toast:frame.querySelector('#toast'),hand:frame.querySelector('#hand'),energyFill:frame.querySelector('#energyFill'),energyLabel:frame.querySelector('#energyLabel'),timer:frame.querySelector('#timer'),trophies:frame.querySelector('#trophy'),menuT:frame.querySelector('#menuT'),prof:frame.querySelector('#prof'),modal:frame.querySelector('#resultModal'),result:frame.querySelector('#resultBody')};
const tr=new TrophyLeagueSystem();ui.menuT.textContent='Trophies: '+tr.t+' | '+tr.league();ui.historyBtn.onclick=()=>{ui.historyList.innerHTML=tr.h.length?tr.h.map(m=>`<div class='card'><b>${m.winner.toUpperCase()}</b> - ${m.reason}<div class='small'>${new Date(m.date).toLocaleString()} | Δ ${m.delta}</div></div>`).join(''):'<div class="small">No matches.</div>';ui.history.classList.add('show');};ui.closeH.onclick=()=>ui.history.classList.remove('show');ui.start.onclick=()=>{ui.menu.classList.remove('active');ui.battle.classList.add('active');const core=new GameCore(ui);window.core=core;core.init(ui.canvas);ui.prof.onclick=()=>core.prof.on=!core.prof.on;};}
mount();
</script>
